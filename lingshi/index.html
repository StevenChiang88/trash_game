<style>
  /* 與發佈環境相同的最小底座：上下避開瀏海與手勢列 */
  html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

<title>絕命鈴師</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;900&family=Fredoka:wght@600;700&display=swap">
<style>
/* 版面：療養院的一格畫面。上面是阿伯想說的那句話（字旁邊標注音），中間左邊是阿伯、右邊是拿槍的姪子，
   注音板在畫面中央，最下面是輪椅扶手上的銅鈴。整個畫面點哪裡都是按鈴 */
:root{
  --ink:#2b2a3a;        /* 描邊與文字 */
  --paper:#fff8ea;      /* 注音板、卡片的紙白 */
  --brass:#e8b53a;      /* 銅鈴：主色 */
  --brass-deep:#b07a16;
  --scrub:#3a9a94;      /* 藍綠：耐心條、按對 */
  --alert:#e4572e;      /* 按錯、正在拼的那個注音 */
  --ok:#2f9a7c;
  --wall:#e9d6b0;       /* 療養院的牆 */
  --backdrop:#1c1b29;   /* 電腦版：手機畫面外的底色 */
  --display:"Fredoka","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --sticker:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 -2.5px 0 var(--ink),0 2.5px 0 var(--ink),-2.5px 0 0 var(--ink),2.5px 0 0 var(--ink);
}
html,body{height:100%;touch-action:manipulation}
button{touch-action:manipulation}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none;display:grid;place-items:center}
#game{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:8px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.left{display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.count{display:flex;align-items:baseline;gap:5px;font-family:var(--display);color:var(--paper);text-shadow:var(--sticker);line-height:1}
.count small{font-family:var(--body);font-weight:900;font-size:15px}
.count b{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
/* 姪子的耐心：一直慢慢掉，按對會補、按錯扣一大截，掉光就結束 */
.pat{display:flex;flex-direction:column;gap:3px;width:150px}
.pat span{font-weight:900;font-size:12px;color:var(--paper);text-shadow:var(--sticker);line-height:1}
.timer{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--scrub);transform-origin:left center}
.timer.low i{background:var(--alert)}
.icon-btn{pointer-events:auto;width:40px;height:40px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);cursor:pointer;padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn:focus-visible,.btn:focus-visible{outline:3px solid var(--scrub);outline-offset:3px}
.gap{flex:1}
.hint{align-self:center;margin-top:auto;margin-bottom:4px;text-align:center;font-weight:900;font-size:17px;color:var(--paper);text-shadow:var(--sticker);min-height:1.5em;text-wrap:balance}
.btn{pointer-events:auto;font:inherit;font-weight:900;font-size:20px;color:var(--ink);background:var(--brass);border:3px solid var(--ink);border-radius:16px;padding:12px 30px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);font-size:16px;padding:10px 20px}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:28px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
#title{background:linear-gradient(rgba(28,27,41,.55),rgba(28,27,41,0) 32%,rgba(28,27,41,0) 76%,rgba(28,27,41,.55))}
.logo{margin:5vh 0 0;font-weight:900;font-size:clamp(50px,16vw,80px);line-height:1;letter-spacing:.02em;color:var(--paper);text-shadow:var(--sticker),0 7px 0 var(--ink);transform:rotate(-3deg)}
.logo span{display:inline-block;color:var(--brass)}
.tag{margin:6px 0 0;font-weight:900;font-size:17px;color:var(--paper);text-shadow:var(--sticker);text-wrap:balance}
.how{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0;padding:0;list-style:none;font-size:14px}
.how li{padding:6px 12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.how b{font-weight:900;color:var(--brass-deep)}
.best{font-weight:900;font-size:14px;color:var(--paper);text-shadow:var(--sticker);min-height:1.4em}
.home{pointer-events:auto;font-weight:900;font-size:14px;color:var(--paper);text-shadow:var(--sticker);text-underline-offset:4px}

#over,#pause{justify-content:center;background:rgba(28,27,41,.5)}
.card{width:min(330px,100%);display:flex;flex-direction:column;gap:14px;padding:18px;border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--ink);text-align:left;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateY(30px) scale(.94);opacity:0}}
.verdict{margin:0;font-weight:900;font-size:30px;line-height:1.25}
.verdict .n{font-family:var(--display);font-weight:700;color:var(--alert)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:0}
.stats dt{font-size:12px;opacity:.65}
.stats dd{margin:0;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.stats .wide{grid-column:1/-1}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.copied{font-size:13px;font-weight:900;color:var(--ok);min-height:1.3em;user-select:text;-webkit-user-select:text}
.note{margin:0;font-size:14px;opacity:.75}
@media (min-aspect-ratio:10/16){body{background:var(--backdrop)}#game{height:min(100% - 32px,900px);border-radius:26px;box-shadow:0 0 0 3px var(--ink),0 18px 50px rgba(0,0,0,.45)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c" aria-label="坐輪椅的阿伯、拿槍指著注音板的姪子，和扶手上的銅鈴"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="top">
      <div class="left">
        <div class="count"><small>第</small><b id="num">1</b><small>回合</small></div>
        <div class="pat"><span>姪子的耐心</span><div class="timer" id="timer"><i id="timerFill"></i></div></div>
      </div>
      <div class="side">
        <button class="icon-btn" id="pauseBtn" type="button" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.6"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.6"/></svg></button>
        <button class="icon-btn" id="mute" type="button" aria-label="聲音開關"></button>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="screen" id="title">
    <h1 class="logo">絕命<span>鈴</span>師</h1>
    <p class="tag">阿伯不能說話，只能按鈴。<br>姪子的槍口指到對的注音，就按下去。</p>
    <ul class="how">
      <li><b>指到對的</b> 點一下按鈴</li>
      <li><b>按錯</b> 姪子會聽錯</li>
      <li><b>人物題</b> 指到對的人再按</li>
      <li><b>仇人來了</b> 狂按</li>
    </ul>
    <div class="gap"></div>
    <button class="btn" id="start" type="button">叮！開始</button>
    <div class="best" id="best"></div>
    <a class="home" href="../">其他遊戲</a>
  </div>

  <div class="screen" id="over" hidden>
    <div class="card">
      <p class="verdict">姪子失去耐心了。<br>阿伯撐了 <span class="n" id="ovN">0</span> 回合。</p>
      <dl class="stats">
        <div><dt>最佳紀錄</dt><dd id="ovBest">0 回合</dd></div>
        <div><dt>氣走的仇人</dt><dd id="ovBoom">0 位</dd></div>
        <div class="wide"><dt>封號</dt><dd id="ovRank"></dd></div>
        <div class="wide"><dt>卡在這一題</dt><dd id="ovMiss"></dd></div>
      </dl>
      <div class="acts">
        <button class="btn" id="again" type="button">再按一次</button>
        <button class="btn ghost" id="share" type="button">複製戰績</button>
      </div>
      <div class="copied" id="copied"></div>
    </div>
  </div>

  <div class="screen" id="pause" hidden>
    <div class="card">
      <p class="verdict">暫停中</p>
      <p class="note">離開畫面會自動暫停，按「繼續」再接著拼。</p>
      <div class="acts"><button class="btn" id="resume" type="button">繼續</button></div>
    </div>
  </div>
</div>

<script>
(() => {

const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, TAU=Math.PI*2;

    if(kind==='rev'&&pattern!=='hop'){dir=-dir;nx=step(dir);trick('掉頭！');}
    else if(kind==='skip'){nx=step(dir*2);trick('跳！');}
    else if(kind==='feint'&&isT(nx)){nx=pick(idx.filter(i=>i!==fi&&!isT(i)));trick('騙你的！');}

      if(quiz){const im=IMG[id],sz=r.h-19;if(im&&im.complete&&im.naturalWidth)g.drawImage(im,r.x+(r.s-sz)/2,r.y+2,sz,sz);g.fillStyle=INK;g.font='900 12.5px '+FONT;g.textAlign='center';g.textBaseline='middle';g.fillText(PEOPLE[id].l,r.x+r.s/2,r.y+r.h-9);g.textBaseline='alphabetic';g.textAlign='left';}
      else if(TONES.includes(id))drawTone(g,id,r.x+r.s/2,r.y+r.s/2,r.s*.62,INK);
      else{g.fillStyle=INK;g.font=`900 ${Math.round(r.s*.62)}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText(id,r.x+r.s/2,r.y+r.s/2+1);g.textBaseline='alphabetic';g.textAlign='left';}}
    g.globalAlpha=1;
    if(phase==='read'&&mode==='play'){g.fillStyle=INK;g.textAlign='center';g.textBaseline='middle';   // 過關：整句（或答對的那個人）留在板子上
      if(quiz){const im=IMG[quizHit];if(im&&im.complete&&im.naturalWidth)g.drawImage(im,180-52,BOARD.y+18,104,104);g.font='900 22px '+FONT;g.fillText(PEOPLE[quizHit]?PEOPLE[quizHit].l:'',180,BOARD.y+BOARD.h-26);}
      else{g.font=`900 ${phrase.length<=3?46:phrase.length===4?40:34}px ${FONT}`;g.fillText(`「${phraseText()}」`,180,BOARD.cy+6);}
      g.textBaseline='alphabetic';g.textAlign='left';}
    // 姪子的步槍：槍托夾在腰邊，槍口轉向現在指的那一格；那一格用紅色準星框起來（槍不橫過板子，才不會擋到牌）
    const r=show&&phase!=='gap'&&rs[fi],tx=r?r.x+r.s/2:236,ty=r?r.y+r.h/2:452;fx+=(tx-fx)*.5;fy+=(ty-fy)*.5;
    const hx=330,hy=BOARD.y-30,ang=Math.atan2(fy-hy,fx-hx),ML=80,mx=hx+Math.cos(ang)*ML,my=hy+Math.sin(ang)*ML;g.lineCap='round';
    if(r){g.strokeStyle=ALERT;g.lineWidth=2;g.globalAlpha=.55;g.setLineDash([5,6]);g.beginPath();g.moveTo(mx,my);g.lineTo(fx,fy);g.stroke();g.setLineDash([]);g.globalAlpha=1;
      const q=Math.min(r.s,r.h)*.26,o=3;g.lineWidth=4;g.beginPath();for(const[cx,cy,dx,dy]of[[r.x-o,r.y-o,1,1],[r.x+r.s+o,r.y-o,-1,1],[r.x-o,r.y+r.h+o,1,-1],[r.x+r.s+o,r.y+r.h+o,-1,-1]]){g.moveTo(cx+dx*q,cy);g.lineTo(cx,cy);g.lineTo(cx,cy+dy*q);}g.stroke();}
    g.save();g.translate(hx,hy);g.rotate(ang);g.scale(1,Math.cos(ang)<0?-1:1);g.lineWidth=2.6;g.strokeStyle=INK;g.lineJoin='round';
    g.fillStyle='#9b6b4a';g.beginPath();g.moveTo(-48,-4);g.lineTo(-12,-6);g.lineTo(-12,5);g.lineTo(-46,13);g.closePath();g.fill();g.stroke();                 // 木頭槍托
    g.fillStyle='#3a3d52';g.fillRect(54,-3,26,5.5);g.strokeRect(54,-3,26,5.5);g.fillRect(24,-10.5,36,4.5);g.strokeRect(24,-10.5,36,4.5);g.fillRect(71,-10,4.5,8);g.strokeRect(71,-10,4.5,8);   // 槍管、導氣管、準星
    g.fillStyle='#55596e';rrect(g,-14,-8,42,14,2.5);g.fill();g.stroke();
    g.fillStyle='#9b6b4a';rrect(g,26,-6,30,12,2.5);g.fill();g.stroke();                                                                                       // 木頭護木
    g.fillStyle='#3a3d52';g.beginPath();g.moveTo(8,6);g.lineTo(21,6);g.quadraticCurveTo(26,20,35,30);g.lineTo(24,35);g.quadraticCurveTo(13,22,8,6);g.closePath();g.fill();g.stroke();   // 彎彎的彈匣
    g.fillStyle='#9b6b4a';rrect(g,-9,5,10,15,3);g.fill();g.stroke();g.restore();
    // 短短的手：單手握著握把，槍托夾在腰邊
    g.lineWidth=3;g.strokeStyle=INK;
    for(const[lw,col]of[[23,INK],[17,SHIRT]]){g.lineWidth=lw;g.strokeStyle=col;g.beginPath();g.moveTo(NUR.x+30,NUR.y+52);g.lineTo(hx-2,hy+4);g.stroke();}
    g.lineWidth=3;g.strokeStyle=INK;g.fillStyle='#c98f66';g.beginPath();g.arc(hx-2,hy+6,10.5,0,TAU);g.fill();g.stroke();
  }
  if(nSayT>0&&nSay&&!inRage&&!title)bubble(g,nSay,NUR.x-40,NUR.y-52,clamp(nSayT*4,0,1),NUR.x-6);
  // 最下面：輪椅扶手、銅鈴、阿伯的手
  g.fillStyle='#3a3d52';g.strokeStyle=INK;g.lineWidth=3;rrect(g,Lx-10,600+bot,Rx-Lx+20,By-600-bot+20,16);g.fill();g.stroke();
  if(title){g.save();g.translate(180,490);g.scale(1.25,1.25);drawBell(g,0,0,press,wob);g.restore();}else drawBell(g,180,606+bot,press,wob);
  // 特效
  for(const s of sparks){g.globalAlpha=clamp(s.life*2.5,0,1);g.fillStyle=s.col;g.beginPath();g.arc(s.x,s.y,s.r,0,TAU);g.fill();}
  g.textAlign='center';g.textBaseline='middle';g.font='900 19px '+FONT;g.lineJoin='round';
  for(const p of pops){const e=1-p.life/p.dur,pp=1+.5*Math.pow(clamp(1-e*6,0,1),2),sc=pp*(p.big?1.5:1);g.globalAlpha=clamp(p.life*4,0,1);g.save();g.translate(clamp(p.x,wx0+60,wx1-60),p.y-e*22);g.rotate(p.rot||0);g.scale(sc,sc);g.lineWidth=5.5;g.strokeStyle=INK;g.strokeText(p.text,0,0);g.fillStyle=p.col;g.fillText(p.text,0,0);g.restore();}
  g.globalAlpha=1;g.textBaseline='alphabetic';g.textAlign='left';
  g.setTransform(1,0,0,1,0,0);
  if(flash>0){g.fillStyle=PAPER;g.globalAlpha=flash*.8;g.fillRect(0,0,W,H);g.globalAlpha=1;}
}

/* ───────── HUD 與流程 ───────── */
const el={hud:$('hud'),num:$('num'),timer:$('timer'),fill:$('timerFill'),hint:$('hint'),title:$('title'),over:$('over'),best:$('best'),mute:$('mute')};
const RANKS=[[30,'絕命鈴師'],[20,'注音板之神'],[13,'療養院話最多的'],[8,'叮得有模有樣'],[4,'姪子聽得懂一半'],[1,'至少過了一回'],[0,'只會亂按']];
let lastHint='',lastNum=-1,lastFill=-1,paused=false;
function setHint(t){if(t!==lastHint){lastHint=t;el.hint.textContent=t;}}
function muteIcon(){el.mute.innerHTML=Snd.on
  ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>'
  :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  el.mute.setAttribute('aria-pressed',String(!Snd.on));}
function showBest(){el.best.textContent=best>0?`最佳紀錄　${best} 回合`:'';}
function pop(x,y,text,col,big,rot){pops.push({x,y,text,col,life:big?1:.7,dur:big?1:.7,big,rot});}
function burst(x,y,n,col,v){for(let i=0;i<n;i++)sparks.push({x:x+rnd(-10,10),y:y+rnd(-10,10),vx:rnd(-v,v),vy:rnd(-v*1.3,v*.3),r:rnd(1.8,3.8),col,life:rnd(.3,.65)});}
const phraseText=()=>quiz?quiz.q:phrase?phrase.map(q=>q[0]).join(''):'';
const bellY=()=>mode==='title'?470:606+(wy1-VH)*.55;

function start(){
  Snd.init();paused=false;$('pause').hidden=true;L=0;pat=100;booms=0;used=[];usedQ=[];quiz=null;pops.length=sparks.length=0;shake=flash=0;madT=smugT=nSayT=0;nMood='ok';wrongCd=0;
  mode='play';lastNum=lastFill=-1;el.title.hidden=true;el.over.hidden=true;el.hud.hidden=false;nextPhrase();
}
// 下一回合：每三回合出一題人物題，其他是拼字
function nextPhrase(){if(L%3===2)setQuiz();else setPhrase(pickPhrase());phase='intro';pt=0;cells=[];nMood='ok';}
function gameOver(){
  mode='over';paused=false;$('pause').hidden=true;if(L>best){best=L;store.set('ls.best',String(L));}
  $('ovN').textContent=L;$('ovBest').textContent=best+' 回合';$('ovBoom').textContent=booms+' 位';$('ovRank').textContent=RANKS.find(r=>L>=r[0])[1];$('ovMiss').textContent=phraseText()||'—';
  $('copied').textContent='';el.hud.hidden=true;el.over.hidden=false;showBest();
}
// 按鈴：不管什麼時候按都會響；只有槍口在板子上指的時候才算數
function ring(){
  press=1;wob=1;Snd.ding(mode==='play'&&phase==='rage'?.8:1);pop(180+rnd(-70,70),bellY()-96+rnd(-10,10),'叮！',BRASS_L,false,rnd(-.2,.2));
  if(mode!=='play')return;
  if(phase==='rage'){rage=Math.min(100,rage+6);shake=Math.max(shake,2+rage*.05);if(rage>=100)rageEnd(true);return;}
  if(phase!=='spell'||wrongCd>0)return;
  const st=steps[cur],late=prev>=0&&isT(prev)&&ft<GRACE,hitOn=isT(fi)||late,at=isT(fi)||!late?fi:prev,r=cellRects()[at];flashCell=at;flashT=.28;flashOk=hitOn;
  if(hitOn){pat=Math.min(100,pat+9);phase='gap';pt=0;if(quiz)quizHit=cells[at];Snd.blip(880,1320,.09,'triangle',.07);if(r)burst(r.x+r.s/2,r.y+r.h/2,6,OK,90);}
  else{pat-=22;madT=.9;wrongCd=.3;shake=Math.max(shake,7);nMood='huh';nSayT=1.5;Snd.blip(200,120,.2,'square',.07);
    const s=cells[fi];nSay=quiz?pick(QUIZ_NO):st.tone||TONES.includes(s)?'幾聲？阿伯你講清楚！':`「${GUESS[s]}」？阿伯你要${GUESS[s]}？！`;
    if(pat<=0){pat=0;gameOver();}}
}
function rageEnd(won){phase='rageOut';pt=0;rageWon=won;
  if(won){booms++;pat=100;shake=20;flash=1;Snd.boom();pop(180,330,'轟！',ALERT,true);burst(236,400,26,'#55596e',240);burst(236,400,14,BRASS_L,200);smugT=1.6;}
  else pop(180,330,'…沒事。',PAPER);}
function tick(dt){
  time+=dt;shake=Math.max(0,shake-dt*26);flash=Math.max(0,flash-dt*2.6);press=Math.max(0,press-dt*9);wob=Math.max(0,wob-dt*2.2);
  if(madT>0)madT-=dt;if(smugT>0)smugT-=dt;if(nSayT>0){nSayT-=dt;if(nSayT<=0&&nMood==='huh')nMood='ok';}if(wrongCd>0)wrongCd-=dt;if(flashT>0)flashT-=dt;stepIn+=dt;
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=300*dt;if((s.life-=dt)<=0)sparks.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--)if((pops[i].life-=dt)<=0)pops.splice(i,1);
  const scan=()=>{ft+=dt;if(ft>=Tc){ft-=Tc;prev=fi;fi=nextCell();Tc=T*(fast>0?.62:1)*(L>=8&&Math.random()<.12?1.6:1);if(fast>0)fast--;}};   // 槍口往下一格；後面姪子偶爾會多停一下
  wide+=((cells.length&&isT(fi)&&(mode!=='play'||phase==='spell')?1:0)-wide)*Math.min(1,dt*18);
  nAng+=((mode==='title'?0:clamp((1-pat/100)*.9+(madT>0?.3:0),0,1))-nAng)*Math.min(1,dt*7);   // 姪子的火氣跟著耐心條走，按錯的瞬間再往上衝一下
  if(mode==='title'){if(!phrase){setPhrase(PHRASES[2].find(q=>q[0][0]==='叮'));setStep();}scan();return;}   // 標題畫面：板子自己跑，當示範
  if(mode!=='play')return;
  pt+=dt;
  if(phase==='intro'){if(pt>=.45){phase='spell';setStep();}}
  else if(phase==='spell'){pat-=drain()*dt;scan();if(pat<=0){pat=0;gameOver();}}
  else if(phase==='gap'){if(pt>=.16){cur++;if(cur>=steps.length){L++;pat=Math.min(100,pat+18);phase='read';pt=0;nMood='read';nSay=quiz?pick(QUIZ_OK):`「${phraseText()}」？${pick(NEPHEW_OK)}`;nSayT=1.3;smugT=1.2;
        Snd.blip(660,990,.12,'triangle',.08);Snd.blip(990,1320,.14,'triangle',.06,.1);pop(180,392,quiz?'答對了！':'說出來了！',BRASS_L,true);}
      else{phase='spell';setStep();}}}
  else if(phase==='read'){if(pt>=1.2){nMood='ok';if(L%RAGE_EVERY===0){phase='rageIn';pt=0;rage=0;rageWon=false;Snd.blip(220,110,.5,'sawtooth',.06);}else nextPhrase();}}
  else if(phase==='rageIn'){if(pt>=1.1){phase='rage';pt=0;}}
  else if(phase==='rage'){rage=Math.max(0,rage-8*dt);if(pt>=RAGE_T)rageEnd(false);}
  else if(phase==='rageOut'){if(pt>=1.4)nextPhrase();}
}
function hud(){
  if(mode!=='play')return;
  const n=L+1;if(n!==lastNum){lastNum=n;el.num.textContent=n;}
  const f=Math.round(pat*2);if(f!==lastFill){lastFill=f;el.fill.style.transform=`scaleX(${(pat/100).toFixed(3)})`;el.timer.classList.toggle('low',pat<30);}
  setHint(phase==='rage'||phase==='rageIn'?'仇人來了，狂按鈴把他氣走':quiz&&L<6?'人物題：槍指到對的人時，點一下':L===0?'槍口指到紅色那個注音時，點一下':L===1&&phase==='spell'?'按錯姪子會聽錯，耐心掉很快':'');
}
const H=1/60;let acc=0,last=0,hold=false;
function setPaused(p){if(p&&(paused||mode!=='play'))return;if(!p&&!paused)return;paused=p;$('pause').hidden=!p;last=0;acc=0;if(Snd.ctx){try{p?Snd.ctx.suspend():Snd.ctx.resume();}catch(e){}}if(p)$('resume').focus({preventScroll:true});}
function frame(now){
  const dt=Math.min(.05,(now-(last||now))/1000);last=now;
  if(!paused&&!hold){acc+=dt;let n=0;while(acc>=H&&n++<6){tick(H);acc-=H;}if(n>=6)acc=0;hud();}
  render();requestAnimationFrame(frame);
}

/* ───────── 輸入：整個畫面點哪裡都是按鈴 ───────── */
gameEl.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;e.preventDefault();Snd.init();if(paused||mode==='over')return;ring();});
gameEl.addEventListener('contextmenu',e=>e.preventDefault());
/* iOS Safari：快速點兩下會被當成「點兩下放大」，而且放大後縮不回來，所以把雙擊縮放、雙指縮放都擋掉 */
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now(),btn=e.target&&e.target.closest&&e.target.closest('button,a');if(now-lastTouchEnd<=350&&!btn&&e.cancelable)e.preventDefault();lastTouchEnd=now;},{passive:false});
for(const t of['gesturestart','gesturechange','gestureend'])document.addEventListener(t,e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden)setPaused(true);});
window.addEventListener('blur',()=>setPaused(true));
window.addEventListener('pagehide',()=>setPaused(true));
window.addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(!e.repeat)setPaused(!paused);return;}
  if(paused||e.repeat||(e.code!=='Space'&&e.code!=='Enter'))return;if(e.target.closest&&e.target.closest('button,a'))return;e.preventDefault();Snd.init();
  if(mode==='play')ring();else start();});
$('start').addEventListener('click',start);
$('again').addEventListener('click',start);
$('pauseBtn').addEventListener('click',()=>setPaused(true));
$('resume').addEventListener('click',()=>setPaused(false));
el.mute.addEventListener('click',()=>{Snd.init();Snd.setOn(!Snd.on);muteIcon();});
$('share').addEventListener('click',async()=>{
  const link=document.querySelector('link[rel=canonical]'),out=$('copied');
  const text=`我在《絕命鈴師》幫阿伯用鈴鐺跟姪子溝通了 ${L} 回合，封號「${$('ovRank').textContent}」。你能叮幾回合？`+(link?' '+link.href:'');
  try{await navigator.clipboard.writeText(text);out.textContent='已複製，貼到脆上炫耀吧';}
  catch(e){out.textContent=text;const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);}
});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(gameEl);

muteIcon();showBest();resize();requestAnimationFrame(frame);
window.__ls={PHRASES,ring,start,tick,get mode(){return mode},get phase(){return phase},get pt(){return pt},get L(){return L},set L(v){L=v;},get pat(){return pat},set pat(v){pat=v;},get fi(){return fi},get ti(){return ti},get onT(){return isT(fi)},get quiz(){return quiz},QUIZ,setQuiz(){setQuiz();phase='intro';pt=0;},get ft(){return ft},get Tc(){return Tc},
  get cur(){return cur},get steps(){return steps},get cells(){return cells},get pattern(){return pattern},get rage(){return rage},get booms(){return booms},get paused(){return paused},get text(){return phraseText()},set hold(v){hold=v;},
  setPhrase(p){setPhrase(p);phase='intro';pt=0;},rageNow(){phase='rageIn';pt=0;rage=0;rageWon=false;}};
})();
