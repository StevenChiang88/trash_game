<style>
  /* 與發佈環境相同的最小底座：上下避開瀏海與手勢列 */
  html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

  [hidden]{display:none!important}

<!--PAGE-->
<title>絕命礦師</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;900&family=Fredoka:wght@600;700&display=swap">
<style>
/* 版面：車庫工作檯上的一格畫面。最上面是第幾天和現金，接著是 Han克和他講的話、今天的行情快報，
   中間三個分頁（開礦石／展示櫃／交流板）可以上下捲，最下面固定一顆「過一天」 */
:root{
  --ink:#2b2a3a;        /* 描邊與文字 */
  --paper:#fff8ea;      /* 卡片的紙白 */
  --bench:#e6dcc8;      /* 工作檯的木色：底色 */
  --bench-deep:#cdbf9f;
  --gold:#f0b83c;       /* 錢、主要按鈕 */
  --gold-deep:#a8760f;
  --amethyst:#8e6bd8;   /* 礦石的紫：分頁、強調 */
  --up:#2f9a7c;         /* 行情漲 */
  --down:#e4572e;       /* 行情跌、破產 */
  --ok:#2f9a7c;
  --backdrop:#1c1b29;   /* 電腦版：手機畫面外的底色 */
  --display:"Fredoka","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --sticker:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 -2.5px 0 var(--ink),0 2.5px 0 var(--ink),-2.5px 0 0 var(--ink),2.5px 0 0 var(--ink);
}
*{box-sizing:border-box}
html,body{height:100%;touch-action:manipulation}
button{touch-action:manipulation;font:inherit;color:inherit}
body{background:var(--bench);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none;display:grid;place-items:center}
#game{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  background:repeating-linear-gradient(90deg,transparent 0 58px,rgba(43,42,58,.05) 58px 60px),var(--bench)}
.app{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding-block:12px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

.bar{display:flex;align-items:center;gap:10px}
.day{display:flex;align-items:baseline;gap:4px;font-family:var(--display);line-height:1}
.day small{font-family:var(--body);font-weight:900;font-size:14px}
.day b{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
.money{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.money b{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.money b.neg{color:var(--down)}
.money span{font-size:12px;font-weight:900;opacity:.7;font-variant-numeric:tabular-nums}
.icon-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);cursor:pointer;padding:0}
.icon-btn svg{width:20px;height:20px}
:focus-visible{outline:3px solid var(--amethyst);outline-offset:2px}

.hank{display:flex;align-items:center;gap:8px}
.ava{width:58px;height:58px;flex:none;border:2.5px solid var(--ink);border-radius:50%;background:#bcd9e6;overflow:hidden}
.ava svg{display:block;width:100%;height:100%}
.say{position:relative;flex:1;min-width:0;padding:8px 12px;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);font-weight:900;font-size:15px;line-height:1.35;text-wrap:pretty}
.say::before{content:"";position:absolute;left:-8px;top:50%;width:12px;height:12px;margin-top:-6px;background:var(--paper);border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.news{padding:5px 10px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:900;min-height:1.5em;line-height:1.5}
.news b{color:var(--gold)}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tab{padding:8px 2px;border:2.5px solid var(--ink);border-radius:12px;background:var(--bench-deep);font-weight:900;font-size:14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--amethyst);color:var(--paper)}
.panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:flex;flex-direction:column;gap:8px;padding:2px 2px 6px;scrollbar-width:thin}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper)}
.item .pic{width:52px;height:52px;flex:none}
.item .pic svg{display:block;width:100%;height:100%}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.3}
.item .nm{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .sub{font-size:12.5px;opacity:.75;font-variant-numeric:tabular-nums}
.item .ops{display:flex;flex-direction:column;gap:5px;flex:none}
.tagr{display:inline-block;padding:0 7px;border:2px solid var(--ink);border-radius:999px;font-size:11px;font-weight:900;line-height:1.5}
.r0{background:#dfe2e8}.r1{background:#9fe0b6}.r2{background:#9cc6f7}.r3{background:var(--gold)}.r4{background:#7fd8f5}
.price{font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.chg{font-size:12px;font-weight:900;font-variant-numeric:tabular-nums}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}
.sm{padding:5px 12px;border:2.5px solid var(--ink);border-radius:10px;background:var(--gold);font-weight:900;font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums}
.sm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.sm.alt{background:var(--paper)}
.sm:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
/* 圖鑑：所有礦石排成格子。開過的顯示本尊，沒開過的只有黑影和問號 */
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cell{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;padding:6px 2px 7px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);font-size:12px;font-weight:900;text-align:center;line-height:1.25}
.cell svg{width:42px;height:42px;display:block}
.cell small{font-weight:500;font-size:10.5px;opacity:.7;font-variant-numeric:tabular-nums}
.cell.u0{box-shadow:inset 0 -5px 0 #dfe2e8}.cell.u1{box-shadow:inset 0 -5px 0 #9fe0b6}.cell.u2{box-shadow:inset 0 -5px 0 #9cc6f7}.cell.u3{box-shadow:inset 0 -5px 0 var(--gold)}.cell.u4{box-shadow:inset 0 -5px 0 #7fd8f5}
.cell.lock{background:var(--bench-deep);color:rgba(43,42,58,.55)}
.cell.lock svg{filter:brightness(0);opacity:.2}
.card.tall{max-height:94%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;width:min(344px,100%)}
.card.tall .head{padding:0}
.empty{margin:auto;padding:20px;text-align:center;font-weight:900;font-size:15px;opacity:.7;text-wrap:balance}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;font-size:13px;padding:0 4px}
.item .pic.who{border:2.5px solid var(--ink);border-radius:50%;background:#bcd9e6;overflow:hidden}

.foot{display:flex}
.btn{font-weight:900;font-size:20px;background:var(--gold);border:3px solid var(--ink);border-radius:16px;padding:11px 26px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);font-size:16px;padding:10px 20px}
.foot .btn{flex:1;display:flex;align-items:baseline;justify-content:center;gap:10px}
.foot small{font-size:13px;font-variant-numeric:tabular-nums}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:28px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
#title{background:linear-gradient(rgba(28,27,41,.62),rgba(28,27,41,.3) 40%,rgba(28,27,41,.62))}
.logo{margin:5vh 0 0;font-weight:900;font-size:clamp(50px,16vw,80px);line-height:1;letter-spacing:.02em;color:var(--paper);text-shadow:var(--sticker),0 7px 0 var(--ink);transform:rotate(-3deg)}
.logo span{display:inline-block;color:var(--amethyst)}
.tag{margin:6px 0 0;font-weight:900;font-size:17px;color:var(--paper);text-shadow:var(--sticker);text-wrap:balance}
.hero{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.hero svg{height:100%;max-height:250px;width:auto;filter:drop-shadow(0 6px 0 rgba(43,42,58,.45))}
.how{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0;padding:0;list-style:none;font-size:14px}
.how li{padding:6px 12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.how b{font-weight:900;color:var(--gold-deep)}
.best{font-weight:900;font-size:14px;color:var(--paper);text-shadow:var(--sticker);min-height:1.4em}
.home{font-weight:900;font-size:14px;color:var(--paper);text-shadow:var(--sticker);text-underline-offset:4px}
button.home{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}

#modal,#over{justify-content:center;background:rgba(28,27,41,.6)}
.card{width:min(330px,100%);display:flex;flex-direction:column;gap:12px;padding:18px;border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--ink);text-align:left;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateY(30px) scale(.94);opacity:0}}
.card.center{text-align:center;align-items:center}
.card h2{margin:0;font-size:22px;font-weight:900;line-height:1.3}
.card p{margin:0;font-size:15px;line-height:1.55;text-wrap:pretty}
.who{display:flex;align-items:center;gap:10px}
.who .ava{width:64px;height:64px}
.who b{font-size:13px;opacity:.7;display:block;font-weight:900}
.rock{width:180px;height:180px;border:0;background:none;padding:0;cursor:pointer}
/* 力道條：指針左右來回跑，停在綠色區敲最準；兩端紅色是太大力 */
.meter{position:relative;width:250px;height:34px;display:grid;align-items:center}
.track{position:relative;height:22px;border:2.5px solid var(--ink);border-radius:999px;background:#f2d680;overflow:hidden}
.track i{position:absolute;top:0;bottom:0}
.track .zr{left:0;width:13%;background:var(--down)}
.track .zr.r{left:auto;right:0}
.track .zg{background:var(--up)}
#mark{position:absolute;top:0;bottom:0;width:7px;margin-left:-3.5px;border-radius:4px;background:var(--ink);box-shadow:0 0 0 2px var(--paper)}
.pips{display:flex;gap:7px}
.pips i{width:15px;height:15px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper)}
.pips i.g{background:var(--up)}.pips i.y{background:#f2d680}.pips i.r{background:var(--down)}
.verdictline{font-weight:900;font-size:15px}
/* 事件裡牽涉到的礦石、和結果的金額，都明白列出來 */
.card .item{padding:7px 10px;border-width:2px}
.card .item .pic{width:44px;height:44px}
.delta{font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}
.verdictline.up{color:var(--up)}.verdictline.down{color:var(--down)}
.rock svg{display:block;width:100%;height:100%}
.rock.hit svg{animation:hit .16s}
@keyframes hit{30%{transform:translate(-5px,3px) rotate(-4deg)}70%{transform:translate(4px,-2px) rotate(3deg)}}
.found{width:150px;height:150px;animation:found .45s cubic-bezier(.3,1.6,.5,1)}
.found svg{display:block;width:100%;height:100%}
@keyframes found{from{transform:scale(.3) rotate(-25deg);opacity:0}}
.glow{position:relative}
.glow::before{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,var(--glow,transparent) 0,transparent 68%);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.big{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:inherit}
.card.center .acts{justify-content:center}
.verdict{margin:0;font-weight:900;font-size:30px;line-height:1.25}
.verdict .n{font-family:var(--display);font-weight:700;color:var(--down)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:0}
.stats dt{font-size:12px;opacity:.65}
.stats dd{margin:0;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.stats .wide{grid-column:1/-1}
.copied{font-size:13px;font-weight:900;color:var(--ok);min-height:1.3em;user-select:text;-webkit-user-select:text}
@media (min-aspect-ratio:10/16){body{background:var(--backdrop)}#game{height:min(100% - 32px,900px);border-radius:26px;box-shadow:0 0 0 3px var(--ink),0 18px 50px rgba(0,0,0,.45)}}
@media (prefers-reduced-motion:reduce){.card,.found,.rock.hit svg,.glow::before{animation:none}}
</style>
</head>
<body>
<div id="game">
  <div class="app" id="app" hidden>
    <header class="bar">
      <div class="day"><small>第</small><b id="dayN">1</b><small>天</small></div>
      <div class="money"><b id="cash">$800</b><span id="worth">身價 $800</span></div>
      <button class="icon-btn" id="mute" type="button" aria-label="聲音開關"></button>
    </header>
    <div class="hank"><div class="ava" id="hankAva"></div><div class="say" id="hankSay" aria-live="polite"></div></div>
    <div class="news" id="news"></div>
    <nav class="tabs" role="tablist" aria-label="分頁">
      <button class="tab" role="tab" data-tab="open" type="button">開礦石</button>
      <button class="tab" role="tab" data-tab="shelf" type="button">展示櫃</button>
      <button class="tab" role="tab" data-tab="board" type="button">買賣</button>
      <button class="tab" role="tab" data-tab="dex" type="button">圖鑑</button>
    </nav>
    <main class="panel" id="panel"></main>
    <footer class="foot"><button class="btn" id="next" type="button"></button></footer>
  </div>

  <div class="screen" id="title">
    <h1 class="logo">絕命<span>礦</span>師</h1>
    <p class="tag">Han克在家養傷，迷上了礦石。<br>「這是礦物，不是石頭！」</p>
    <div class="hero" id="hero"></div>
    <ul class="how">
      <li><b>看準綠色</b> 敲原石</li>
      <li><b>行情好、有訂單</b> 再賣</li>
      <li><b>付不出生活費</b> 就破產</li>
    </ul>
    <button class="btn" id="start" type="button">開始收藏</button>
    <div class="best" id="best"></div>
    <button class="home" id="dexBtn" type="button"></button>
    <a class="home" href="../">其他遊戲</a>
  </div>

  <div class="screen" id="modal" hidden><div class="card" id="mcard"></div></div>

  <div class="screen" id="over" hidden>
    <div class="card">
      <p class="verdict">破產了。<br>Han克撐了 <span class="n" id="ovN">0</span> 天。</p>
      <dl class="stats">
        <div><dt>最佳紀錄</dt><dd id="ovBest">0 天</dd></div>
        <div><dt>最高身價</dt><dd id="ovPeak">$0</dd></div>
        <div><dt>圖鑑</dt><dd id="ovDex">0 / 0</dd></div>
        <div><dt>開過的礦石</dt><dd id="ovOpen">0 顆</dd></div>
        <div class="wide"><dt>封號</dt><dd id="ovRank"></dd></div>
      </dl>
      <div class="acts">
        <button class="btn" id="again" type="button">再收一次</button>
        <button class="btn ghost" id="share" type="button">複製戰績</button>
      </div>
      <div class="copied" id="copied"></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const clamp=(x,a,b)=>x<a?a:x>b?b:x, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[(Math.random()*a.length)|0];
const gauss=()=>{let s=0;for(let i=0;i<4;i++)s+=Math.random();return(s-2)*1.73;};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=id=>document.getElementById(id), $$=n=>'$'+Math.round(n).toLocaleString('en-US');
const INK='#2b2a3a';
const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16),q=v=>Math.round(f<1?v*f:v+(255-v)*(f-1));return`rgb(${q((n>>16)&255)},${q((n>>8)&255)},${q(n&255)})`;};

/* ───────── 礦石：r 是稀有度（0 普通、1 少見、2 稀有、3 傳說、4 只有彩蛋拿得到），v 是基本行情 ───────── */
const RAR=['普通','少見','稀有','傳說','來路不明'];
const M=[
  {id:'quartz',n:'石英',r:0,v:53,s:'cluster',c:'#f1ede2'},{id:'calcite',n:'方解石',r:0,v:57,s:'cube',c:'#f6c36a'},{id:'pyrite',n:'黃鐵礦',r:0,v:67,s:'cube',c:'#d9b54a'},{id:'fluorite',n:'螢石',r:0,v:70,s:'cube',c:'#8fd6b8'},
  {id:'hematite',n:'赤鐵礦',r:0,v:49,s:'slab',c:'#7a5560'},{id:'gypsum',n:'石膏',r:0,v:45,s:'slab',c:'#efe6d6'},{id:'mica',n:'雲母',r:0,v:51,s:'slab',c:'#c9b79a'},

function take(id,n){G.inv[id]-=n;if(G.inv[id]<=0)delete G.inv[id];}
function roll(cr){let r=Math.random()*100,k=0;for(;k<3;k++){if((r-=cr.odds[k])<0)break;}return pick(M.filter(m=>m.r===k));}
// 交流板：每天三則別人要賣的礦石，價錢有高有低，撿到便宜的可以放到行情好再賣
function makeBoard(){
  G.board=[];const pool=M.filter(m=>m.r<3&&m.r>=(G.day>6?1:0));
  for(let i=0;i<3;i++){const m=i===2&&Math.random()<.5?pick(M.filter(q=>q.r===2)):pick(pool);G.board.push({id:m.id,p:Math.max(2,Math.round(m.v*G.mult[m.id]*rnd(.72,1.28))),sold:false});}
}
// 過一天：付生活費、行情變動、可能有人來訪
function nextDay(){
  const e=bill();if(G.cash<e)return;G.cash-=e;G.day++;G.sale=false;G.left=G.per;
  G.orders.forEach(o=>o.d--);G.orders=G.orders.filter(o=>o.d>0);if(G.orders.length<3&&Math.random()<.75)addOrder();
  let news='';
  M.forEach(m=>{G.prev[m.id]=G.mult[m.id];const vol=m.r===4?.38:.17;G.mult[m.id]=clamp(G.mult[m.id]+(1-G.mult[m.id])*.2+gauss()*vol,.4,2.4);});
  if(G.tip){G.mult[G.tip]=clamp(G.mult[G.tip]*1.5,.4,2.6);news=`<b>${BY[G.tip].n}</b> 今天大漲，內線是真的。`;G.tip=null;}
  else if(Math.random()<.34){const m=pick(M.filter(q=>q.r<4));if(Math.random()<.55){G.mult[m.id]=clamp(G.mult[m.id]*1.6,.4,2.6);news=`<b>${m.n}</b> 在脆上爆紅，行情大漲。`;}else{G.mult[m.id]=clamp(G.mult[m.id]*.6,.35,2.4);news=`有人爆料 <b>${m.n}</b> 很多是染色的，行情大跌。`;}}
  G.news=news||pick(['今天行情平平。','礦石社團很安靜。','沒什麼大消息。']);makeBoard();say(pick(IDLE));
  if(G.loan&&G.day>=G.loan.due){G.cash-=G.loan.amt;G.news=`律師來收錢了：<b>−${$$(G.loan.amt)}</b>。`+(G.cash<0?'現金變負的了，快賣礦石。':'');G.loan=null;}
  if(G.inv.blue&&Math.random()<.14){const n=G.inv.blue;delete G.inv.blue;G.cash-=150;modal={t:'event',who:'partner',show:[{id:'blue',n}],text:`「老兄，你桌上那 ${n} 顆藍色的是什麼？……你是緝毒的欸。」${n} 顆藍色晶體全部被收走，還罰了 ${$$(150)}。`,opts:[{l:'…是礦物啦',fn(){say('那個…真的是礦物。','sad');}}]};}
  else if(G.day>=2&&Math.random()<.5)event();
  bump();checkOver();
}
// 破產：沒有礦石可以賣，現金付不出生活費，也沒辦法再開一顆賭一把
function checkOver(){
  if(modal||!(invCount()===0&&G.cash<bill()&&(G.left<=0||G.cash<cratePrice(CRATES[0]))))return;
  if(G.bailed)return gameOver();
  G.bailed=true;const a=Math.max(300,Math.round(bill()*3/50)*50);   // 第一次見底：老婆塞錢救一次，下不為例
  modal={t:'event',who:'wife',kicker:'快破產了',text:`她嘆了口氣，塞給你 ${$$(a)}。「最後一次。再輸光，我就把這些石頭全丟了。」`,opts:[{l:'是礦物…謝謝老婆',fn(){G.cash=Math.max(G.cash,0)+a;if(G.left<=0)G.left=2;say('這次我會看準再敲。','sad');Snd.coin();}}]};
}

  {id:'teacher',can:()=>G.cash>=200&&!G.inv.blue,make(){return{who:'teacher',show:[{id:'blue',n:1}],text:'「這批藍色的晶體，純度 99.1%。賣你一顆 $200，別問哪來的。」行情很亂，可能大賺；但放在家裡，每天都有機會被同事看到沒收。',opts:[{l:'買一顆 −$200',fn(){G.cash-=200;add('blue');say('好漂亮的藍色…這是什麼礦？','wow');Snd.coin();return{t:'買了一顆藍色晶體',x:'在展示櫃裡。行情好就趕快賣，放越久越危險。',items:[{id:'blue',n:1}],cash:-200};}},{l:'不要',fn(){say('我總覺得他怪怪的。');}}]};}},
  {id:'lawyer',can:()=>!G.loan,make(){const a=Math.max(300,Math.round(bill()*4/50)*50),b=Math.round(a*1.5/10)*10;return{who:'lawyer',text:`「缺錢？最好打給我。」現在借你 ${$$(a)}，三天後還 ${$$(b)}。`,opts:[{l:`簽了 +${$$(a)}`,fn(){G.cash+=a;G.loan={due:G.day+3,amt:b};say('有錢了。再開幾顆。','happy');Snd.coin();return{t:'借到錢了',x:`第 ${G.day+3} 天會自動扣 ${$$(b)}，到時候現金不夠會變負的。`,cash:a};}},{l:'不要',fn(){say('我不跟這種人打交道。');}}]};}},
  {id:'chicken',can:()=>invCount()>=2,make(){const id=Object.keys(G.inv).filter(k=>k!=='blue').sort((a,b)=>G.inv[b]*price(b)-G.inv[a]*price(a))[0];if(!id)return null;const n=G.inv[id],tot=Math.round(price(id)*1.5)*n;return{who:'chicken',show:[{id,n}],text:`「我是個生意人。」他想用行情的 1.5 倍，把你的${BY[id].n}全部買走：${n} 顆，共 ${$$(tot)}。`,opts:[{l:`全賣 +${$$(tot)}`,fn(){take(id,n);G.cash+=tot;say('他人不錯嘛，很有禮貌。','happy');Snd.coin();return{t:'賣給炸雞店老闆了',x:'比今天行情多賣了五成。',items:[{id,n}],cash:tot,sold:true};}},{l:'不賣',fn(){say('我的收藏是非賣品。');}}]};}},
  {id:'uncle',can:()=>invCount()>=1,make(){const id=Object.keys(G.inv).filter(k=>k!=='blue').sort((a,b)=>price(b)-price(a))[0];if(!id)return null;const p=price(id)*2;return{who:'uncle',show:[{id,n:1}],text:`阿伯盯著你的${BY[id].n}，按了一下鈴。旁邊的姪子說：「他出兩倍，${$$(p)}。」`,opts:[{l:`叮（賣）+${$$(p)}`,fn(){take(id,1);G.cash+=p;say('他到底是看上它哪一點？','ok');Snd.coin();return{t:'賣給阿伯了',x:'今天行情的兩倍。',items:[{id,n:1}],cash:p,sold:true};}},{l:'不賣',fn(){say('叮叮叮叮叮——好啦，不賣就是不賣。');}}]};}},
  {id:'fixer',can:()=>true,make(){const m=pick(M.filter(q=>q.r>=1&&q.r<=2));return{who:'fixer',show:[{id:m.id,n:0}],text:`「明天${m.n}會漲。要買就買，不要半吊子。」說完就走了。`,opts:[{l:'知道了',fn(){G.tip=m.id;say(`${m.n}…明天會漲？`,'wow');}}]};}},
  {id:'kid',can:()=>G.cash>=80,make(){return{who:'kid',text:'「Yo！這顆會發光，是科學！」他想用 $80 賣你一顆來路不明的石頭。一半機率是稀有礦石，一半是假貨。',opts:[{l:'買 −$80',fn(){G.cash-=80;if(Math.random()<.5){const m=pick(M.filter(q=>q.r===2));add(m.id);say(`居然是${m.n}！這小子…`,'wow');Snd.found(2);return{t:`賭對了，是${m.n}`,x:'收進展示櫃了。',items:[{id:m.id,n:1}],cash:-80};}say('這是塗了螢光漆的石頭。石頭！','sad');return{t:'被騙了',x:'只是塗了螢光漆的石頭，一毛都不值，丟了。',cash:-80};}},{l:'不要',fn(){say('現在的年輕人。');}}]};}},
  {id:'beer',can:()=>G.cash>=40,make(){const c=Math.min(G.cash,Math.round(bill()*.8/10)*10);return{who:'beer',text:`車庫傳來一聲巨響——你自己釀的啤酒爆了。清理費 ${$$(c)}。`,opts:[{l:'唉',fn(){G.cash-=c;say('瓶子灌太滿了…','sad');}}]};}},
  {id:'show',can:()=>true,make(){return{who:'show',text:'市區有礦石展，今天所有原石打八折。',opts:[{l:'太好了',fn(){G.sale=true;say('打折！這不買說不過去。','happy');}}]};}},
];
function event(){const pool=EVENTS.filter(e=>e.id!==G.lastEv&&e.can());for(let i=0;i<4&&pool.length;i++){const e=pick(pool),m=e.make();if(m){G.lastEv=e.id;modal=Object.assign({t:'event'},m);Snd.blip(180,150,.06,'square',.07);Snd.blip(180,150,.06,'square',.07,.12);return;}}}

function buyCrate(id){const cr=CRATES.find(c=>c.id===id),p=cratePrice(cr);if(G.cash<p||modal||G.left<=0)return;G.cash-=p;G.opened++;G.left--;modal={t:'crack',cr,hits:[],res:null,t0:performance.now(),ph:Math.random()};Snd.blip(300,200,.1,'triangle',.07);render();}
// 力道條的指針：0..1 之間來回跑，每敲一下就再快一點
const markPos=()=>{const u=(((performance.now()-modal.t0)/1000)*modal.cr.sp*(1+.1*modal.hits.length)+modal.ph)%1;return u<.5?u*2:2-u*2;};
let meterOn=false;
function runMeter(){if(meterOn)return;meterOn=true;const step=()=>{if(!modal||modal.t!=='crack'||modal.res){meterOn=false;return;}const mk=$('mark');if(mk)mk.style.left=(markPos()*100).toFixed(2)+'%';requestAnimationFrame(step);};step();}
// 敲一下：看指針停在哪一區（g 綠、y 黃、r 紅）。敲完算總帳：綠的多有機會升一級，紅的多會裂、甚至敲碎
function strike(zone){
  if(!modal||modal.t!=='crack'||modal.res)return;const cr=modal.cr,pos=markPos(),gw=cr.g+G.wide;
  const z=zone||(Math.abs(pos-.5)<=gw/2?'g':pos<RED||pos>1-RED?'r':'y');modal.hits.push(z);modal.ph=Math.random();modal.t0=performance.now();
  Snd.crack(modal.hits.length/cr.taps);if(z==='g')Snd.blip(880,1320,.08,'triangle',.07);else if(z==='r')Snd.blip(200,110,.16,'square',.07);say(pick(HIT[z]),z==='g'?'happy':z==='r'?'sad':'ok');
  if(modal.hits.length<cr.taps){render();const b=$('rockBtn');if(b)b.classList.add('hit');return;}
  const score=modal.hits.filter(q=>q==='g').length-modal.hits.filter(q=>q==='r').length;let r=Math.random()*100,k=0;for(;k<3;k++){if((r-=cr.odds[k])<0)break;}
  modal.note='';
  if(score>0&&k<3&&Math.random()<UP*score/cr.taps){k++;modal.note='up';}
  else if(score<0&&Math.random()<.6*-score/cr.taps){if(k>0&&!(cr.id==='c'&&k===1)){k--;modal.note='down';}else if(k===0){modal.res={dust:true};G.cash+=5;Snd.blip(180,60,.3,'sawtooth',.08);say('……這顆沒了。','sad');render();return;}}
  const m=pick(M.filter(q=>q.r===k));modal.res=m;modal.fresh=unlock(m.id,1);G.seen[m.id]=1;Snd.found(m.r);say(modal.note==='up'?'敲得好！你看這品相！':pick(FOUND[m.r]),m.r>=2?'wow':m.r===1?'happy':'ok');render();
}
function closeCrack(sell){const m=modal.res;modal=null;if(m.dust){}else if(sell){G.cash+=price(m.id);Snd.coin();say('…好吧，再見了。');}else add(m.id,1,true);bump();checkOver();render();}
function sellHigh(){let got=0;for(const id of Object.keys(G.inv)){if(G.mult[id]>=1.25){got+=price(id)*G.inv[id];delete G.inv[id];}}if(!got)return;G.cash+=got;Snd.coin();say(`行情高的全出掉，+${$$(got)}。`,'happy');bump();checkOver();render();}
function sell(id,n){n=Math.min(n,G.inv[id]||0);if(!n)return;const got=price(id)*n;take(id,n);G.cash+=got;Snd.coin();say(G.mult[id]>=1.25?`賣在高點，+${$$(got)}。`:G.mult[id]<=.8?'行情這麼低你也賣…':`+${$$(got)}。它會去更好的地方。`,G.mult[id]>=1.25?'happy':'ok');bump();checkOver();render();}
function buyBoard(i){const b=G.board[i];if(!b||b.sold||G.cash<b.p)return;G.cash-=b.p;b.sold=true;add(b.id);Snd.coin();say(b.p<price(b.id)?'撿到便宜了。':'貴了點，但我想要。',b.p<price(b.id)?'happy':'ok');render();}
function choose(i){const o=modal.opts[i];modal=null;const res=o.fn();if(res)modal={t:'result',title:res.t,text:res.x,items:res.items,cash:res.cash,sold:res.sold};bump();checkOver();render();}
function closeResult(){modal=null;bump();checkOver();render();}
function start(){Snd.init();Snd.blip(420,640,.14,'triangle',.1);newGame();tab='open';modal=null;el.title.hidden=true;el.over.hidden=true;el.app.hidden=false;render();}
function gameOver(){
  const n=G.day;if(n>best){best=n;store.set('ks.best',String(n));}
  $('ovN').textContent=n;$('ovBest').textContent=best+' 天';$('ovPeak').textContent=$$(G.peak);$('ovDex').textContent=`${dexCount()} / ${M.length}`;$('ovOpen').textContent=G.opened+' 顆';$('ovRank').textContent=RANKS.find(r=>n>=r[0])[1];
  $('copied').textContent='';el.over.hidden=false;showBest();Snd.blip(300,80,.6,'sawtooth',.08);
}

/* ───────── 輸入 ───────── */
$('game').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;Snd.init();
  if(b.id==='rockBtn')return strike();
  if(b.dataset.tab){tab=b.dataset.tab;el.panel.scrollTop=0;return render();}
  const a=b.dataset.act;if(!a)return;
  if(a==='crate')buyCrate(b.dataset.id);else if(a==='sell')sell(b.dataset.id,+b.dataset.n);else if(a==='buy')buyBoard(+b.dataset.i);
  else if(a==='keep'||a==='dust')closeCrack(false);else if(a==='sellnow')closeCrack(true);else if(a==='fulfil')fulfil(+b.dataset.i);else if(a==='sellhigh')sellHigh();else if(a==='closedex'){modal=null;renderModal();}else if(a==='opt')choose(+b.dataset.i);else if(a==='ok')closeResult();
});
el.next.addEventListener('click',()=>{if(modal)return;Snd.blip(660,880,.1,'triangle',.07);nextDay();render();});
$('start').addEventListener('click',start);
$('dexBtn').addEventListener('click',showDex);
$('again').addEventListener('click',start);
el.mute.addEventListener('click',()=>{Snd.init();Snd.setOn(!Snd.on);muteIcon();});
$('share').addEventListener('click',async()=>{
  const link=document.querySelector('link[rel=canonical]'),out=$('copied');
  const text=`我在《絕命礦師》陪Han克收礦石，撐了 ${G.day} 天才破產，最高身價 ${$$(G.peak)}，封號「${$('ovRank').textContent}」。你能撐幾天？`+(link?' '+link.href:'');
  try{await navigator.clipboard.writeText(text);out.textContent='已複製，貼到脆上炫耀吧';}
  catch(e){out.textContent=text;const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);}
});
/* iOS Safari：快速點兩下會被當成「點兩下放大」，而且放大後縮不回來，所以把雙擊縮放、雙指縮放都擋掉（按鈕和可捲動的清單本身不會觸發放大，照常運作） */
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now(),btn=e.target&&e.target.closest&&e.target.closest('button,a,.panel,.card');if(now-lastTouchEnd<=350&&!btn&&e.cancelable)e.preventDefault();lastTouchEnd=now;},{passive:false});
for(const t of['gesturestart','gesturechange','gestureend'])document.addEventListener(t,e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());

$('hero').innerHTML=face(Object.assign({},HANK,{mood:'happy'}));
muteIcon();showBest();
window.__ks={get dex(){return dex},showDex,M,BY,CRATES,GOALS,expense,bill:()=>bill(),price:id=>price(id),get G(){return G},get modal(){return modal},start,buyCrate,strike,fulfil,sellHigh,closeCrack,closeResult,sell,buyBoard,choose,cratePrice,invValue:()=>invValue(),invCount:()=>invCount(),
  next(){nextDay();render();},get over(){return!el.over.hidden},render,event(id){const e=EVENTS.find(q=>q.id===id);modal=Object.assign({t:'event'},e.make());render();}};
})();
</script>
