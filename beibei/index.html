<style>
/* 版面：整頁就是一格巷弄風景，文字只出現在貼紙感的 HUD 與「觀察日記」貼文卡上 */
:root{
  --ink:#2f2c45;        /* 描邊與文字：帶紫的墨色 */
  --quilt:#fffdf5;      /* 棉被白：卡片與字面 */
  --tin:#2f9a7c;        /* 鐵皮綠：主色 */
  --tin-deep:#1f6f5a;
  --alert:#ee5b3a;      /* 颱風警報橘紅 */
  --sun:#ffc64a;        /* 力氣條、太陽 */
  --sky:#9fd3ee;
  --water:#5fb0ea;      /* 濕度條、水滴 */
  --poop:#9a9460;       /* 鴿子大便 */
  --backdrop:#211f33;   /* 電腦版：手機畫面外的底色 */
  --display:"Fredoka","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --sticker:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 -2.5px 0 var(--ink),0 2.5px 0 var(--ink),-2.5px 0 0 var(--ink),2.5px 0 0 var(--ink);
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none;display:grid;place-items:center}
#game{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 50%,transparent 45%,var(--alert) 130%)}

.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.day{display:flex;align-items:baseline;gap:6px;font-family:var(--display);color:var(--quilt);text-shadow:var(--sticker);line-height:1}
.day-l{font-size:18px;font-weight:700}
.day-n{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums}
.wx{font-family:var(--body);font-weight:900;font-size:15px;margin-left:2px}
.side{display:flex;align-items:center;gap:8px}
.wind{display:flex;align-items:center;gap:6px;min-width:96px;height:36px;box-sizing:border-box;justify-content:center;padding:0 12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--quilt);font-weight:900;font-size:15px;line-height:1;white-space:nowrap}
.wind i{display:flex;align-items:center}
.wind i:empty{display:none}
.wind i svg{display:block;width:9px;height:14px;margin-inline:-1px}
.wind.calm{opacity:.75}
.wind.in{background:var(--tin);color:var(--quilt)}
.wind.out{background:var(--sun)}
.wind.out.hard{background:var(--alert);color:var(--quilt)}
.wind.warn{animation:blink .22s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.icon-btn{pointer-events:auto;width:40px;height:40px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:50%;background:var(--quilt);color:var(--ink);cursor:pointer;padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

.banner{align-self:center;max-width:100%;padding:8px 16px;border:2.5px solid var(--ink);border-radius:12px;background:var(--ink);color:var(--quilt);font-weight:900;font-size:16px;text-align:center;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s}
.banner.show{opacity:1;transform:none}
.banner.alert{background:var(--alert)}
.gap{flex:1}
.post{align-self:flex-start;display:flex;gap:10px;align-items:center;max-width:min(280px,100%);padding:9px 14px 9px 10px;border:2.5px solid var(--ink);border-radius:16px;background:var(--quilt);box-shadow:0 4px 0 var(--ink);opacity:0;transform:translateY(14px);transition:opacity .25s,transform .25s}
.post.show{opacity:1;transform:none}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);background:var(--tin);position:relative;overflow:hidden}
.avatar::after{content:"";position:absolute;left:5px;right:-6px;top:11px;height:9px;border-radius:6px;background:var(--quilt);border:2px solid var(--ink);transform:rotate(11deg)}
.post-b{min-width:0;display:flex;flex-direction:column;gap:1px;font-size:14px;line-height:1.35}
.post-b b{font-weight:900;font-size:12px;opacity:.7}
.post-b em{font-style:normal;font-family:var(--display);font-weight:600;font-size:13px;color:var(--alert)}
.hint{align-self:center;text-align:center;font-weight:900;font-size:17px;color:var(--quilt);text-shadow:var(--sticker);min-height:1.5em;text-wrap:balance}
.bars{display:flex;flex-direction:column;gap:6px}
.stam span{min-width:2.3em}
.wetrow .track{height:12px}
.wetrow .fill{background:var(--water);border-right:0}
.stam{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;color:var(--quilt);text-shadow:var(--sticker)}
.track{position:relative;flex:1;height:18px;border:2.5px solid var(--ink);border-radius:999px;background:var(--quilt);overflow:hidden}
.fill{height:100%;width:100%;background:var(--sun);border-right:2.5px solid var(--ink);transform-origin:left center}
.stam.low .fill{background:var(--alert)}
.stam.held .track{border-style:dashed}
.dead{position:absolute;inset:0 0 0 auto;width:0;border-left:2.5px solid var(--ink);background:repeating-linear-gradient(-45deg,var(--poop) 0 4px,var(--ink) 4px 7px)}


.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:28px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
.logo{margin:6vh 0 0;font-weight:900;font-size:clamp(52px,17vw,84px);line-height:1;letter-spacing:.02em;color:var(--quilt);text-shadow:var(--sticker),0 7px 0 var(--ink);transform:rotate(-4deg)}
.logo span{display:inline-block;color:var(--sun)}
.tag{margin:6px 0 0;font-weight:900;font-size:17px;color:var(--quilt);text-shadow:var(--sticker);text-wrap:balance}
.how{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0;padding:0;list-style:none;font-size:14px}
.how li{padding:6px 12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--quilt);white-space:nowrap}
.how b{font-weight:900;color:var(--tin-deep)}
.btn{pointer-events:auto;font:inherit;font-weight:900;font-size:20px;color:var(--quilt);background:var(--tin);border:3px solid var(--ink);border-radius:16px;padding:12px 30px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--quilt);color:var(--ink);font-size:16px;padding:10px 20px}
.best{font-weight:900;font-size:14px;color:var(--quilt);text-shadow:var(--sticker);min-height:1.4em}

#over,#pause{justify-content:center;background:rgba(47,44,69,.45)}
.pause-note{margin:0;font-size:14px;opacity:.75}
.card{width:min(330px,100%);display:flex;flex-direction:column;gap:14px;padding:18px;border:3px solid var(--ink);border-radius:22px;background:var(--quilt);box-shadow:0 7px 0 var(--ink);text-align:left;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateY(30px) scale(.94);opacity:0}}
.card-h{display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.3}
.card-h b{display:block;font-weight:900;font-size:15px}
.card-h span{opacity:.65}
.verdict{margin:0;font-weight:900;font-size:32px;line-height:1.25}
.verdict .n{font-family:var(--display);font-weight:700;color:var(--alert)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:0}
.stats div{min-width:0}
.stats dt{font-size:12px;opacity:.65}
.stats dd{margin:0;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.stats .wide{grid-column:1/-1}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.copied{font-size:13px;font-weight:900;color:var(--tin-deep);min-height:1.3em;user-select:text;-webkit-user-select:text}
/* 比手機寬的螢幕：維持手機尺寸，置中顯示 */
@media (min-aspect-ratio:10/16){body{background:var(--backdrop)}#game{height:min(100% - 32px,900px);border-radius:26px;box-shadow:0 0 0 3px var(--ink),0 18px 50px rgba(0,0,0,.45)}}
@media (prefers-reduced-motion:reduce){.wind.warn,.card{animation:none}.banner,.post{transition:none}}
</style>

<body>
<div id="game">
  <canvas id="c" aria-label="遮雨棚上的棉被"></canvas>
  <div id="vig"></div>

  <div class="hud" id="hud" hidden>
    <div class="top">
      <div class="day"><span class="day-l">Day</span><span class="day-n" id="dayN">1</span><span class="wx" id="wx">晴</span></div>

    </div>

  <div class="screen" id="title">
    <h1 class="logo">被被<span>撐住</span></h1>

      <li><b>連點</b> 頂住風、爬回牆邊</li>
      <li><b>圈圈出現</b> 全部點掉</li>

  <div class="screen" id="over" hidden>

      <div class="acts"><button class="btn" id="resume" type="button">繼續</button></div>
    </div>

</div>

<script>
(() => {
'use strict';
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, TAU=Math.PI*2;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function rng32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ───────── 世界座標（邏輯 360×640） ───────── */
const VW=360,VH=640;
const WALL_X=100,AW_Y0=322,EDGE_X=270,EDGE_Y=356;
const AW_LEN=Math.hypot(EDGE_X-WALL_X,EDGE_Y-AW_Y0);
const UX=(EDGE_X-WALL_X)/AW_LEN,UY=(EDGE_Y-AW_Y0)/AW_LEN;   // 沿鐵皮往外
const NX=UY,NY=-UX;                                         // 鐵皮法線（朝上）
const SEG=10,NODES=15,BL=SEG*(NODES-1),S0=6,R=10;
const A_EFF=AW_LEN-S0;

/* ───────── 規則模型：棉被在鐵皮上的一維滑動 ───────── */
const DAY_LEN=6,G=600,MU_FREE=.36,MU_RAIN=.28,H_FALL=.7;
const KIN=.8;                        // 動摩擦：一旦開始往外滑就很難自己停下來，要點擊才煞得住
const QTE_WARN=1.2,QTE_R=30;         // 圈圈事件（龍捲風、地震）：預告秒數、圈圈半徑
const TOR_TOTAL=190,QUAKE_TOTAL=120; // 一個圈都沒點到時被推出去多遠；點掉幾成就少推幾成
const PIGEON_LOAD=[0,.18,.19,.2],PIGEON_HP=[0,1,3,5];   // 鴿子等級 1～3：越大隻越重、要點越多下
const SPIT_FALL=.55,STICKY=.8;          // 樓上阿伯的痰：落下秒數；黏住時每一下只剩幾成的距離
const POOP_AT=1.8,DIRT_MAX=4,DIRT_COST=12;
const ST_MAX=100,ST_REGEN=15,ST_TAP=7;

class Sim{
  constructor(seed){this.rng=rng32(seed);this.t=0;this.day=1;this.s=14;this.v=0;this.h=0;
    this.st=ST_MAX;this.regenWait=0;this.tapCd=0;this.effort=0;
    this.wet=0;this.slick=0;this.sun=0;this.soaked=false;this.wind=0;this.gust=null;this.gustWait=1.6;this.phi=this.rng()*TAU;
    this.quake=0;this.quakeAt=-1;this.quakeWarned=false;this.hadQuake=false;this.qte=null;this.shove=0;this.shoveT=0;this.shoveCause='fall';
    this.pigeon=null;this.pigeonAt=-1;this.dirt=0;this.uncle=null;this.uncleAt=-1;this.spit=0;
    this.tyStart=9;this.tyLen=2;this.tyN=1;this.doomDone=false;
    this.tor=null;this.torAt=-1;this.hadTor=false;this.cause='fall';
    this.fallen=false;this.events=[];this.weather='sunny';this.setupDay();}
  u(a,b){return a+(b-a)*this.rng()}
  get stMax(){return ST_MAX-DIRT_COST*this.dirt}   // 髒了，力氣上限就變少
  get gripping(){return this.effort>0}             // 剛點過：正在用力
  // 圈圈事件：龍捲風的圈會繞著轉，地震的圈會原地亂抖
  startQte(kind,n,dur){
    if(n===undefined)n=kind==='tor'?Math.min(8,3+Math.floor(this.day/8)):Math.min(6,3+Math.floor(this.day/12));   // 越後面圈越多
    if(dur===undefined)dur=1+n*Math.max(.42,.62-.004*this.day);                                                  // 每個圈能用的時間越來越少
    const q={kind,t:0,dur,n,hit:new Array(n).fill(false),a0:this.rng()*TAU,dir:this.rng()<.5?1:-1,pts:[]};
    if(kind==='quake')for(let i=0;i<n;i++){let x,y,k=0;do{x=this.u(52,308);y=this.u(175,495);}while(k++<40&&q.pts.some(o=>Math.hypot(o.x-x,o.y-y)<78));q.pts.push({x,y});}
    this.qte=q;this.gust=null;this.events.push({type:'qteStart',kind,n});}
  qteR(){const q=this.qte;return QTE_R*(.5+.5*smooth(0,.5,1-q.t/q.dur));}   // 時間剩不到一半就開始縮，最後縮到一半大
  qtePos(i){const q=this.qte;
    if(q.kind==='tor'){const a=q.a0+i*TAU/q.n+q.dir*q.t*1.05;return{x:180+Math.cos(a)*104,y:345+Math.sin(a)*104};}
    return{x:q.pts[i].x+Math.sin(q.t*41+i*2.3)*5,y:q.pts[i].y+Math.cos(q.t*37+i*1.7)*5};}
  setupDay(){
    const d=this.day,r=this.rng;let w;
    if(d>=this.tyStart+this.tyLen){this.tyStart=d+9+Math.floor(r()*6);this.tyLen=2+(d>40&&r()<.5?1:0);this.tyN++;w='sunny';}
    else if(d>=this.tyStart)w='typhoon';
    else if(d<=3)w='sunny';
    else if(d===4)w='rain';
    else if(d>=20&&!this.doomDone){w='doom';this.doomDone=true;}
    else{const x=r();w=x<.34?'sunny':x<.68?'breezy':'rain';}
    this.weather=w;
    const t0=(d-1)*DAY_LEN;
    this.quakeAt=-1;this.quakeWarned=false;this.pigeonAt=-1;this.torAt=-1;this.uncleAt=-1;
    if(w!=='doom'){
      if(d===7||(d>10&&r()<.14))this.quakeAt=t0+this.u(1.6,3);
      if(w!=='typhoon'&&this.quakeAt<0&&(d===6||(d>10&&r()<.12)))this.torAt=t0+this.u(1.8,2.6);
      if(this.quakeAt<0&&this.torAt<0&&(d===3||(d>7&&r()<.22)))this.uncleAt=t0+this.u(.8,3.2);   // 阿伯不挑天氣，但不跟圈圈事件同一天
      if(w!=='typhoon'&&this.torAt<0&&(d===5||(d>6&&r()<.24)))this.pigeonAt=t0+this.u(.4,2.6);
    }
  }
  slipping(){const h=this.h,on=1-h,pg=this.pigeon;
    const drive=G*(h*(1+.35*this.wet)+(pg&&pg.phase==='on'?PIGEON_LOAD[pg.lv]:0)+on*SIN_)+this.wind*(.6+1.2*h)*(1-.35*this.wet);
    return this.v>15||drive-lerp(MU_FREE,MU_RAIN,this.slick)*G*UX*on>40;}
  gustSpec(){

    case'qteEnd':{const what=ev.kind==='tor'?'龍捲風':'地震';
      if(ev.c===1){banner(`全部點到！${what}拿被被沒辦法`,false,2.6);Snd.blip(700,1200,.18,'triangle',.08);Snd.blip(900,1500,.2,'triangle',.07,.12);}
      else{banner(ev.c===0?`一個都沒點到，被被被${what}${ev.kind==='tor'?'捲':'震'}出去了！`:`漏了 ${ev.miss} 個，被被被${ev.kind==='tor'?'捲':'震'}出去一截`,true,3);shake=Math.max(shake,9);Snd.blip(320,120,.3,'sawtooth',.07);}
      break;}
    case'peck':{peckT=.22;const p=pigeonPos();if(p)for(let i=0;i<3;i++)feathers.push({x:p.x,y:p.y-12,vx:(Math.random()-.5)*110,vy:-30-Math.random()*50,a:Math.random()*TAU,life:.8});Snd.blip(520,380,.08,'square',.05);break;}
    case'uncle':banner('樓上阿伯探頭了！點他，別讓他吐痰',false,2.6);Snd.blip(240,300,.12,'square',.05);break;
    case'hawk':Snd.blip(110,190,.45,'sawtooth',.06);break;
    case'spit':Snd.blip(900,300,.08,'square',.06);break;
    case'spitHit':spatToday=true;shake=Math.max(shake,5);banner('被吐到了！黏黏的每下爬得少，等曬乾或下雨',true,3.4);Snd.blip(300,120,.2,'sawtooth',.07);break;
    case'uncleStop':banner('阿伯被發現，縮回去了',false,1.8);Snd.blip(500,760,.1,'triangle',.08);Snd.blip(760,1000,.1,'triangle',.07,.1);break;
    case'spitDry':banner('痰乾掉了，爬得動了',false,2.2);Snd.blip(600,900,.14,'triangle',.06);break;
    case'pigeon':banner(ev.lv===3?'鴿王駕到！要點 5 下才趕得走':ev.lv===2?'胖鴿子來了！要點 3 下才趕得走':'鴿子來踩被被了，點牠趕走！',ev.lv===3,2.8);Snd.blip(430,350,.2,'sine',.08);Snd.blip(430,350,.22,'sine',.08,.26);break;
    case'shoo':{const p=pigeonPos();if(p)for(let i=0;i<6;i++)feathers.push({x:p.x,y:p.y-10,vx:(Math.random()-.5)*120,vy:-40-Math.random()*60,a:Math.random()*TAU,life:1});Snd.blip(900,500,.1,'triangle',.06);break;}
    case'crawl':cloth.crawl();crawls++;Snd.blip(230,340,.07,'sine',.09);break;
    case'tired':if(tiredT<=0)Snd.blip(180,130,.1,'triangle',.05);tiredT=1.4;break;
    case'gust':if(ev.dir>0&&ev.str>=270)Snd.blip(1300,1300,.04,'square',.025);break;
    case'fall':mode='fall';fallT=0;runDay=sim.day;shake=8;el.vig.style.opacity='0';setHint('');
      if(sim.cause==='tornado')Snd.blip(200,1400,.9,'sine',.1);else Snd.blip(950,110,1.1,'sine',.1);break;
  }
}
const H=1/120;let acc=0,last=0;
function tick(dt){
  time+=dt;
  if(mode==='play'){

    sim.step(dt,inp);inp.tap=false;inp.shoo=false;inp.uncle=false;inp.hits.length=0;
    while(sim.events.length)handle(sim.events.shift());
    if(sim.qte)shake=Math.max(shake,sim.qte.kind==='quake'?6:3);
    if(sim.weather==='typhoon'&&Math.random()<dt*.12)flash=1;
  }
  const idle=mode==='title'||mode==='over';
  const wind=idle?70*Math.sin(time*.8)+45*Math.sin(time*2.1):sim.wind;
  // 龍捲風的位置：從右邊逼近 → 停在棚子上方 → 離開
  const TT=mode==='play'?sim.tor:null,sucked=mode==='fall'&&sim.cause==='tornado';
  if(TT){const e=clamp(1+TT.t/QTE_WARN,0,1);torX=TT.t<0?lerp(wx1+110,286,e*e*(3-2*e)):TT.leave<0?286+Math.sin(time*3)*10:lerp(286,wx1+150,TT.leave/.8);torA=Math.min(1,torA+dt*2.5);}
  else if(sucked){torX+=(260-torX)*Math.min(1,dt*3);torA=Math.min(1,torA+dt*2.5);}
  else torA=Math.max(0,torA-dt*2.5);
  const torArg=torA>0&&!idle?{x:torX,raw:sucked||(mode==='play'&&sim.qte&&sim.qte.kind==='tor')?1:0,k:sucked?1:0}:null;
  cloth.step(dt,{s:idle?14:sim.s,wind,grip:mode==='play'&&sim.gripping,fallen:mode==='fall',time,wet:idle?0:sim.wet,quake:mode==='play'&&sim.quake>0,tor:torArg});
  if(mode==='over')cloth.place(14);
  windVis+=(wind-windVis)*Math.min(1,dt*6);
  const stormT=idle?0:Math.max(torA*.8,sim.weather==='typhoon'?1:sim.weather==='rain'?.55:0),rainT=idle?0:(sim.weather==='typhoon'||sim.weather==='rain')?1:0;
  stormVis+=(stormT-stormVis)*Math.min(1,dt*1.2);rainVis+=(rainT-rainVis)*Math.min(1,dt*1.5);
  shake=Math.max(0,shake-dt*14);flash=Math.max(0,flash-dt*5);
  // 粒子
  const aw=Math.abs(windVis),dirw=Math.sign(windVis)||1;
  if(Math.random()<dt*aw/22)streaks.push({x:dirw>0?wx0-20+Math.random()*(wx1-wx0)*.7:wx1+20-Math.random()*(wx1-wx0)*.7,y:wy0+Math.random()*(wy1-wy0),l:(26+Math.random()*46)*dirw,c:(Math.random()-.5)*8,life:.7});
  for(let i=streaks.length-1;i>=0;i--){const s=streaks[i];s.x+=windVis*1.6*dt;s.life-=dt;if(s.life<=0)streaks.splice(i,1);}
  if(aw>330&&Math.random()<dt*aw/170)leaves.push({x:dirw>0?wx0-10:wx1+10,y:wy0+Math.random()*(wy1-wy0)*.8,a:Math.random()*TAU,va:(Math.random()-.5)*14,vy:(Math.random()-.3)*60,bag:Math.random()<.18});
  for(let i=leaves.length-1;i>=0;i--){const l=leaves[i];l.x+=windVis*1.1*dt;l.y+=(l.vy+Math.sin(time*5+i)*40)*dt;l.a+=l.va*dt;if(l.x<wx0-30||l.x>wx1+30)leaves.splice(i,1);}
  for(const c of clouds){c.x+=(7*c.v+windVis*.05)*dt;if(c.x>900)c.x=-520;else if(c.x<-520)c.x=900;}
  if(rainVis>.02)for(const d of drops){d.y+=760*dt;d.x+=windVis*.5*dt;if(d.y>wy1+10){d.y=wy0-20-Math.random()*40;d.x=wx0-150+Math.random()*(wx1-wx0+300);}}
  // 水滴（濕的被被會滴水）、蒸氣（太陽在曬）
  if(mode==='play'||mode==='fall'){const P=cloth.p,wt=sim.wet;
    if(wt>.2&&Math.random()<dt*wt*7){let n=P[NODES-1];const fr=P.filter(q=>!q.on);if(fr.length)n=fr[(Math.random()*fr.length)|0];else if(Math.random()<.6)n=P[(NODES*.4+Math.random()*NODES*.6)|0];
      drips.push({x:n.x+(Math.random()-.5)*8,y:n.y+R,vy:20,land:n.on});}
    if(mode==='play'&&sim.sun>.3&&wt>.04&&Math.random()<dt*sim.sun*(2.5+6*wt)){const n=P[(Math.random()*NODES)|0];if(n.on)steam.push({x:n.x,y:n.y-R-2,p:Math.random()*TAU,life:.9});}}
  for(let i=drips.length-1;i>=0;i--){const d=drips[i];d.vy+=620*dt;d.y+=d.vy*dt;d.x+=windVis*.12*dt;if(d.y>wy1+10||(d.land&&d.vy>70))drips.splice(i,1);}
  for(let i=steam.length-1;i>=0;i--){const w=steam[i];w.y-=22*dt;w.x+=windVis*.1*dt;w.life-=dt;if(w.life<=0)steam.splice(i,1);}
  for(let i=sparks.length-1;i>=0;i--){const k=sparks[i];k.y-=14*dt;k.life-=dt*1.1;if(k.life<=0)sparks.splice(i,1);}
  for(let i=ripples.length-1;i>=0;i--){if((ripples[i].life-=dt)<=0)ripples.splice(i,1);}
  for(let i=feathers.length-1;i>=0;i--){const f=feathers[i];f.x+=(f.vx+windVis*.3)*dt;f.y+=f.vy*dt;f.vy+=120*dt;f.a+=4*dt;f.life-=dt*.9;if(f.life<=0)feathers.splice(i,1);}
  while(mode==='play'&&stains.length>Math.ceil(sim.dirt-1e-6))stains.pop();
  if(mode==='fall'){fallT+=dt;let top=1e9,bot=-1e9;for(const n of cloth.p){top=Math.min(top,n.y);bot=Math.max(bot,n.y);}if(top>wy1+40||bot<wy0-40||fallT>3)gameOver();}
}
/* 暫停：按暫停鈕、切到別的分頁或 App、視窗失去焦點時都會停；一定要按「繼續」才恢復 */
let paused=false;
function setPaused(v){
  if(v&&(paused||(mode!=='play'&&mode!=='fall')))return;
  if(!v&&!paused)return;
  paused=v;$('pause').hidden=!v;last=0;acc=0;
  if(Snd.ctx){try{v?Snd.ctx.suspend():Snd.ctx.resume();}catch(e){}}
  if(v)$('resume').focus({preventScroll:true});
}
function frame(now){
  const dt=Math.min(.05,(now-(last||now))/1000);last=now;
  if(paused){render();requestAnimationFrame(frame);return;}
  acc+=dt*(mode==='fall'?.6:1);let n=0;while(acc>=H&&n++<12){tick(H);acc-=H;}if(n>=12)acc=0;
  render();hud(dt);Snd.amb(mode==='over'?0:Math.abs(windVis)+torA*550,rainVis);
  requestAnimationFrame(frame);
}

/* 輸入：只有「點」。圈圈事件時點圈圈，鴿子在就點鴿子，其他時候點一下＝往牆邊爬一步 */
function down(cx,cy){
  if(mode!=='play'||paused)return;
  const b=gameEl.getBoundingClientRect(),x=(cx-b.left-ox)/scale,y=(cy-b.top-oy)/scale;
  if(sim.qte){let best=-1,bd=sim.qteR()+16;for(let i=0;i<sim.qte.n;i++){if(sim.qte.hit[i]||inp.hits.includes(i))continue;const p=sim.qtePos(i),d=Math.hypot(x-p.x,y-p.y);if(d<bd){bd=d;best=i;}}
    if(best>=0)inp.hits.push(best);else{ripples.push({x,y,life:.35,bad:true});Snd.blip(170,130,.07,'triangle',.04);}return;}
  if(sim.uncle&&(sim.uncle.phase==='out'||sim.uncle.phase==='hawk')&&Math.hypot(x-UNCLE.x,y-UNCLE.y)<38){inp.uncle=true;ripples.push({x:UNCLE.x,y:UNCLE.y,life:.35,big:true});return;}
  const p=pigeonPos();
  if(p&&sim.pigeon.phase!=='out'&&Math.hypot(x-p.x,y-(p.y-10*PIGEON_SC[p.lv]))<30+10*PIGEON_SC[p.lv]){if(sim.pigeon.phase==='in'){sim.pigeon.phase='on';sim.pigeon.t=0;}inp.shoo=true;return;}
  inp.tap=true;ripples.push({x,y,life:.35});
}
gameEl.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();Snd.init();down(e.clientX,e.clientY);});
gameEl.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden)setPaused(true);});
window.addEventListener('blur',()=>setPaused(true));
window.addEventListener('pagehide',()=>setPaused(true));
window.addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(!e.repeat)setPaused(!paused);return;}
  if(paused||(e.code!=='Space'&&e.code!=='ArrowUp'))return;if(e.target.closest&&e.target.closest('button'))return;e.preventDefault();if(e.repeat)return;
  if(mode==='title'||mode==='over'){start();return;}if(mode==='play'&&!sim.qte)inp.tap=true;});
$('start').addEventListener('click',start);
$('again').addEventListener('click',start);
$('pauseBtn').addEventListener('click',()=>setPaused(true));
$('resume').addEventListener('click',()=>setPaused(false));
el.mute.addEventListener('click',()=>{Snd.init();Snd.setOn(!Snd.on);muteIcon();});
$('share').addEventListener('click',async()=>{
  const text=`我的被被在遮雨棚上撐到 Day ${runDay} 才${sim.cause==='tornado'?'被龍捲風捲走':sim.cause==='quake'?'被地震震下去':'掉下去'}，封號「${$('ovRank').textContent}」。你的能撐幾天？`+(document.querySelector('link[rel=canonical]')?' '+document.querySelector('link[rel=canonical]').href:''),out=$('copied');
  try{await navigator.clipboard.writeText(text);out.textContent='已複製，貼到脆上炫耀吧';}
  catch(e){out.textContent=text;const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);}
});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(gameEl);

muteIcon();showBest();resize();requestAnimationFrame(frame);
window.__bb={Sim,DAY_LEN,get paused(){return paused},get sim(){return sim},get mode(){return mode},start,pigeonXY(){const p=pigeonPos();if(!p)return null;const b=gameEl.getBoundingClientRect();return{x:b.left+ox+p.x*scale,y:b.top+oy+(p.y-10*PIGEON_SC[p.lv])*scale};},uncleXY(){const b=gameEl.getBoundingClientRect();return{x:b.left+ox+UNCLE.x*scale,y:b.top+oy+UNCLE.y*scale};},qteXY(i){const p=sim.qtePos(i),b=gameEl.getBoundingClientRect();return{x:b.left+ox+p.x*scale,y:b.top+oy+p.y*scale};}};
})();
</script>
