@media (prefers-reduced-motion:reduce){.card{animation:none}.listen{animation:none}}

<body>
<div id="game">

      <dl class="stats">
        <div><dt>膽量</dt><dd id="ovScore">0</dd></div>

<script>
(() => {
'use strict';
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[(Math.random()*a.length)|0];
const hash=(i,k)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=id=>document.getElementById(id);
const INK='#1f2a44',PAPER='#f7fbff',BAND='#e5432f',SUN='#ffc93c',WATER='#2f6f9f';
const FONT='"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif';
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ───────── 規則 ─────────
   從上往下看的結冰的湖，一格一格的冰，五格寬。他從下面的岸往上走到對岸，過了一座後面還有一座。
   每塊冰有厚度（hp 1~3，越藍越薄）。踩上去少 1；站著不動每 STAND 秒再少 1；變成 0 之後還能撐 GRACE 秒，然後破掉變成洞。
   所以薄冰（hp 1）只能快步踩過去，不能停。離開一塊已經是 0 的冰，它馬上就破，路會斷在身後。
   後面的冰會從岸邊開始融、一排一排追上來（融冰線）。雪蓋住的冰看不出厚薄；光滑的冰會讓他一路滑到底。
   掉進水裡就結束。踩越薄的冰「膽量」越高，連續踩薄冰有加成 */
const VW=360,VH=640,COLS=5,TW=62,X0=(VW-COLS*TW)/2,RH=58,FEET=452;
const MOVE_T=.11,JUMP_T=.22,STAND=1.5,GRACE=.75,LEAVE_T=.14;
// 用魚換的能力：price 幾條魚、n 一次買到幾次、max 一局最多帶幾次
const KIT={life:{name:'爬起來',desc:'掉下去救一次',price:8,n:1,max:1},jump:{name:'跳兩格',desc:'越過一格 ×3',price:5,n:3,max:6},taxi:{name:'打車',desc:'直接坐到對岸',price:20,n:1,max:1}};
const cellX=c=>X0+TW*c+TW/2;
// 第 n 座湖：幾排、洞和薄冰的比例、有沒有雪／滑冰／霧、融冰線多快
// 湖況：第 KIND_FROM 座起，每座湖有 KIND_P 的機會抽到一種，不連續重複
const KINDS={thin:{name:'薄冰湖',tip:'幾乎整片都是薄冰，一步都不能停'},holes:{name:'碎冰湖',tip:'到處是洞，路要繞'},rink:{name:'溜冰場',tip:'一大片滑冰，踩上去會一路滑到底'},snow:{name:'大雪',tip:'雪把冰蓋住了，看不出底下多厚'},
  fog:{name:'起霧',tip:'只看得到前面兩三排'},warm:{name:'回暖',tip:'後面融得特別快'},wind:{name:'大風',tip:'風會把你往旁邊吹一格，看箭頭'},fish:{name:'魚群',tip:'冰下都是魚，多撈一點'}};
// 朋友來亂：第 PAL_FROM 座起。兔子隔 BALL_GAP 秒丟雪球（越後面越密；第 BALL_2 座起一次兩顆、第 BALL_3 座起三顆），先看到紅圈，BALL_WARN 秒後砸下來，那格少 BALL_DMG 級；
// 有 BALL_ME 的機會其中一顆直接瞄準他腳下，被砸中的話腳下的冰只剩 BALL_GRACE 秒。藍貓隔 CAT_GAP 秒來一次：前面有魚就去搶（CAT_EAT 秒後吃掉），沒魚才幫忙掀雪
const PAL_FROM=2,BALL_GAP=[2.8,4.8],BALL_WARN=.85,BALL_DMG=2,BALL_ME=.4,BALL_GRACE=.45,BALL_2=5,BALL_3=9,CAT_GAP=[7,12],CAT_EAT=2.2,RIDE_IN=.35,RIDE_T=1.15;
const KIND_FROM=3,KIND_P=.65,GUST_WARN=.9,GUST_GAP=[2.4,3.8];let lastKind='';
const lakeOf=n=>{const L={n,len:Math.min(7+n,16),hole:Math.min(.04+.03*n,.26),thin:Math.min(.1+.06*n,.55),mid:.3,snow:n>=2?Math.min(.08+.03*n,.3):0,slip:n>=4?Math.min(.06+.02*n,.2):0,fog:false,melt:Math.min(3,.8+.13*n),wait:Math.max(.6,1.3-.05*n),fishN:2,kind:''};
  if(n>=KIND_FROM&&Math.random()<KIND_P){const k=L.kind=lastKind=pick(Object.keys(KINDS).filter(q=>q!==lastKind));
    if(k==='thin'){L.thin=Math.min(.8,L.thin+.3);L.hole*=.6;}else if(k==='holes')L.hole=Math.min(.4,L.hole*1.8+.06);else if(k==='rink')L.slip=.45;else if(k==='snow')L.snow=.6;else if(k==='fog')L.fog=true;else if(k==='warm'){L.melt=Math.min(3.6,L.melt*1.45);L.wait=.35;}else if(k==='fish')L.fishN=7;}
  else lastKind='';return L;};
