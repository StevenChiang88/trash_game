<style>
  /* 與發佈環境相同的最小底座：上下避開瀏海與手勢列 */

<title>我的豆花30塊</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* 版面：從上往下看的馬路。她站在畫面下方三分之一的斑馬線上往上走，車道一條一條橫在前面；
   左上是過了幾條馬路、保住多少錢，和豆花晃得多厲害的量表。整個畫面點哪裡都是往前走一步 */
:root{
  --ink:#2b2a3a;        /* 描邊與文字 */
  --paper:#fff8ea;      /* 卡片、豆花的白 */
  --syrup:#c9772e;      /* 糖水的焦糖色：主色 */
  --syrup-deep:#8a4a14;
  --sun:#ffc94a;        /* 按鈕、強調 */
  --calm:#3a9a94;       /* 豆花很穩 */
  --alert:#e4572e;      /* 快掉了、掉了 */
  --ok:#2f9a7c;
  --road:#7a7786;       /* 柏油路 */
  --backdrop:#1c1b29;   /* 電腦版：手機畫面外的底色 */
  --display:"Fredoka","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --sticker:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 -2.5px 0 var(--ink),0 2.5px 0 var(--ink),-2.5px 0 0 var(--ink),2.5px 0 0 var(--ink);
}
html,body{height:100%;touch-action:manipulation}
button{touch-action:manipulation}
body{background:var(--road);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none;display:grid;place-items:center}
#game{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:8px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.left{display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.count{display:flex;align-items:baseline;gap:5px;font-family:var(--display);color:var(--paper);text-shadow:var(--sticker);line-height:1}
.count small{font-family:var(--body);font-weight:900;font-size:15px}
.count b{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
/* 豆花晃動：越滿越危險，滿了就掉。變紅表示快掉了 */
.pat{display:flex;flex-direction:column;gap:3px;width:150px}
.pat span{font-weight:900;font-size:12px;color:var(--paper);text-shadow:var(--sticker);line-height:1}
.timer{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--calm);transform-origin:left center}
.timer.low i{background:var(--alert)}
.icon-btn{pointer-events:auto;width:40px;height:40px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);cursor:pointer;padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn:focus-visible,.btn:focus-visible{outline:3px solid var(--calm);outline-offset:3px}
.gap{flex:1}
.hint{align-self:center;margin-top:auto;margin-bottom:4px;text-align:center;font-weight:900;font-size:17px;color:var(--paper);text-shadow:var(--sticker);min-height:1.5em;text-wrap:balance}
.btn{pointer-events:auto;font:inherit;font-weight:900;font-size:20px;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:16px;padding:12px 30px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);font-size:16px;padding:10px 20px}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:28px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
#title{background:linear-gradient(rgba(28,27,41,.55),rgba(28,27,41,0) 32%,rgba(28,27,41,0) 76%,rgba(28,27,41,.55))}
.logo{margin:4vh 0 0;font-weight:900;font-size:clamp(40px,12.5vw,62px);line-height:1;letter-spacing:.02em;color:var(--paper);text-shadow:var(--sticker),0 7px 0 var(--ink);transform:rotate(-3deg)}
.logo span{display:inline-block;color:var(--sun)}
.tag{margin:6px 0 0;font-weight:900;font-size:17px;color:var(--paper);text-shadow:var(--sticker);text-wrap:balance}
.how{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0;padding:0;list-style:none;font-size:14px}
.how li{padding:6px 12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.how b{font-weight:900;color:var(--syrup-deep)}
.best{font-weight:900;font-size:14px;color:var(--paper);text-shadow:var(--sticker);min-height:1.4em}
.home{pointer-events:auto;font-weight:900;font-size:14px;color:var(--paper);text-shadow:var(--sticker);text-underline-offset:4px}

#over,#pause{justify-content:center;background:rgba(28,27,41,.5)}
.card{width:min(330px,100%);display:flex;flex-direction:column;gap:14px;padding:18px;border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--ink);text-align:left;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateY(30px) scale(.94);opacity:0}}
.verdict{margin:0;font-weight:900;font-size:30px;line-height:1.25}
.verdict .n{font-family:var(--display);font-weight:700;color:var(--alert)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:0}
.stats dt{font-size:12px;opacity:.65}
.stats dd{margin:0;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.stats .wide{grid-column:1/-1}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.copied{font-size:13px;font-weight:900;color:var(--ok);min-height:1.3em;user-select:text;-webkit-user-select:text}
.note{margin:0;font-size:14px;opacity:.75}
@media (min-aspect-ratio:10/16){body{background:var(--backdrop)}#game{height:min(100% - 32px,900px);border-radius:26px;box-shadow:0 0 0 3px var(--ink),0 18px 50px rgba(0,0,0,.45)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c" aria-label="提著豆花的女學生站在斑馬線上，前面是一條一條有車的車道"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="top">
      <div class="left">
        <div class="count"><small>保住</small><b id="num">$0</b></div>
        <div class="pat"><span>豆花晃動</span><div class="timer" id="timer"><i id="timerFill"></i></div></div>
      </div>
      <div class="side">
        <button class="icon-btn" id="pauseBtn" type="button" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.6"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.6"/></svg></button>
        <button class="icon-btn" id="mute" type="button" aria-label="聲音開關"></button>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="screen" id="title">
    <h1 class="logo">我的豆花<span>30塊</span></h1>
    <p class="tag">提著一碗豆花過馬路。<br>車要閃，豆花也不能晃過頭。</p>
    <ul class="how">
      <li><b>點一下</b> 往前走一步</li>
      <li><b>走太急</b> 豆花會晃</li>
      <li><b>過一條馬路</b> 保住 30 塊</li>
    </ul>
    <div class="gap"></div>
    <button class="btn" id="start" type="button">買好了，過馬路</button>
    <div class="best" id="best"></div>
    <a class="home" href="../">其他遊戲</a>
  </div>

  <div class="screen" id="over" hidden>
    <div class="card">
      <p class="verdict">我的豆花，<span class="n">30 塊</span>！</p>
      <dl class="stats">
        <div><dt>過了幾條馬路</dt><dd id="ovN">0 條</dd></div>
        <div><dt>最佳紀錄</dt><dd id="ovBest">0 條</dd></div>
        <div><dt>掉之前保住了</dt><dd id="ovSave">$0</dd></div>
        <div><dt>封號</dt><dd id="ovRank"></dd></div>
        <div class="wide"><dt>怎麼掉的</dt><dd id="ovMiss"></dd></div>
      </dl>
      <div class="acts">
        <button class="btn" id="again" type="button">再買一碗</button>
        <button class="btn ghost" id="share" type="button">複製戰績</button>
      </div>
      <div class="copied" id="copied"></div>
    </div>
  </div>

  <div class="screen" id="pause" hidden>
    <div class="card">
      <p class="verdict">暫停中</p>
      <p class="note">離開畫面會自動暫停，按「繼續」再接著走。</p>
      <div class="acts"><button class="btn" id="resume" type="button">繼續</button></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[(Math.random()*a.length)|0];
const hash=(i,k)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=id=>document.getElementById(id);
const INK='#2b2a3a',PAPER='#fff8ea',SYRUP='#c9772e',SUN='#ffc94a',ALERT='#e4572e',ROAD='#7a7786';
const FONT='"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif';
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ───────── 規則 ─────────
   馬路從上往下看：一條車道是一列（row），她站在斑馬線上，點一下往上走一列。
   手上那袋豆花像鐘擺：每走一步推它一下，連走太急就越晃越大；被喇叭嚇到、踩到水窪也會晃。晃過頭就掉 */
const VW=360,VH=640,CX=180,RH=58,FEET=470;
const W0=6.6,ZETA=.15,STEP_J=3.7,HONK_J=2.3,PUD_J=3.2,LIMIT=1.05,STEP_T=.15,PRICE=30;
// 車：len 車長、w 車寬、n 被撞到時怎麼稱呼
const KIND={scoot:{len:34,w:20,n:'機車'},car:{len:62,w:32,n:'汽車'},taxi:{len:62,w:32,n:'計程車'},truck:{len:84,w:34,n:'小貨車'},bus:{len:132,w:38,n:'公車'}};
const CAR_COL=['#e4572e','#5c7fb8','#fff8ea','#3a3d52','#3a9a94','#c9ced6'],SCOOT_COL=['#e4572e','#ffc94a','#5c7fb8','#fff8ea','#3a9a94','#f08fb0'];

/* ───────── 聲音 ───────── */
const Snd={ctx:null,on:store.get('dh.mute')!=='1',
  init(){if(this.ctx){if(this.ctx.state==='suspended'&&!paused)this.ctx.resume();return;}
    try{const C=window.AudioContext||window.webkitAudioContext,c=this.ctx=new C();this.master=c.createGain();this.master.gain.value=this.on?1:0;this.master.connect(c.destination);
      const buf=c.createBuffer(1,c.sampleRate,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.noise=buf;}catch(e){this.ctx=null;}},
  blip(f0,f1,dur,type,vol,delay){if(!this.ctx)return;const c=this.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.1,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+.03);},
  honk(){this.blip(392,385,.22,'square',.07);this.blip(494,486,.22,'square',.06);},
  splat(){if(!this.ctx)return;const c=this.ctx,t=c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.noise;f.type='lowpass';f.frequency.value=700;
    g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+.3);},
  // 「啊——」：一聲拉長往上飄再掉下來的尖叫，帶一點抖音
  scream(){if(!this.ctx)return;const c=this.ctx,t=c.currentTime+.12,o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),f=c.createBiquadFilter(),g=c.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(620,t);o.frequency.linearRampToValueAtTime(980,t+.25);o.frequency.linearRampToValueAtTime(900,t+.8);o.frequency.exponentialRampToValueAtTime(420,t+1.15);
    l.frequency.value=9;lg.gain.value=26;l.connect(lg);lg.connect(o.frequency);f.type='bandpass';f.frequency.value=1500;f.Q.value=1.1;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.05);g.gain.setValueAtTime(.2,t+.85);g.gain.exponentialRampToValueAtTime(.001,t+1.2);
    o.connect(f);f.connect(g);g.connect(this.master);o.start(t);l.start(t);o.stop(t+1.25);l.stop(t+1.25);},
  setOn(v){this.on=v;store.set('dh.mute',v?'0':'1');if(this.ctx)this.master.gain.setTargetAtTime(v?1:0,this.ctx.currentTime,.02);}
};

/* ───────── 狀態 ───────── */
let mode='title',time=0,rows=[],gen=0,pr=1,from=1,camR=1,stepT=0,buf=false,th=0,om=0,foot=1,streets=0,best=parseInt(store.get('dh.best')||'0',10)||0;
let cause='',lastShock='step',dropT=0,dropX=CX,dropY=0,shake=0,flash=0,friendR=0,friendFrom=0,friendT=0,friendD=.15;
const pops=[],splash=[];

// 排一條馬路：一段一段的車道，段跟段之間有分隔島可以站。越後面段越多、車越快越密，更後面才有連三線
// （手機上只看得到車子開到前一秒多，連三線又不能連踩，所以前面最多連兩線）
function genStreet(){
  const k=++gen,D=Math.min(1,(k-1)/14),flipG=Math.random()<.5;
  const G=k<=2?[2]:k<=4?(flipG?[1,2]:[2,1]):k<=7?[2,2]:k<=10?(flipG?[2,3]:[3,2]):[3,3],n=G.reduce((a,c)=>a+c,0);let lastPud=false,i=0;
  G.forEach((m,g)=>{
    if(g)rows.push({t:'median',street:k,veh:[]});
    for(let j=0;j<m;j++,i++){
      const dir=G.length>1?(g?-1:1):(j?-1:1),edge=i===0||i===n-1,sp=(edge?96:80)+rnd(0,24)+Math.min(k,20)*4.5+(edge?10:0),pud=k>=2&&!lastPud&&Math.random()<.17;lastPud=pud;   // 靠右行駛：近的這半邊車從左邊來
      const row={t:'lane',street:k,dir,sp,edge,t0:lerp(1.3,.86,D),t1:lerp(2.8,1.75,D),pud,veh:[],gap:0,first:j===0,flip:G.length===1&&j===1};
      for(let x=-170;x<540;){const v=mkVeh(row);x+=v.len/2;v.x=dir>0?x:360-x;row.veh.push(v);x+=v.len/2+row.sp*rnd(row.t0,row.t1);}   // 先把整條車道排滿，不要一開始是空的
      row.veh=row.veh.filter(v=>Math.abs(v.x-CX)>70||k>1);row.gap=row.sp*rnd(.2,row.t1);rows.push(row);}});
  rows.push({t:'walk',street:k,goal:true,veh:[]});rows.push({t:'walk',street:k,veh:[]});
}
function mkVeh(row){const r=Math.random(),k=row.edge?(r<.72?'scoot':r<.9?'car':'taxi'):(r<.3?'scoot':r<.62?'car':r<.75?'taxi':r<.9?'truck':'bus'),K=KIND[k];
  return{k,len:K.len,w:K.w,x:0,col:k==='scoot'?pick(SCOOT_COL):k==='taxi'?'#ffc94a':k==='truck'?'#5c7fb8':k==='bus'?'#3fae8f':pick(CAR_COL),honk:false,hel:pick(['#e4572e','#fff8ea','#3a3d52','#ffc94a','#5c7fb8'])};}
function need(r){while(rows.length<r+14)genStreet();}

/* ───────── 畫面 ───────── */
const gameEl=$('game'),cv=$('c'),g=cv.getContext('2d');
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
let cw=1,ch=1,dpr=1,scale=1,ox=0,oy=0,wx0=0,wx1=VW,wy0=0,wy1=VH;
function resize(){
  const b=gameEl.getBoundingClientRect();cw=Math.max(1,b.width);ch=Math.max(1,b.height);dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);scale=Math.min(cw/VW,ch/VH);ox=(cw-VW*scale)/2;oy=(ch-VH*scale)/2;
  wx0=-ox/scale;wx1=(cw-ox)/scale;wy0=-oy/scale;wy1=(ch-oy)/scale;
}
const rowY=r=>FEET-14-(r-camR)*RH;   // 這一列的中線在畫面上的 y
// 從上往下看的車。都畫成車頭朝右，往左開的再翻過來
function drawVeh(c,v,dir){
  c.save();c.translate(v.x,0);c.scale(dir,1);c.lineJoin='round';c.strokeStyle=INK;c.lineWidth=2.6;const L=v.len,W=v.w;
  c.fillStyle='rgba(43,42,58,.2)';rrect(c,-L/2+3,-W/2+5,L,W,8);c.fill();
  if(v.k==='scoot'){
    c.fillStyle=INK;rrect(c,-L/2,-4,9,8,3);c.fill();rrect(c,L/2-9,-4,9,8,3);c.fill();                                   // 前後輪

  if(mode==='over')return;
  // 車流：每條車道各開各的，前一台開遠了就再來一台
  const lo=Math.max(0,Math.floor(camR)-4),hi=Math.min(rows.length-1,Math.floor(camR)+13);
  for(let r=lo;r<=hi;r++){const row=rows[r];if(row.t!=='lane'||(mode==='drop'&&(r===pr||r===from)))continue;const d=row.dir*row.sp*dt;
    for(let i=row.veh.length-1;i>=0;i--){const v=row.veh[i];v.x+=d;if((v.x-CX)*row.dir>400)row.veh.splice(i,1);}   // 開出畫面夠遠才拿掉（只看開走的那一邊，剛從另一邊進來的不算）
    if((row.gap-=row.sp*dt)<=0){const v=mkVeh(row);v.x=row.dir>0?-200-v.len/2:560+v.len/2;row.veh.push(v);row.gap=v.len+row.sp*rnd(row.t0,row.t1);}}
  camR+=((stepT>0?from+(1-stepT/STEP_T):pr)-camR)*Math.min(1,dt*10);
  if(friendT>0)friendT=Math.max(0,friendT-dt);
  if(mode==='drop'){dropT+=dt;if(dropT>.55&&dropT-dt<=.55)pop(CX,270,'我的豆花！30塊！',SUN,true,{huge:true,life:1.4,dur:1.4,rot:-.05});if(dropT>2.1)gameOver();return;}
  if(mode!=='play')return;
  if(stepT>0&&(stepT-=dt)<=0){stepT=0;land();}
  // 豆花的擺動
  om+=(-W0*W0*th-2*ZETA*W0*om)*dt;th+=om*dt;
  if(Math.abs(th)>LIMIT)return drop(lastShock==='honk'?'被喇叭嚇到，手一抖就掉了':lastShock==='puddle'?'踩到水窪滑了一下':'走太急，晃到掉出來');
  // 被撞、被叭：只看她現在站的那一列
  const cur=stepT>STEP_T*.55?from:pr,row=rows[cur];
  if(row.t==='lane')for(const v of row.veh){const dx=(CX-v.x)*row.dir,half=v.len/2;   // dx>0：車還沒到她這裡
    if(Math.abs(v.x-CX)<half+10)return drop(`被${KIND[v.k].n}撞到`);
    if(!v.honk&&dx>half&&dx<half+96){v.honk=true;shock(HONK_J,'honk');Snd.honk();pop(v.x+row.dir*half,rowY(cur)-30,'叭！',ALERT);}}
}
function hud(){
  if(mode!=='play'&&mode!=='drop')return;
  if(streets!==lastNum){lastNum=streets;el.num.textContent='$'+streets*PRICE;}
  const a=clamp(Math.abs(th)/LIMIT,0,1),f=Math.round(a*100);if(f!==lastFill){lastFill=f;el.fill.style.transform=`scaleX(${a.toFixed(2)})`;el.timer.classList.toggle('low',a>.72);}
  setHint(mode!=='play'?'':streets===0&&pr<=1?'點一下往前走一步。看準沒車再走':streets===0?'連走太急豆花會越晃越大，站在車道上會被叭':rows[pr+1]&&rows[pr+1].pud&&streets<6?'前面有水窪，踩上去會滑':'');
}
const H=1/120;let acc=0,last=0,hold=false;
function setPaused(p){if(p&&(paused||mode!=='play'))return;if(!p&&!paused)return;paused=p;$('pause').hidden=!p;last=0;acc=0;if(Snd.ctx){try{p?Snd.ctx.suspend():Snd.ctx.resume();}catch(e){}}if(p)$('resume').focus({preventScroll:true});}
function frame(now){
  const dt=Math.min(.05,(now-(last||now))/1000);last=now;
  if(!paused&&!hold){acc+=dt;let n=0;while(acc>=H&&n++<10){tick(H);acc-=H;}if(n>=10)acc=0;hud();}
  render();requestAnimationFrame(frame);
}

/* ───────── 輸入：整個畫面點哪裡都是往前走一步 ───────── */
gameEl.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;e.preventDefault();Snd.init();step();});
gameEl.addEventListener('contextmenu',e=>e.preventDefault());
/* iOS Safari：快速點兩下會被當成「點兩下放大」，而且放大後縮不回來，所以把雙擊縮放、雙指縮放都擋掉 */
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now(),btn=e.target&&e.target.closest&&e.target.closest('button,a');if(now-lastTouchEnd<=350&&!btn&&e.cancelable)e.preventDefault();lastTouchEnd=now;},{passive:false});
for(const t of['gesturestart','gesturechange','gestureend'])document.addEventListener(t,e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden)setPaused(true);});
window.addEventListener('blur',()=>setPaused(true));
window.addEventListener('pagehide',()=>setPaused(true));
window.addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(!e.repeat)setPaused(!paused);return;}
  if(paused||e.repeat||(e.code!=='Space'&&e.code!=='Enter'&&e.code!=='ArrowUp'))return;if(e.target.closest&&e.target.closest('button,a'))return;e.preventDefault();Snd.init();
  if(mode==='play')step();else if(mode==='title'||mode==='over')start();});
$('start').addEventListener('click',start);
$('again').addEventListener('click',start);
$('pauseBtn').addEventListener('click',()=>setPaused(true));
$('resume').addEventListener('click',()=>setPaused(false));
el.mute.addEventListener('click',()=>{Snd.init();Snd.setOn(!Snd.on);muteIcon();});
$('share').addEventListener('click',async()=>{
  const link=document.querySelector('link[rel=canonical]'),out=$('copied');
  const text=`我提著豆花過了 ${streets} 條馬路才掉（${cause}）。我的豆花，30塊！封號「${$('ovRank').textContent}」。你能過幾條？`+(link?' '+link.href:'');
  try{await navigator.clipboard.writeText(text);out.textContent='已複製，貼到脆上炫耀吧';}
  catch(e){out.textContent=text;const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);}
});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(gameEl);

reset();muteIcon();showBest();resize();requestAnimationFrame(frame);
window.__dh={KIND,LIMIT,W0,ZETA,STEP_J,STEP_T,CX,get rows(){return rows},get mode(){return mode},get pr(){return pr},get th(){return th},get om(){return om},set th(v){th=v;},set om(v){om=v;},get stepT(){return stepT},get streets(){return streets},get cause(){return cause},get paused(){return paused},
  step,start,tick,set hold(v){hold=v;},set pr(v){pr=from=v;camR=v;need(v);}};
})();
</script>
