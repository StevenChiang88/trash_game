<style>
/* 版面：從上往下看的馬路。她站在畫面下方三分之一的斑馬線上往上走，車道一條一條橫在前面；
   左上是過了幾條馬路、保住多少錢，和豆花晃得多厲害的量表。整個畫面點哪裡都是往前走一步 */
:root{
  --ink:#2b2a3a;        /* 描邊與文字 */
  --paper:#fff8ea;      /* 卡片、豆花的白 */
  --syrup:#c9772e;      /* 糖水的焦糖色：主色 */
  --syrup-deep:#8a4a14;
  --sun:#ffc94a;        /* 按鈕、強調 */
  --calm:#3a9a94;       /* 豆花很穩 */
  --alert:#e4572e;      /* 快掉了、掉了 */
  --ok:#2f9a7c;
  --road:#7a7786;       /* 柏油路 */
  --backdrop:#1c1b29;   /* 電腦版：手機畫面外的底色 */
  --display:"Fredoka","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --sticker:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 -2.5px 0 var(--ink),0 2.5px 0 var(--ink),-2.5px 0 0 var(--ink),2.5px 0 0 var(--ink);
}
html,body{height:100%;touch-action:none;overscroll-behavior:none}
button{touch-action:manipulation}
body{background:var(--road);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none;display:grid;place-items:center}
#game{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:8px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.left{display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.count{display:flex;align-items:baseline;gap:5px;font-family:var(--display);color:var(--paper);text-shadow:var(--sticker);line-height:1}
.count small{font-family:var(--body);font-weight:900;font-size:15px}
.count b{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
/* 野狗多近：越滿越近 */
.timer.dog i{background:#b9824d;transform:scaleX(0)}
.timer.dog.low i{background:var(--alert)}
/* 標題上的「第幾天」、結算畫面的升級商店 */
.daytag{font-weight:900;font-size:18px;padding:6px 16px;border:2.5px solid var(--ink);border-radius:999px;background:var(--sun);color:var(--ink)}
.link{pointer-events:auto;font:inherit;font-weight:900;font-size:13px;color:var(--paper);text-shadow:var(--sticker);background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
.shophead{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;border-top:2.5px dashed rgba(43,42,58,.25);padding-top:10px}
.shophead>b{font-weight:900;font-size:16px}.shophead span b{font-family:var(--display);font-size:18px;color:var(--syrup-deep)}
.shop{display:flex;flex-direction:column;gap:6px}
.up{pointer-events:auto;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;font:inherit;color:var(--ink);text-align:left;padding:6px 10px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer}
.up .un{display:flex;flex-direction:column;line-height:1.25;min-width:0}.up .un b{font-weight:900;font-size:14px}.up .un small{font-size:11px;opacity:.7}
.up .lv{font-size:11px;letter-spacing:1px;color:var(--syrup-deep)}
.up .pr{font-family:var(--display);font-weight:700;font-size:15px;min-width:42px;text-align:center;padding:3px 6px;border-radius:8px;background:var(--sun);border:2px solid var(--ink)}
.up:disabled{cursor:default;background:transparent;border-color:rgba(43,42,58,.3)}.up:disabled .pr{background:transparent;border-color:rgba(43,42,58,.3);opacity:.6}
.up:not(:disabled):active{transform:translateY(2px)}
.card{max-height:100%;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain}
/* 零錢：湊滿 30 塊會亮起來，過完這條朋友就去多買一碗 */
.wallet{display:flex;align-items:center;gap:6px;font-weight:900;font-size:16px;color:var(--paper);text-shadow:var(--sticker);line-height:1}
.wallet .coin{display:grid;place-items:center;width:20px;height:20px;border:2.5px solid var(--ink);border-radius:50%;background:var(--sun);color:var(--ink);font-family:var(--display);font-size:12px;text-shadow:none}
.wallet b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.wallet.full b{color:var(--sun)}
.wallet .spare{font-size:12px;padding:3px 8px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);text-shadow:none}
/* 豆花晃動：越滿越危險，滿了就掉。變紅表示快掉了 */
.pat{display:flex;flex-direction:column;gap:3px;width:150px}
.pat span{font-weight:900;font-size:12px;color:var(--paper);text-shadow:var(--sticker);line-height:1}
.timer{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--calm);transform-origin:left center}
.timer.low i{background:var(--alert)}
/* 現在踏出去會把袋子帶穩：量表變綠 */
.timer.good{box-shadow:0 0 0 3px var(--ok)}
.timer.good i{background:var(--ok)}
.wallet .spare.lid{background:#7fc4e8}
.icon-btn{pointer-events:auto;width:40px;height:40px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);cursor:pointer;padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn:focus-visible,.btn:focus-visible{outline:3px solid var(--calm);outline-offset:3px}
.gap{flex:1}
.hint{align-self:center;margin-top:auto;margin-bottom:4px;text-align:center;font-weight:900;font-size:17px;color:var(--paper);text-shadow:var(--sticker);min-height:1.5em;text-wrap:balance}
.btn{pointer-events:auto;font:inherit;font-weight:900;font-size:20px;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:16px;padding:12px 30px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);font-size:16px;padding:10px 20px}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:28px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
#title{background:linear-gradient(rgba(28,27,41,.55),rgba(28,27,41,0) 32%,rgba(28,27,41,0) 76%,rgba(28,27,41,.55))}
.logo{margin:4vh 0 0;font-weight:900;font-size:clamp(40px,12.5vw,62px);line-height:1;letter-spacing:.02em;color:var(--paper);text-shadow:var(--sticker),0 7px 0 var(--ink);transform:rotate(-3deg)}
.logo span{display:inline-block;color:var(--sun)}
.tag{margin:6px 0 0;font-weight:900;font-size:17px;color:var(--paper);text-shadow:var(--sticker);text-wrap:balance}
.how{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0;padding:0;list-style:none;font-size:14px}
.how li{padding:6px 12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.how b{font-weight:900;color:var(--syrup-deep)}
.best{font-weight:900;font-size:14px;color:var(--paper);text-shadow:var(--sticker);min-height:1.4em}
.home{pointer-events:auto;font-weight:900;font-size:14px;color:var(--paper);text-shadow:var(--sticker);text-underline-offset:4px}

#over,#pause{justify-content:center;background:rgba(28,27,41,.5)}
.card{width:min(330px,100%);display:flex;flex-direction:column;gap:14px;padding:18px;border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--ink);text-align:left;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateY(30px) scale(.94);opacity:0}}
.verdict{margin:0;font-weight:900;font-size:30px;line-height:1.25}
.verdict .n{font-family:var(--display);font-weight:700;color:var(--alert)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:0}
.stats dt{font-size:12px;opacity:.65}
.stats dd{margin:0;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.stats .wide{grid-column:1/-1}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.copied{font-size:13px;font-weight:900;color:var(--ok);min-height:1.3em;user-select:text;-webkit-user-select:text}
.note{margin:0;font-size:14px;opacity:.75}
@media (min-aspect-ratio:10/16){body{background:var(--backdrop)}#game{height:min(100% - 32px,900px);border-radius:26px;box-shadow:0 0 0 3px var(--ink),0 18px 50px rgba(0,0,0,.45)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c" aria-label="提著豆花的女學生站在斑馬線上，前面是一條一條有車的車道"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="top">
      <div class="left">
        <div class="count"><small>第 <span id="dayN">1</span> 天　過了</small><b id="num">0</b><small>/ <span id="goal">5</span> 條</small></div>
        <div class="wallet" id="wallet"><span class="coin" aria-hidden="true">$</span><b id="money">$0</b><span class="spare" id="spare" hidden>朋友手上還有一碗</span><span class="spare lid" id="lidOn" hidden>有蓋</span></div>
        <div class="pat"><span>豆花晃動</span><div class="timer" id="timer"><i id="timerFill"></i></div></div>
        <div class="pat" id="dogm" hidden><span>野狗多近</span><div class="timer dog" id="dogT"><i id="dogFill"></i></div></div>
      </div>
      <div class="side">
        <button class="icon-btn" id="pauseBtn" type="button" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.6"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.6"/></svg></button>
        <button class="icon-btn" id="mute" type="button" aria-label="聲音開關"></button>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="screen" id="title">
    <h1 class="logo">我的豆花<span>30塊</span></h1>
    <p class="tag">提著一碗豆花走回家。<br>車要閃，豆花不能晃過頭，後面還有狗。</p>
    <ul class="how">
      <li><b>點一下</b> 往前走</li>
      <li><b>左右滑</b> 橫著走一格</li>
      <li><b>往下滑</b> 退一步</li>
      <li><b>走太急</b> 豆花會晃</li>
      <li><b>變綠再踩</b> 越走越穩</li>
      <li><b>走到家</b> 過一天</li>
      <li><b>掉光</b> 從第 1 天重來</li>
      <li><b>每撿滿 30 塊</b> 朋友多買一碗</li>
    </ul>
    <div class="gap"></div>
    <button class="btn" id="start" type="button">買好了，過馬路</button>
    <div class="daytag" id="dayTag"></div>
    <div class="best" id="best"></div>
    <button class="link" id="restart" type="button" hidden>放棄這一輪，從第 1 天重來</button>
    <a class="home" href="../">其他遊戲</a>
  </div>

  <div class="screen" id="over" hidden>
    <div class="card">
      <p class="verdict" id="ovTitle">我的豆花，<span class="n">30 塊</span>！</p>
      <dl class="stats">
        <div><dt>今天</dt><dd id="ovN"></dd></div>
        <div><dt id="ovBestL">最遠</dt><dd id="ovBest"></dd></div>
        <div><dt id="ovGainL">今天存進去</dt><dd id="ovGain"></dd></div>
        <div><dt id="ovMissL">怎麼掉的</dt><dd id="ovMiss"></dd></div>
      </dl>
      <div class="shophead" id="shophead"><b>升級</b><span>存款 <b id="bank">$0</b></span></div>
      <div class="shop" id="shop"></div>
      <div class="acts">
        <button class="btn" id="again" type="button">再買一碗</button>
        <button class="btn ghost" id="share" type="button">複製戰績</button>

      <div class="copied" id="copied"></div>

  <div class="screen" id="pause" hidden>
    <div class="card">
      <p class="verdict">暫停中</p>

      <div class="acts"><button class="btn" id="resume" type="button">繼續</button></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[(Math.random()*a.length)|0];
const hash=(i,k)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=id=>document.getElementById(id);
const INK='#2b2a3a',PAPER='#fff8ea',SYRUP='#c9772e',SUN='#ffc94a',ALERT='#e4572e',ROAD='#7a7786';
const FONT='"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif';
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ───────── 規則 ─────────
   馬路從上往下看：一條車道是一列（row），她站在斑馬線上，點一下往上走一列。
   手上那袋豆花像鐘擺：每走一步推它一下，連走太急就越晃越大；被喇叭嚇到、踩到水窪也會晃。晃過頭就掉。
   斑馬線上有左、中、右三個位置，往左右滑一次橫著走一格，也可以退一步。朋友貼在旁邊一起走。朋友一開始也買了一碗：自己的掉了就換她那碗繼續走，
   她手上也沒有才真的結束。路上有零錢，湊滿 30 塊，過完那條馬路她會在路邊那攤再買一碗 */
const VW=360,VH=640,CX=180,RH=58,FEET=470;
const W0=6.6,ZETA=.15,STEP_J=3.7,HONK_J=2.3,PUD_J=3.2,LIMIT=1.05,STEP_T=.15,PRICE=30,COLW=58,NEAR_T=.34,NEAR_V=5;
// 橫著移動：能站的範圍、最快多快、每移動 1px 推袋子多少；朋友最多幫忙提幾碗
const XMIN=CX-92,XMAX=CX+92,LAT_V=640,LAT_J=.02;
const PX=c=>CX+c*COLW;
// 豆花掉的時候要放的錄音檔（放在同一個資料夾）。留空就用裝置內建的語音唸。VOICE_GAIN 是音量
const VOICE_FILE='voice.mp3',VOICE_GAIN=.9;

/* ───────── 回家的路：一天一關 ─────────
   每天要過完 goalN 條馬路走到家。過關就進下一天，每天多一種狀況；第 8 天起每天混兩種。
   到家時，身上的零錢加上獎金存起來，可以在結算畫面買升級。
   兩個人的豆花都掉光＝這一輪結束：回到第 1 天，存款和升級全部歸零。留下來的只有「最遠通過幾天」和每天拿過的星星 */
const MODN={dog:'野狗',rain:'下雨',rush:'下班尖峰',night:'天黑',trash:'垃圾車',wind:'颱風'};
const MODHINT={dog:'野狗就在你後面。站著不動牠會靠過來，往前走才甩得開',rain:'下雨天到處是水窪，繞開，或等袋子靜下來再踩',rush:'下班時間，車特別多',night:'天黑了，只看得到車燈照到的地方',trash:'垃圾車很長。聽到音樂就是它來了',wind:'颱風天。看到「風來了」先站穩'};
function modsFor(d){
  if(d<=1)return[];const fixed={2:[],3:['rain'],4:['rush'],5:['night'],6:['trash'],7:['wind']}[d];if(fixed)return['dog'].concat(fixed);
  const pool=['rain','rush','night','trash','wind'],a=Math.floor(hash(d,3)*5);let b=Math.floor(hash(d,7)*4);if(b>=a)b++;
  const m=['dog',pool[a],pool[b]];if(d>=12){const c=pool[(a+b+1)%5];if(!m.includes(c))m.push(c);}return m;
}
const needOf=d=>Math.min(4+d,12);
const dayLabel=d=>modsFor(d).map(m=>MODN[m]).join('、')||'放學';
const UPG=[
  {id:'lid',n:'加蓋',d:'豆花比較不容易晃出來',max:3,cost:[40,90,160]},
  {id:'bag',n:'雙層塑膠袋',d:'被叭、被風吹時晃得比較小',max:2,cost:[50,120]},
  {id:'shoe',n:'防滑鞋',d:'踩到水窪晃得比較小',max:2,cost:[40,100]},
  {id:'pal',n:'朋友多帶一碗',d:'出門時多一碗，路上也能多提一碗',max:2,cost:[70,160]},
  {id:'jerky',n:'肉乾',d:'野狗追得比較慢',max:2,cost:[60,140]}];
let day=clamp(parseInt(store.get('dh.day')||'1',10)||1,1,999),bank=Math.max(0,parseInt(store.get('dh.bank')||'0',10)||0),ups={};

  blip(f0,f1,dur,type,vol,delay){if(!this.ctx)return;const c=this.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.1,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+.03);},
  honk(){this.blip(392,385,.22,'square',.07);this.blip(494,486,.22,'square',.06);},
  splat(){if(!this.ctx)return;const c=this.ctx,t=c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.noise;f.type='lowpass';f.frequency.value=700;

  // 「啊——」：一聲拉長往上飄再掉下來的尖叫，帶一點抖音
  scream(){if(!this.ctx)return;const c=this.ctx,t=c.currentTime+.12,o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),f=c.createBiquadFilter(),g=c.createGain();

    l.frequency.value=9;lg.gain.value=26;l.connect(lg);lg.connect(o.frequency);f.type='bandpass';f.frequency.value=1500;f.Q.value=1.1;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.05);g.gain.setValueAtTime(.2,t+.42);g.gain.exponentialRampToValueAtTime(.001,t+.64);
    o.connect(f);f.connect(g);g.connect(this.master);o.start(t);l.start(t);o.stop(t+.7);l.stop(t+.7);},
  bark(){this.blip(520,300,.09,'square',.07);this.blip(480,260,.1,'square',.06,.12);},
  wind(){if(!this.ctx)return;const c=this.ctx,t=c.currentTime,n=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();n.buffer=this.noise;n.loop=true;f.type='bandpass';f.Q.value=.8;

// 那句話用裝置內建的中文語音喊出來，調高、調快一點。沒有中文語音的裝置（例如部分 App 內建瀏覽器）就只有尖叫聲
const Voice={ok:'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window,v:null,warm:false,want:false,raw:null,buf:null,busy:false,src:null,
  // 錄音檔：先把檔案抓下來，等玩家第一次點畫面、聲音系統開起來之後再解碼。跟其他音效走同一條路，所以靜音、暫停都管得到，iOS 也不用另外解鎖
  load(){if(!VOICE_FILE)return;this.want=true;
    // 音檔直接寫在頁面裡的時候（試玩頁）自己解開，不經過網路請求：有些環境會擋掉對 data: 的請求
    if(VOICE_FILE.slice(0,5)==='data:'){try{const b=atob(VOICE_FILE.slice(VOICE_FILE.indexOf(',')+1)),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);this.raw=u.buffer;this.decode();}catch(e){}return;}
    if(!window.fetch)return;fetch(VOICE_FILE).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>{this.raw=b;this.decode();}).catch(()=>{this.want=false;});},
  decode(){if(!this.raw||this.buf||this.busy||!Snd.ctx)return;this.busy=true;const done=b=>{this.buf=b;this.raw=null;},fail=()=>{this.raw=null;this.want=false;};
    try{const p=Snd.ctx.decodeAudioData(this.raw.slice(0),done,fail);if(p&&p.catch)p.catch(()=>{});}catch(e){fail();}},
  pick(){if(!this.ok)return;let vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}const L=v=>(v.lang||'').replace('_','-').toLowerCase();
    this.v=vs.find(v=>L(v)==='zh-tw')||vs.find(v=>L(v).startsWith('zh-tw'))||vs.find(v=>/^(zh-cn|zh-hans|zh-hant|cmn|zh$)/.test(L(v)))||null;},
  // iOS 的內建語音要先在點擊的當下講過一次（這裡講一句聽不到的），之後才能在別的時間點出聲
  unlock(){this.stop();this.decode();if(this.want||!this.ok||this.warm)return;this.warm=true;try{this.pick();const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}},
  // 有錄音檔就放錄音檔，沒有（或還沒載好）就用內建語音唸
  say(text){if(!Snd.on)return;
    if(this.buf&&Snd.ctx){if(this.src){try{this.src.stop();}catch(e){}this.src=null;}try{const c=Snd.ctx,n=c.createBufferSource(),g=c.createGain();n.buffer=this.buf;g.gain.value=VOICE_GAIN;n.connect(g);g.connect(Snd.master);n.start();this.src=n;}catch(e){}return;}

  stop(){if(this.src){try{this.src.stop();}catch(e){}this.src=null;}if(this.ok)try{speechSynthesis.cancel();}catch(e){}}};
Voice.load();

// 排一條馬路：一段一段的車道，段跟段之間有分隔島可以站。難度 lv 看「第幾天」和「今天第幾條」：越高段越多、車越快越密，更高才有連三線
// （手機上只看得到車子開到前一秒多，連三線又不能連踩，所以前面最多連兩線）。今天的最後一條，對面就是家
function genStreet(){
  const k=++gen,lv=k*.7+(day-1),D=Math.min(1,(lv-1)/16),flipG=Math.random()<.5,busy=has('rush')?.78:1;
  const G=lv<=2?[2]:lv<=5?(flipG?[1,2]:[2,1]):lv<=9?[2,2]:lv<=14?(flipG?[2,3]:[3,2]):[3,3],n=G.reduce((a,c)=>a+c,0);let lastPud=false,i=0;
  G.forEach((m,g)=>{
    if(g)rows.push({t:'median',street:k,veh:[]});
    for(let j=0;j<m;j++,i++){
      const dir=G.length>1?(g?-1:1):(j?-1:1),edge=i===0||i===n-1,sp=(edge?96:80)+rnd(0,24)+Math.min(lv,22)*4.2+(edge?10:0);
      const pud=has('rain')?Math.random()<.6:(k>=2&&!lastPud&&Math.random()<.17);lastPud=pud;
      const row={t:'lane',street:k,dir,sp,edge,t0:lerp(1.3,.86,D)*busy,t1:lerp(2.8,1.75,D)*busy,pud,pudC:(Math.random()*3|0)-1,coins:[],veh:[],gap:0,first:j===0,flip:G.length===1&&j===1};
      if(Math.random()<.62){let c=pick([-1,-1,0,1,1]);if(pud&&c===row.pudC)c=c?-c:1;row.coins.push({c,v:lv>=3&&Math.random()<.08?50:Math.random()<.3?10:5,got:false});}
      if(k>=2&&Math.random()<.12){const used=row.coins.map(q=>q.c).concat(pud?[row.pudC]:[]),free=[-1,0,1].filter(c=>!used.includes(c));if(free.length)row.items=[{c:pick(free),t:pick(has('dog')?['green','bone','lid']:['green','lid']),got:false}];}
      for(let x=-170;x<540;){const v=mkVeh(row);x+=v.len/2;v.x=dir>0?x:360-x;row.veh.push(v);x+=v.len/2+row.sp*rnd(row.t0,row.t1);}
      row.veh=row.veh.filter(v=>Math.abs(v.x-CX)>130||k>1);row.gap=row.sp*rnd(.2,row.t1);rows.push(row);}});
  rows.push({t:'walk',street:k,goal:true,home:k===goalN,veh:[]});rows.push({t:'walk',street:k,veh:[]});
}
function mkVeh(row){const r=Math.random(),rush=has('rush'),k=row.edge?(r<(rush?.85:.72)?'scoot':r<.93?'car':'taxi'):(has('trash')&&r<.22?'trash':r<(rush?.5:.36)?'scoot':r<.66?'car':r<.78?'taxi':r<.91?'truck':'bus'),K=KIND[k];
  return{k,len:K.len,w:K.w,x:0,col:k==='scoot'?pick(SCOOT_COL):k==='taxi'?'#ffc94a':k==='truck'?'#5c7fb8':k==='trash'?'#f2c230':k==='bus'?'#3fae8f':pick(CAR_COL),honk:false,hel:pick(['#e4572e','#fff8ea','#3a3d52','#ffc94a','#5c7fb8'])};}

// 女學生。back=true 背對鏡頭往前走；false 轉過來面對鏡頭（掉了、大叫）。o：hair 髮型、step 走路的相位、laugh 笑、bag 袋子角度（沒拿就 null）

  c.fillStyle='#3a4a7a';c.beginPath();c.moveTo(-12,-26);c.lineTo(12,-26);c.lineTo(15,-11);c.lineTo(-15,-11);c.closePath();c.fill();c.stroke();   // 百褶裙
  c.lineWidth=1.4;c.strokeStyle='rgba(255,255,255,.3)';c.beginPath();for(const q of[-7,0,7]){c.moveTo(q*.8,-25);c.lineTo(q,-12);}c.stroke();c.strokeStyle=INK;c.lineWidth=2.6;

    hole(px,rowY(pRow)-12,112,1);

// 往前（dr=1）或往後（dr=-1）走一步。還在走的時候再下指令，會記住、落地後接著走
function move(dr){
  if(mode!=='play'||paused)return;if(stepT>0){buf=dr;return;}
  const nr=pr+dr;if(nr<minR){Snd.blip(170,130,.06,'square',.035);return;}
  if(rows[pr].t==='lane'){nm.r=pr;nm.x=px;nm.t=NEAR_T;}
  // 連過：一步接一步（間隔不到 0.9 秒）連續走過兩線以上，每多一線多拿零錢。停下來等或往後退就歸零
  if(dr>0){if(time-lastStepAt>=.9)flow=0;else if(rows[pr].t==='lane'&&++flow>=2){const n=Math.min(flow,5);gain(n,px,rowY(pr)-58,`連過 ${flow} 線 +${n}`);}lastStepAt=time;}else flow=0;

  {const a0=Math.hypot(th,om/W0);om+=dr*STEP_J;const a1=Math.hypot(th,om/W0);
    if(dr>0&&a0>.25&&a1<a0-.12){steady++;th*=.6;om*=.6;const n=steady>=4?2:1;money+=n;earned+=n;pop(px+26,rowY(from)-76,steady>1?`穩！×${steady}`:'穩！','#8fe0a8');const f=520+Math.min(steady,8)*70;Snd.blip(f,f*1.5,.08,'triangle',.09);}
    else{if(dr>0&&a0>.25&&a1>a0+.05)steady=0;Snd.blip(260,330,.05,'sine',.07);}}
}

function tick(dt){
  time+=dt;shake=Math.max(0,shake-dt*26);flash=Math.max(0,flash-dt*3);

  for(let i=splash.length-1;i>=0;i--){const s=splash[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=420*dt;if((s.life-=dt)<=0)splash.splice(i,1);}
  if(mode==='over')return;
  // 車流：每條車道各開各的，前一台開遠了就再來一台
  const lo=Math.max(0,Math.floor(camR)-4),hi=Math.min(rows.length-1,Math.floor(camR)+13);
  for(let r=lo;r<=hi;r++){const row=rows[r];if(row.t!=='lane'||greenT>0||(mode==='drop'&&(r===pr||r===from)))continue;const d=row.dir*row.sp*dt;
    for(let i=row.veh.length-1;i>=0;i--){const v=row.veh[i];v.x+=d;if((v.x-CX)*row.dir>400)row.veh.splice(i,1);}   // 開出畫面夠遠才拿掉（只看開走的那一邊，剛從另一邊進來的不算）
    if((row.gap-=row.sp*dt)<=0){const v=mkVeh(row);v.x=row.dir>0?-200-v.len/2:560+v.len/2;row.veh.push(v);row.gap=v.len+row.sp*rnd(row.t0,row.t1);}}
  camR+=((stepT>0?from+(1-stepT/STEP_T):pr)-camR)*Math.min(1,dt*10);
  // 朋友貼在左後方，慢半拍跟上
  {const k=Math.min(1,dt*13),tr=stepT>0?from+(pr-from)*(1-stepT/STEP_T):pr;fx+=(px-30-fx)*k;fr+=(tr-fr)*k;}
  if(mode==='drop'){dropT+=dt;if(dropT>.55&&dropT-dt<=.55){pop(CX,270,'我的豆花！30塊！',SUN,true,{huge:true,life:1.4,dur:1.4,rot:-.05});if(!voiced)Voice.say('我的豆花！三十塊！');}
    if(rescue&&dropT>1.75){revive();return;}if(dropT>2.1)gameOver();return;}
  if(mode==='win'){winT+=dt;if(winT>1.8)showCard(true);return;}
  if(mode!=='play')return;
  if(stepT>0&&(stepT-=dt)<=0){stepT=0;land();}
  // 颱風天：隔幾秒一陣風，先預告再吹
  if(has('wind')){windT-=dt;if(windT<.9&&!windWarn){windWarn=true;pop(CX,205,'風來了！',PAPER,true);Snd.wind();}
    if(windT<=0){shock(2.7*(1-.25*U('bag')),'wind');windT=rnd(4.5,8);windWarn=false;windFx=.7;}}
  if(windFx>0)windFx-=dt;
  if(greenT>0&&(greenT-=dt)<=0){greenT=0;pop(CX,205,'綠燈結束',PAPER);}
  // 垃圾車：畫面上有垃圾車的時候放音樂
  if(has('trash')&&(eliseT-=dt)<=0){eliseT=3.4;let near=false;for(let r=Math.max(0,pr-3);r<=pr+7&&r<rows.length;r++)for(const v of rows[r].veh)if(v.k==='trash'&&Math.abs(v.x-CX)<230)near=true;if(near)Snd.elise();}
  // 野狗：永遠貼在後面兩三步。站著不動牠就靠過來，往前走才拉得開；越後面的天數牠越快。剛吃到掉在地上的豆花時會停一下
  if(dog.on){const tr=stepT>0?from+(pr-from)*(1-stepT/STEP_T):pr;if(tr-dog.r>DOG_GAP)dog.r=tr-DOG_GAP;

    if(gap<1.9&&(dog.bark-=dt)<=0){dog.bark=.28+gap*.3;pop(dog.x,rowY(dog.r)-40,gap<1?'汪！汪！':'汪！',ALERT);Snd.bark();}
    if(gap<.3){dog.r=tr-1;return drop('被野狗撲上來，豆花飛了');}}

  {const d=clamp(tx-px,-LAT_V*dt,LAT_V*dt);if(d){px+=d;om+=d*LAT_J;}}

  if(Math.abs(th)>lim&&shield>0){shield=0;th=om=0;pop(px,rowY(pr)-84,'蓋子擋住了！',SUN,true);Snd.blip(600,900,.12,'triangle',.1);}
  if(Math.abs(th)>lim)return drop(lastShock==='wind'?'被颱風吹到，整袋甩出去':lastShock==='honk'?'被喇叭嚇到，手一抖就掉了':lastShock==='puddle'?'踩到水窪滑了一下':'走太急，晃到掉出來');
  // 現在踏出去會不會把袋子帶穩？會的話量表和袋子變綠，並輕輕響一聲
  {const a0=Math.hypot(th,om/W0),c=stepT<=0&&a0>.25&&Math.hypot(th,(om+STEP_J)/W0)<a0-.12;if(c&&!cueOn)Snd.blip(1250,1250,.03,'sine',.03);cueOn=c;}
  // 被撞、被叭：只看她現在站的那一列
  const cur=stepT>STEP_T*.55?from:pr,row=rows[cur],x=px;
  // 站定的時候：碰到零錢就撿，踩進水窪就滑一下
  if(stepT<=0){for(const c of row.coins||[])if(!c.got&&Math.abs(x-PX(c.c))<22){c.got=true;gain(c.v,PX(c.c),rowY(cur)-64);}
    for(const q of row.items||[])if(!q.got&&Math.abs(x-PX(q.c))<22){q.got=true;pickup(q.t,PX(q.c),rowY(cur)-70);}
    const on=!!row.pud&&Math.abs(x-PX(row.pudC))<24;
    if(on&&!inPud){shock(PUD_J*(1-.35*U('shoe')),'puddle');pop(x,rowY(cur)-70,'滑！',PAPER);Snd.splat();for(let i=0;i<8;i++)splash.push({x:x+rnd(-16,16),y:rowY(cur)+6,vx:rnd(-90,90),vy:rnd(-140,-50),r:rnd(2,4),col:'#8fdcf7',life:rnd(.3,.55)});}

  // 站在安全的地方發呆太久，朋友會催
  if(row.t!=='lane'&&(idle+=dt)>4.5){idle=-4;friendSay(pick(['快啦','走啊','豆花要涼了啦','你在等綠燈喔','我腳好痠']));}
  if(row.t==='lane')for(const v of row.veh){const dx=(x-v.x)*row.dir,half=v.len/2;   // dx>0：車還沒到她這裡
    if(Math.abs(v.x-x)<half+10)return drop(`被${KIND[v.k].n}撞到`);

}

}
const H=1/120;let acc=0,last=0,hold=false;
function setPaused(p){if(p&&(paused||mode!=='play'))return;if(!p&&!paused)return;paused=p;$('pause').hidden=!p;last=0;acc=0;if(Snd.ctx){try{p?Snd.ctx.suspend():Snd.ctx.resume();}catch(e){}}if(p)$('resume').focus({preventScroll:true});}
function frame(now){
  const dt=Math.min(.05,(now-(last||now))/1000);last=now;
  if(!paused&&!hold){acc+=dt;let n=0;while(acc>=H&&n++<10){tick(H);acc-=H;}if(n>=10)acc=0;hud();}
  render();requestAnimationFrame(frame);

/* ───────── 輸入 ─────────
   點一下：往前走一步。往左、往右滑：橫著走一格。往上滑：往前一步；往下滑：退一步。
   一次觸控只算一個動作：滑得再遠也只走一格，要再走就放開再滑一次。
   一隻手指還按著的時候，另一隻手指點一下也是往前走 */
let tp=null;const SLOP=8,HSWIPE=14,VSWIPE=24;
gameEl.addEventListener('pointerdown',e=>{if(e.target.closest('button,a,.card'))return;e.preventDefault();Snd.init();
  if(tp&&e.pointerId!==tp.id){move(1);return;}
  tp={id:e.pointerId,ox:e.clientX,oy:e.clientY,moved:false,done:false};});
gameEl.addEventListener('pointermove',e=>{if(!tp||e.pointerId!==tp.id||tp.done)return;const dx=e.clientX-tp.ox,dy=e.clientY-tp.oy;
  if(!tp.moved){if(Math.hypot(dx,dy)<SLOP)return;tp.moved=true;}
  if(Math.abs(dx)>=HSWIPE&&Math.abs(dx)>=Math.abs(dy)){tp.done=true;side(dx>0?1:-1);}
  else if(Math.abs(dy)>=VSWIPE&&Math.abs(dy)>Math.abs(dx)){tp.done=true;move(dy<0?1:-1);}});
const tpEnd=e=>{if(!tp||e.pointerId!==tp.id)return;if(!tp.moved&&e.type==='pointerup')move(1);tp=null;};
gameEl.addEventListener('pointerup',tpEnd);gameEl.addEventListener('pointercancel',tpEnd);
// App 內建瀏覽器（脆、IG、LINE）會把滑動當成「關掉這一頁」或「上一頁」，所以遊戲畫面上的觸控一律不交給瀏覽器
for(const t of['touchstart','touchmove'])gameEl.addEventListener(t,e=>{if(e.cancelable&&!(e.target.closest&&e.target.closest('button,a,.card')))e.preventDefault();},{passive:false});
gameEl.addEventListener('contextmenu',e=>e.preventDefault());

document.addEventListener('touchend',e=>{const now=Date.now(),btn=e.target&&e.target.closest&&e.target.closest('button,a');if(now-lastTouchEnd<=350&&!btn&&e.cancelable)e.preventDefault();lastTouchEnd=now;},{passive:false});
for(const t of['gesturestart','gesturechange','gestureend'])document.addEventListener(t,e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden)setPaused(true);});
window.addEventListener('blur',()=>setPaused(true));
window.addEventListener('pagehide',()=>setPaused(true));
window.addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(!e.repeat)setPaused(!paused);return;}
  const K={Space:1,Enter:1,ArrowUp:1,KeyW:1,ArrowDown:-1,KeyS:-1}[e.code],X={ArrowLeft:-1,KeyA:-1,ArrowRight:1,KeyD:1}[e.code];
  if(paused||(!K&&!X)||e.repeat)return;if(e.target.closest&&e.target.closest('button,a'))return;e.preventDefault();Snd.init();
  if(mode==='play'){if(K)move(K);else side(X);}else if((mode==='title'||mode==='over')&&K===1)start();});
$('start').addEventListener('click',start);
$('again').addEventListener('click',start);
$('pauseBtn').addEventListener('click',()=>setPaused(true));
$('resume').addEventListener('click',()=>setPaused(false));
el.mute.addEventListener('click',()=>{Snd.init();Snd.setOn(!Snd.on);if(!Snd.on)Voice.stop();muteIcon();});
$('share').addEventListener('click',async()=>{
  const link=document.querySelector('link[rel=canonical]'),out=$('copied');
  const text=(lastWon?`我提著豆花走到家了！「我的豆花30塊」第 ${cardDay} 天過關。`:`我的豆花，30塊！撐到第 ${cardDay} 天，走了 ${streets}/${goalN} 條馬路就掉了（${cause}）。`)+'你能撐到第幾天？'+(link?' '+link.href:'');
  try{await navigator.clipboard.writeText(text);out.textContent='已複製，貼到脆上炫耀吧';}
  catch(e){out.textContent=text;const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);}
});
$('shop').addEventListener('click',e=>{const b=e.target.closest('.up');if(!b||b.disabled)return;const u=UPG.find(x=>x.id===b.dataset.id),l=U(u.id),c=u.cost[l];if(l>=u.max||bank<c)return;
  bank-=c;ups[u.id]=l+1;store.set('dh.bank',String(bank));store.set('dh.up',JSON.stringify(ups));Snd.init();Snd.blip(700,1050,.1,'triangle',.09);renderShop();showBest();});
$('restart').addEventListener('click',()=>{day=1;bank=0;for(const k in ups)delete ups[k];store.set('dh.day','1');store.set('dh.bank','0');store.set('dh.up','{}');showBest();});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(gameEl);

reset();muteIcon();showBest();resize();requestAnimationFrame(frame);

  get voiceReady(){return !!Voice.buf},get voiceLoaded(){return !!(Voice.buf||Voice.raw)},get px(){return px},get tx(){return tx},get col(){return Math.round((px-CX)/COLW)},slide,get money(){return money},set money(v){money=v;},get spare(){return spare},set spare(v){spare=v;},get palX(){return fx},get palRow(){return fr},PX,
  get stars(){return stars},get flow(){return flow},get steady(){return steady},get cue(){return cueOn},get greenT(){return greenT},get shield(){return shield},set shield(v){shield=v;},get dogEat(){return dog.eat},pickup,side,step,move,start,tick,set hold(v){hold=v;},set pr(v){pr=from=v;camR=v;need(v);}};
