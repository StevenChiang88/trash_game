  /* 與發佈環境相同的最小底座：上下避開瀏海與手勢列 */

<title>絕命電師</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* 版面：一條往遠方縮小的三線道。Chu克裹著太空毯在畫面下方往前跑，帶電的東西從遠處靠近；上方是距離、報紙數和他還撐得住幾次 */
:root{
  --ink:#2b2a3a;        /* 描邊與文字 */
  --paper:#fff8ea;      /* 卡片、報紙的紙白 */
  --lamp:#ffb84a;       /* 煤油燈的暖黃：主色 */
  --lamp-deep:#c97a1c;
  --volt:#35c8f5;       /* 電的顏色：只用在「有電」上 */
  --alert:#ee5b3a;      /* 被電到 */
  --ok:#2f9a7c;
  --dusk:#f3d9a4;       /* 傍晚的天色 */
  --backdrop:#1c1b29;   /* 電腦版：手機畫面外的底色 */
  --display:"Fredoka","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --sticker:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 -2.5px 0 var(--ink),0 2.5px 0 var(--ink),-2.5px 0 0 var(--ink),2.5px 0 0 var(--ink);
}
html,body{height:100%;touch-action:manipulation}
button{touch-action:manipulation}
body{background:var(--dusk);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none;display:grid;place-items:center}
#game{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:8px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.left{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.count{display:flex;align-items:baseline;gap:5px;font-family:var(--display);color:var(--paper);text-shadow:var(--sticker);line-height:1}
.count small{font-family:var(--body);font-weight:900;font-size:15px}
.count b{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:flex;align-items:center;gap:6px;padding:3px 11px 3px 8px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.pill svg{width:22px;height:18px;display:block}
.side{display:flex;align-items:center;gap:8px}
.bolts{display:flex;gap:3px;padding:7px 10px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper)}
/* 剩幾條命：紅心是還剩的，被電到一次就空一顆 */
.bolts svg{width:22px;height:20px;display:block;fill:var(--paper);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;opacity:.45}
.bolts svg.on{fill:var(--alert);opacity:1}
.icon-btn{pointer-events:auto;width:40px;height:40px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);cursor:pointer;padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn:focus-visible,.btn:focus-visible{outline:3px solid var(--volt);outline-offset:3px}
.gap{flex:1}
.hint{align-self:center;margin-top:8px;text-align:center;font-weight:900;font-size:22px;color:var(--paper);text-shadow:var(--sticker);min-height:1.5em;text-wrap:balance}
.btn{pointer-events:auto;font:inherit;font-weight:900;font-size:20px;color:var(--ink);background:var(--lamp);border:3px solid var(--ink);border-radius:16px;padding:12px 30px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);font-size:16px;padding:10px 20px}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:28px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
#title{background:linear-gradient(rgba(28,27,41,.5),rgba(28,27,41,.05) 38%,rgba(28,27,41,.05) 62%,rgba(28,27,41,.55))}
.logo{margin:5vh 0 0;font-weight:900;font-size:clamp(50px,16vw,80px);line-height:1;letter-spacing:.02em;color:var(--paper);text-shadow:var(--sticker),0 7px 0 var(--ink);transform:rotate(-3deg)}
.logo span{display:inline-block;color:var(--volt)}
.tag{margin:6px 0 0;font-weight:900;font-size:17px;color:var(--paper);text-shadow:var(--sticker);text-wrap:balance}
.how{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0;padding:0;list-style:none;font-size:14px}
.how li{padding:6px 12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.how b{font-weight:900;color:var(--lamp-deep)}
.best{font-weight:900;font-size:14px;color:var(--paper);text-shadow:var(--sticker);min-height:1.4em}
.home{pointer-events:auto;font-weight:900;font-size:14px;color:var(--paper);text-shadow:var(--sticker);text-underline-offset:4px}

#over,#pause{justify-content:center;background:rgba(28,27,41,.5)}
.card{width:min(330px,100%);display:flex;flex-direction:column;gap:14px;padding:18px;border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--ink);text-align:left;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateY(30px) scale(.94);opacity:0}}
.verdict{margin:0;font-weight:900;font-size:30px;line-height:1.25}
.verdict .n{font-family:var(--display);font-weight:700;color:var(--alert)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:0}
.stats dt{font-size:12px;opacity:.65}
.stats dd{margin:0;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.stats .wide{grid-column:1/-1}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.copied{font-size:13px;font-weight:900;color:var(--ok);min-height:1.3em;user-select:text;-webkit-user-select:text}
.note{margin:0;font-size:14px;opacity:.75}
@media (min-aspect-ratio:10/16){body{background:var(--backdrop)}#game{height:min(100% - 32px,900px);border-radius:26px;box-shadow:0 0 0 3px var(--ink),0 18px 50px rgba(0,0,0,.45)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c" aria-label="Chu克披著太空毯在街上跑，前方有各種帶電的東西"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="top">
      <div class="left">
        <div class="count"><b id="num">0</b><small>公尺</small></div>
        <div class="pill" aria-label="撿到的報紙"><svg viewBox="0 0 22 18" aria-hidden="true"><rect x="1.2" y="1.2" width="19.6" height="15.6" fill="#f4efe2" stroke="#2b2a3a" stroke-width="2"/><rect x="4" y="4" width="14" height="3.4" fill="#2b2a3a"/><rect x="4" y="9.4" width="6.5" height="1.4" fill="#2b2a3a"/><rect x="4" y="12.2" width="6.5" height="1.4" fill="#2b2a3a"/><rect x="12" y="9.2" width="6" height="4.6" fill="#8a8f9c"/></svg><span id="papers">0</span></div>
      </div>
      <div class="side">
        <div class="bolts" id="bolts" aria-label="Chu克還能被電幾次"></div>
        <button class="icon-btn" id="pauseBtn" type="button" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.6"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.6"/></svg></button>
        <button class="icon-btn" id="mute" type="button" aria-label="聲音開關"></button>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="screen" id="title">
    <h1 class="logo">絕命<span>電</span>師</h1>
    <p class="tag">Chu克對電過敏，卻得上街拿報紙。<br>閃開路上所有帶電的東西。</p>
    <div class="gap"></div>
    <ul class="how">
      <li><b>左右滑</b> 換線</li>
      <li><b>上滑</b> 跳</li>
      <li><b>下滑</b> 蹲</li>
      <li><b>撿報紙</b> 冷靜一下</li>
    </ul>
    <button class="btn" id="start" type="button">出門</button>
    <div class="best" id="best"></div>
    <a class="home" href="../">其他遊戲</a>
  </div>

  <div class="screen" id="over" hidden>
    <div class="card">
      <p class="verdict">Chu克發作了。<br>跑了 <span class="n" id="ovN">0</span> 公尺。</p>
      <dl class="stats">
        <div><dt>最佳紀錄</dt><dd id="ovBest">0 公尺</dd></div>
        <div><dt>撿到的報紙</dt><dd id="ovPaper">0 份</dd></div>
        <div class="wide"><dt>封號</dt><dd id="ovRank"></dd></div>
        <div class="wide"><dt>最後電到他的</dt><dd id="ovMiss"></dd></div>
      </dl>
      <div class="acts">
        <button class="btn" id="again" type="button">再跑一次</button>
        <button class="btn ghost" id="share" type="button">複製戰績</button>
      </div>
      <div class="copied" id="copied"></div>
    </div>
  </div>

  <div class="screen" id="pause" hidden>
    <div class="card">
      <p class="verdict">暫停中</p>
      <p class="note">離開畫面會自動暫停，按「繼續」再接著跑。</p>
      <div class="acts"><button class="btn" id="resume" type="button">繼續</button></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[(Math.random()*a.length)|0];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=id=>document.getElementById(id);
const INK='#2b2a3a',PAPER='#fff8ea',VOLT='#35c8f5',FOIL='#cfd6de',FOIL_L='#e9eef2',FOIL_D='#a9b3bf',LAMP='#ffb84a';
const FONT='"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif';
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const hash=(i,k)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);};
const rgb=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];};
const mix=(a,b,t)=>{const A=rgb(a),B=rgb(b);return`rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;};

/* ───────── 世界：三條線、往遠方縮小的馬路 ─────────
   x 是第幾條線（-1 左、0 中、1 右），z 是離 Chu克多遠（往前為正），y 是離地高度；1 單位大約一公尺，在 Chu克腳邊畫成 100px */
const VW=360,VH=640,CX=180,HOR=176,GY=572,F=11,U=100,CHU=.82,SPAWN_Z=62,Z_NEAR=-2.6;
const V0=10.5,JUMP_V=6.6,GRAV=22,SLIDE_T=.62,LANE_V=9.5,PAIN_MAX=3,PAPER_HEAL=100,DARK_T=6;
const S=z=>F/(F+z);
/* 路上的東西。kind：full 只能換線閃開、low 要跳、high 要蹲；w=3 表示橫跨三條線 */
const OB={
  box:{kind:'full',n:'變電箱',gy:.62},claw:{kind:'full',n:'夾娃娃機',gy:1},charger:{kind:'full',n:'充電樁',gy:1.2},ped:{kind:'full',n:'路人的手機',gy:.7},
  robo:{kind:'low',n:'掃地機器人',gy:.18},strip:{kind:'low',w:3,n:'延長線',gy:.15},
  sign:{kind:'high',n:'跑馬燈',gy:1.22},lights:{kind:'high',w:3,n:'燈串',gy:1.1},
};
const FULLS=['box','box','ped','ped','claw','charger'];

/* ───────── 路人：造型沿用，但都不具名 ───────── */
const CAST=[
  {id:'bro',  hi:['哥，我買了菜來','哥，我身上真的沒東西'],skin:'#f1c9a5',hair:'#7a4a2e',style:'slick',wear:'suit',top:'#d9a53a',tie:'#e86aa0',loud:1,legs:'#7a5a2a',face:'smirk',likes:['battery','news'],trait:'sly'},
  {id:'lawyer',hi:['我有事想跟你談談','文件我放這裡就走'],skin:'#f4d2b0',hair:'#f2dc8e',style:'pony',wear:'suit',top:'#5f6f96',tie:null,legs:'#4a5676',face:'neutral',likes:['pen'],trait:'tidy'},
  {id:'partner',hi:['事務所的事想跟你聊聊','我只待五分鐘'],skin:'#e0a878',hair:'#f0d27a',style:'swoop',wear:'suit',top:'#2f4a8a',tie:'#8fc4f0',stripes:1,legs:'#263c70',face:'grin',likes:['laptop','phone'],trait:'busy'},
  {id:'helper',hi:['我幫你買東西來了','冰塊和報紙都在這'],skin:'#d9a57c',hair:'#2b2a3a',style:'short',wear:'polo',top:'#6fbf8e',legs:'#4a4f66',face:'smile',likes:['news','apple'],trait:''},
  {id:'ex',   hi:['好久不見','你家怎麼這麼暗？'],skin:'#f4d2b0',hair:'#5a2f24',style:'long',wear:'dress',top:'#a84a5a',legs:'#3a3d52',face:'smile',likes:['violin','phone'],trait:'purse'},
  {id:'fixer',hi:['修門的','門壞了是吧，我看看'],skin:'#e8c4a4',hair:'#9aa0a8',style:'bald',wear:'work',top:'#6f7f96',legs:'#4a5266',face:'stern',likes:['drill','camera','hammer'],trait:'toolbox'},
  {id:'doctor',hi:['我來看看你的狀況','放輕鬆，只是例行檢查'],skin:'#e8b88f',hair:'#2b2a3a',style:'bun',wear:'coat',top:'#fff8ea',legs:'#5c7fb8',face:'neutral',likes:['steth','torch'],trait:'sneak'},
  {id:'pi',   hi:['我是你請來的','報告我帶來了'],skin:'#f1c9a5',hair:'#3a3d52',style:'fedora',wear:'trench',top:'#c9a878',legs:'#4a4038',face:'stern',shades:1,likes:['camera','recorder','binoc'],trait:''},
];
const EXTRAS=[
  {id:'neighbor',hi:['我來借個醬油','我看你燈又沒開'],skin:'#f1c9a5',hair:'#5a4636',style:'bun',wear:'plain',top:'#e58f8f',legs:'#4a4f66',face:'smile',likes:[],trait:''},
  {id:'courier', hi:['外送～麻煩簽收','您的包裹'],        skin:'#e8b88f',hair:'#2b2a3a',style:'helmet',wear:'box',top:'#f0a13c',legs:'#4a4f66',face:'neutral',likes:['phone'],trait:''},
  {id:'kid',     hi:['叔叔，我的球掉進你家了','可以借廁所嗎'],skin:'#f4d2b0',hair:'#6b4a2a',style:'cap',wear:'plain',top:'#6fb8d8',legs:'#4a4f66',face:'smile',likes:[],trait:''},
];
const PEDS=CAST.concat(EXTRAS);
const YELL={bro:['哥！外面很多電耶！','哥！報紙我買好了！'],lawyer:['你…還好嗎？','要不要我陪你走？'],partner:['早安！事務所見！','嘿！氣色不錯！'],helper:['報紙我會送啊！','先生你要去哪？'],
  ex:['…你披著什麼？','你家燈怎麼都不開？'],fixer:['…','門我修好了。'],doctor:['這是心理作用！','回來！我們談談！'],pi:['照片拍到了。','報告在這。'],
  neighbor:['又是你偷我報紙！','那是我的報紙！'],courier:['外送～借過～','先生簽收一下！'],kid:['媽媽，有鋁箔人！','叔叔你是太空人嗎？']};
const MAN_ZAP=['啊啊啊——','我的皮膚在燒！','關掉！快關掉！'],MAN_NEAR=['我感覺到了…','好近…','嗡嗡嗡的…'],MAN_MILE=['報紙…報紙在哪…','我沒有病。','這不是心理作用。','再撐一下。','法律是神聖的。'];

/* ───────── 聲音 ───────── */
const Snd={ctx:null,on:store.get('ds.mute')!=='1',
  init(){if(this.ctx){if(this.ctx.state==='suspended'&&!paused)this.ctx.resume();return;}
    try{const C=window.AudioContext||window.webkitAudioContext,c=this.ctx=new C();this.master=c.createGain();this.master.gain.value=this.on?1:0;this.master.connect(c.destination);
      const buf=c.createBuffer(1,c.sampleRate,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.noise=buf;}catch(e){this.ctx=null;}},
  blip(f0,f1,dur,type,vol,delay){if(!this.ctx)return;const c=this.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.1,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+.03);},

    c.strokeStyle='rgba(255,248,234,.8)';c.lineWidth=3;for(const q of[-1,1]){c.beginPath();c.moveTo(q*70,-6);c.lineTo(q*(84+Math.sin(time*30)*5),-10);c.stroke();}

  const sw=Math.sin(run)*4,hx=60+L(-84),hyy=-82+sw;

// 對話框：up=true 時框在下、尖角朝上（Chu克的話放在他腳下，才不會擋住前面的路）
function bubble(c,text,x,y,al,up){
  c.font='900 14px '+FONT;const w=c.measureText(text).width+20,bx=clamp(x-w/2,wx0+6,Math.max(wx0+6,wx1-6-w)),tx=clamp(x,bx+14,bx+w-14),by=up?y:y-28,d=up?-1:1,ty=up?y+1:y-1;

// 越跑越快：前面加得快（500 公尺 17、1 公里 20、2 公里 23），2.5 公里後再慢慢加到 31
const vAt=d=>V0+14*(1-Math.exp(-d/800))+clamp((d-2500)/700,0,7);
const nightK=()=>{const ph=(dist/2400)%1;return smooth(.24,.44,ph)-smooth(.8,.98,ph);};
const obX=o=>o.amp?clamp(o.x+Math.sin(time*1.5+o.ph)*o.amp,-1,1):o.x;
function render(){
  const W=cv.width,H=cv.height,k=dpr*scale;let sx=0,sy=0;if(shake>0&&!reduced){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;}

  // 天空、遠方的樓
  let gr=g.createLinearGradient(0,T,0,HOR);gr.addColorStop(0,mix('#f2b877','#636174',nk));gr.addColorStop(.7,mix('#f9dca8','#c9a0b4',nk));gr.addColorStop(1,mix('#fdeccb','#ffc6c4',nk));g.fillStyle=gr;g.fillRect(L,T,R-L,HOR-T+2);
  if(nk<1){g.globalAlpha=1-nk;g.fillStyle='#fff3cf';g.beginPath();g.arc(266,146,30,0,TAU);g.fill();g.globalAlpha=1;}
  g.fillStyle=mix('#e6bd90','#b9a6c4',nk);for(let i=Math.floor(L/26)-1;i*26<R;i++){const h=12+hash(i,3)*46;g.fillRect(i*26,HOR-h,27,h+2);}
  // 地面：人行道、馬路、分隔線
  g.fillStyle='#d6c2a2';g.fillRect(L,HOR,R-L,B-HOR);
  const sb=(B-HOR)/(GY-HOR),edge=(xa,xb)=>{g.beginPath();g.moveTo(CX,HOR);g.lineTo(CX+xa*U*sb,B);g.lineTo(CX+xb*U*sb,B);g.closePath();g.fill();};
  g.fillStyle='#8d8a96';edge(-1.5,1.5);g.fillStyle='#f1e6cf';edge(1.5,1.66);edge(-1.66,-1.5);
  const quad=(xa,xb,z0,z1)=>{const s0=S(z0),s1=S(z1),y0=HOR+(GY-HOR)*s0,y1=HOR+(GY-HOR)*s1;g.beginPath();g.moveTo(CX+xa*U*s0,y0);g.lineTo(CX+xb*U*s0,y0);g.lineTo(CX+xb*U*s1,y1);g.lineTo(CX+xa*U*s1,y1);g.closePath();g.fill();};
  g.fillStyle='rgba(255,248,234,.85)';for(let i=Math.floor((dist+Z_NEAR-2)/4);i*4-dist<70;i++){const z0=Math.max(Z_NEAR,i*4-dist),z1=i*4+1.8-dist;if(z1<=z0)continue;quad(-.535,-.465,z0,z1);quad(.465,.535,z0,z1);}
  g.fillStyle='rgba(43,42,58,.1)';for(let i=Math.floor((dist+Z_NEAR)/2.2)+1;i*2.2-dist<46;i++){const z0=i*2.2-dist;quad(1.66,7,z0,z0+.07);quad(-7,-1.66,z0,z0+.07);}
  gr=g.createLinearGradient(0,HOR,0,HOR+64);const hz=mix('#fdeccb','#ffc6c4',nk).slice(4,-1);gr.addColorStop(0,`rgba(${hz},.92)`);gr.addColorStop(1,`rgba(${hz},0)`);g.fillStyle=gr;g.fillRect(L,HOR,R-L,64);
  // 收集所有要畫的東西，由遠到近畫
  const dl=[],BSP=3.4,PSP=13;
  for(let i=Math.ceil((dist+Z_NEAR)/BSP);i*BSP-dist<64;i++){dl.push({z:i*BSP-dist+.01,k:0,i,sd:-1});dl.push({z:i*BSP-dist,k:0,i,sd:1});}
  for(let i=Math.ceil((dist+Z_NEAR-5)/PSP);i*PSP+5-dist<64;i++){dl.push({z:i*PSP+5-dist,k:1,i,sd:-1});dl.push({z:i*PSP+5-dist,k:1,i,sd:1});}
  for(const o of obs){const z=o.wz-dist;if(z>Z_NEAR&&z<SPAWN_Z+4)dl.push({z,k:2,o});}
  for(const it of items){const z=it.wz-dist;if(!it.got&&z>Z_NEAR&&z<SPAWN_Z+4)dl.push({z:z+.02,k:3,it});}
  const front=mode!=='play';dl.push({z:mode==='title'?5.5:front?-9:0,k:4});
  dl.sort((a,b)=>b.z-a.z);
  for(const d of dl){const s=S(d.k===4&&d.z<0?0:d.z),gx=CX,gy=HOR+(GY-HOR)*s;
    if(d.k===0){const sp=BLD[Math.floor(hash(d.i*2+(d.sd>0?1:0),7)*BLD.length)],x=gx+d.sd*3.92*U*s;if(x-1.7*U*s>R||x+1.7*U*s<L)continue;g.save();g.translate(x,gy);g.scale(s*d.sd,s);g.drawImage(sp,-170,-640,340,640);g.restore();}
    else if(d.k===1){const x=gx+d.sd*1.92*U*s;if(x>R+40||x<L-40)continue;
      const s2=S(d.z+PSP),x2=gx+d.sd*1.92*U*s2,y2=HOR+(GY-HOR)*s2;g.strokeStyle='rgba(43,42,58,.75)';g.lineCap='round';   // 電線：連到下一根電線桿
      for(const q of[-.22,.22]){g.lineWidth=Math.max(.6,1.8*s);g.beginPath();g.moveTo(x+q*U*s,gy-3.18*U*s);g.quadraticCurveTo((x+x2)/2+q*U*(s+s2)/2,(gy-3.02*U*s+y2-3.02*U*s2)/2,x2+q*U*s2,y2-3.18*U*s2);g.stroke();}
      g.save();g.translate(x,gy);g.scale(s,s);g.strokeStyle=INK;g.lineWidth=3;g.fillStyle='#7a6652';g.fillRect(-5,-340,10,340);g.strokeRect(-5,-340,10,340);g.fillRect(-32,-324,64,8);g.strokeRect(-32,-324,64,8);
      if(hash(d.i,11)<.5){g.fillStyle='#9aa0a8';rrect(g,d.sd*-30-11,-292,22,46,6);g.fill();g.stroke();}g.restore();}
    else if(d.k===2){const o=d.o,x=gx+obX(o)*U*s,al=dead?.42:1;g.save();g.translate(x,gy);g.scale(s,s);
      g.fillStyle='rgba(43,42,58,.2)';g.beginPath();g.ellipse(0,0,o.w===3?170:44,o.w===3?9:11,0,0,TAU);g.fill();
      g.globalAlpha=al;drawOb(g,o,dead,al);g.restore();
      if(!dead)for(const q of(o.w===3?[-1,0,1]:[0]))glows.push([x+q*U*s,gy-OB[o.t].gy*U*s,95*s,'rgba(53,200,245,1)',.16+.2*nk+.05*Math.sin(time*9+o.ph)]);}
    else if(d.k===3){const it=d.it;g.save();g.translate(gx+it.x*U*s,gy);g.scale(s,s);g.fillStyle='rgba(43,42,58,.16)';g.beginPath();g.ellipse(0,0,20,5,0,0,TAU);g.fill();g.translate(0,-it.y*U);drawItem(g,it);g.restore();
      if(it.t!=='paper')glows.push([gx+it.x*U*s,gy-it.y*U*s,80*s,it.t==='dark'?'rgba(53,200,245,1)':'rgba(255,196,96,1)',.35]);}
    else{   // Chu克
      const x=gx+px*U*s;g.save();g.translate(x,gy);g.scale(s,s);g.fillStyle='rgba(43,42,58,.24)';const sh=1-clamp(py,0,1)*.45;g.beginPath();g.ellipse(0,0,(front?58:44)*sh,(front?12:9.5)*sh,0,0,TAU);g.fill();
      if(mode==='title')drawManFront(g,0,-143,.6,false);
      else if(front)drawManFront(g,0,-100,.42,mode==='dying');
      else{g.translate(0,-py*U);g.scale(CHU,CHU);if(invuln>0&&Math.floor(time*14)%2)g.globalAlpha=.45;drawChu(g);}
      g.restore();glows.push([x+(front?34:53)*s,gy-(py*U+(front?62:48))*s,(dead?170:110)*s,'rgba(255,196,96,1)',dead?.6:.2+.3*nk]);}
  }
  // 入夜、停電：整個畫面壓暗，再把會發光的東西補亮
  if(nk>0){g.globalCompositeOperation='multiply';g.globalAlpha=nk;g.fillStyle='#5a5f9c';g.fillRect(L,T,R-L,B-T);g.globalCompositeOperation='source-over';g.globalAlpha=1;}
  if(dk>0){g.globalAlpha=.5*dk;g.fillStyle='#0d0c1c';g.fillRect(L,T,R-L,B-T);g.globalAlpha=1;}
  if(nk>0){g.globalAlpha=nk;g.fillStyle='#fffbe8';g.beginPath();g.arc(84,96,19,0,TAU);g.fill();for(let i=0;i<14;i++){g.beginPath();g.arc(hash(i,21)*VW,T+hash(i,22)*(HOR-70-T),1.2+hash(i,23),0,TAU);g.fill();}g.globalAlpha=1;}
  g.globalCompositeOperation='lighter';
  for(const q of glows){if(q[2]<3)continue;gr=g.createRadialGradient(q[0],q[1],0,q[0],q[1],q[2]);gr.addColorStop(0,q[3]);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=clamp(q[4],0,1);g.fillStyle=gr;g.fillRect(q[0]-q[2],q[1]-q[2],q[2]*2,q[2]*2);}
  g.globalCompositeOperation='source-over';g.globalAlpha=1;
  // 路人喊的話、Chu克的碎念
  for(const o of obs){if(o.sayT>0&&o.say){const z=o.wz-dist;if(z<Z_NEAR)continue;const s=S(z);bubble(g,o.say,CX+o.x*U*s,HOR+(GY-HOR)*s-1.95*U*s-8,clamp(o.sayT*4,0,1));}}
  if(manSayT>0&&mode==='play')bubble(g,manSay,CX+px*U,GY+26,clamp(manSayT*4,0,1),true);

}

let lastHint='',lastNum=-1,lastPap=-1,paused=false;
function setHint(t){if(t!==lastHint){lastHint=t;el.hint.textContent=t;}}
function drawBolts(){el.bolts.innerHTML='';for(let i=0;i<PAIN_MAX;i++)el.bolts.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 22 20" class="${i<PAIN_MAX-pain?'on':''}" aria-hidden="true"><path d="M11 18.2C4.6 13.6 1.6 10.3 1.6 6.6a4.7 4.7 0 0 1 9.4-1.3 4.7 4.7 0 0 1 9.4 1.3c0 3.7-3 7-9.400 11.600z"/></svg>`);}
function muteIcon(){el.mute.innerHTML=Snd.on
  ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>'
  :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  el.mute.setAttribute('aria-pressed',String(!Snd.on));}
function showBest(){el.best.textContent=best>0?`最佳紀錄　${best} 公尺`:'';}
function pop(x,y,text,col,big){pops.push({x,y,text,col,life:big?1:.75,dur:big?1:.75,big});}
function say(t,d){manSay=t;manSayT=d||1.5;}
function burst(x,y,n,col,v){for(let i=0;i<n;i++)sparks.push({x:x+rnd(-12,12),y:y+rnd(-12,12),vx:rnd(-v,v),vy:rnd(-v*1.3,v*.3),r:rnd(1.8,3.6),col,life:rnd(.3,.65)});}
const manXY=()=>[CX+px*U,GY-py*U-66];

function start(){
  Snd.init();Snd.blip(420,640,.14,'triangle',.1);paused=false;$('pause').hidden=true;
  dist=0;speed=V0;lane=0;px=0;py=0;vy=0;slide=0;wantSlide=false;jumpBuf=0;pain=0;invuln=0;shield=false;darkT=0;slow=0;papers=0;pStreak=0;nearT=0;lastMile=0;lastHit='';manSayT=0;
  obs.length=items.length=sparks.length=pops.length=0;shake=flash=0;rowN=0;lastWide=-9;tier=0;stepPh=0;nextWz=34;nextPow=260;tutor=runs<2;runs++;store.set('ds.runs',String(runs));
  mode='play';lastNum=lastPap=-1;el.title.hidden=true;el.over.hidden=true;el.hud.hidden=false;drawBolts();say('報紙…我只是去拿報紙。',2);
}
function jump(){vy=JUMP_V;py=.001;slide=0;wantSlide=false;jumpBuf=0;Snd.blip(300,640,.15,'triangle',.08);}
function doSlide(){slide=SLIDE_T;wantSlide=false;Snd.blip(300,120,.16,'sawtooth',.045);}
// 四個動作：L/R 換線、U 跳、D 蹲（在空中按 D 會快速落地再蹲）
function act(d){
  if(mode!=='play'||paused)return;
  if(d==='L'||d==='R'){const n=clamp(lane+(d==='L'?-1:1),-1,1);if(n!==lane){lane=n;lastLaneT=time;Snd.blip(520,620,.05,'sine',.05);}else shake=Math.max(shake,3);}
  else if(d==='U'){if(py<=0)jump();else{jumpBuf=.16;wantSlide=false;}}
  else if(d==='D'){if(py>0){vy=Math.min(vy,-10);wantSlide=true;jumpBuf=0;}else doSlide();}
}
function hit(o){
  if(invuln>0||darkT>0)return;const[mx,my]=manXY();
  if(shield){shield=false;invuln=1;shake=8;pop(mx,my-70,'太空毯擋住了！',PAPER,true);say('還好多裹了一層。');Snd.blip(900,300,.2,'triangle',.1);burst(mx,my,16,FOIL_L,160);return;}
  pain++;drawBolts();invuln=1.6;slow=.9;shake=16;flash=1;Snd.zap();lastHit=OB[o.t].n;if(o.t==='ped'){o.shock=1;o.say='對、對不起！';o.sayT=1.2;}
  pop(mx,my-80,'有電！',VOLT,true);burst(mx,my,14,VOLT,200);say(pick(MAN_ZAP),1.2);
  if(pain>=PAIN_MAX){mode='dying';dieT=0;}
}
function collect(it){
  it.got=true;const[mx,my]=manXY();
  if(it.t==='paper'){papers++;pStreak=time-pLast<.5?pStreak+1:0;pLast=time;Snd.blip(700*Math.pow(2,Math.min(pStreak,12)/12),1100*Math.pow(2,Math.min(pStreak,12)/12),.06,'triangle',.06);
    if(papers%PAPER_HEAL===0){if(pain>0){pain--;drawBolts();pop(mx,my-90,'看完報紙，冷靜下來了',LAMP,true);say('…呼。');Snd.blip(520,1040,.3,'sine',.08);}else pop(mx,my-90,`報紙 ${papers} 份！`,LAMP);}}
  else if(it.t==='foil'){shield=true;pop(mx,my-90,'多裹一層太空毯',PAPER,true);say('這樣好多了。');burst(mx,my,12,FOIL_L,140);for(let i=0;i<3;i++)Snd.blip(600+i*200,900+i*200,.1,'triangle',.08,i*.07);}
  else{darkT=DARK_T;pop(mx,my-90,'全區停電！',VOLT,true);say('終於…安靜了。',2.2);Snd.blip(400,60,.5,'sawtooth',.09);}
}
function gameOver(){
  mode='over';paused=false;$('pause').hidden=true;const n=Math.floor(dist);if(n>best){best=n;store.set('ds.dist',String(n));}
  $('ovN').textContent=n;$('ovBest').textContent=best+' 公尺';$('ovPaper').textContent=papers+' 份';$('ovRank').textContent=RANKS.find(r=>n>=r[0])[1];$('ovMiss').textContent=lastHit||'—';
  $('copied').textContent='';el.hud.hidden=true;el.over.hidden=false;showBest();
}
function tick(dt){
  time+=dt;shake=Math.max(0,shake-dt*26);flash=Math.max(0,flash-dt*3.5);
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=300*dt;if((s.life-=dt)<=0)sparks.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--)if((pops[i].life-=dt)<=0)pops.splice(i,1);
  if(mode==='dying'){dieT+=dt;if(Math.random()<.5){const[mx,my]=manXY();burst(mx,my,1,VOLT,180);}if(dieT>1.3)gameOver();return;}
  if(mode!=='play')return;
  const vT=vAt(dist);slow=Math.max(0,slow-dt);speed=vT*(1-.45*clamp(slow/.9,0,1));dist+=speed*dt;
  px+=clamp(lane-px,-LANE_V*dt,LANE_V*dt);
  if(jumpBuf>0)jumpBuf-=dt;if(invuln>0)invuln-=dt;if(manSayT>0)manSayT-=dt;if(nearT>0)nearT-=dt;if(slide>0)slide-=dt;
  if(darkT>0){darkT-=dt;if(darkT<=0){darkT=0;invuln=Math.max(invuln,.7);pop(CX,150,'電來了！',VOLT);Snd.blip(80,500,.3,'sawtooth',.07);}}
  if(py>0){vy-=GRAV*dt;py+=vy*dt;if(py<=0){py=0;vy=0;if(wantSlide)doSlide();else if(jumpBuf>0)jump();}}
  // 排新的障礙
  while(nextWz<dist+SPAWN_Z){const gap=vT*lerp(1.08,.56,smooth(0,3200,dist));spawnRow(nextWz,gap,vT);nextWz+=gap;}
  // 碰撞：東西經過腳邊那一小段距離時，看有沒有做對動作
  const low=slide>0&&py<=0;
  for(let i=obs.length-1;i>=0;i--){const o=obs[i],z=o.wz-dist,half=o.kind==='low'?.5:.36;if(o.sayT>0)o.sayT-=dt;
    if(o.t==='ped'&&!o.said&&z<17){o.said=true;if(Math.random()<.7){o.say=pick(YELL[o.cast.id]||['欸！']);o.sayT=1.5;}}
    if(z<Z_NEAR-.4){obs.splice(i,1);continue;}if(o.done)continue;
    const inLane=o.w===3||Math.abs(px-obX(o))<.6;
    if(z<half&&z>-half){if(inLane&&!(o.kind==='low'?py>.3:o.kind==='high'?low:false)){o.done=true;hit(o);}}
    else if(z<=-half){o.done=true;
      if(invuln<=0&&darkT<=0&&nearT<=0&&((inLane&&o.kind!=='full')||(o.kind==='full'&&time-lastLaneT<.28&&Math.abs(px-o.x)<1.3))){nearT=1.6;const[mx,my]=manXY();pop(mx,my-70,pick(['好險！','過了！','漂亮！']),PAPER);if(Math.random()<.3)say(pick(MAN_NEAR),1.1);}}
  }
  const mid=py+(low?.3:.7);
  for(let i=items.length-1;i>=0;i--){const it=items[i],z=it.wz-dist;if(z<Z_NEAR-.4){items.splice(i,1);continue;}
    if(!it.got&&z<.6&&z>-.6&&Math.abs(px-it.x)<.6&&Math.abs(mid-it.y)<(it.t==='paper'?.8:1.2))collect(it);}
  // 腳步聲跟著速度變快；每快一級提示一次
  const ph=Math.floor(dist*1.9/Math.PI);if(ph!==stepPh){stepPh=ph;if(py<=0&&slide<=0)Snd.blip(150,90,.035,'square',.022);}
  const tr=Math.floor((vT-V0)/3);if(tr>tier){tier=tr;pop(CX,205,'越跑越快！',PAPER);Snd.blip(500,900,.18,'sawtooth',.05);}
  const mile=Math.floor(dist/500);if(mile>lastMile){lastMile=mile;pop(CX,170,`${mile*500} 公尺！`,LAMP,true);say(pick(MAN_MILE),1.8);Snd.blip(660,990,.12,'triangle',.08);Snd.blip(990,1320,.14,'triangle',.06,.1);}
}
function hud(){
  if(mode!=='play'&&mode!=='dying')return;
  const n=Math.floor(dist);if(n!==lastNum){lastNum=n;el.num.textContent=n;}if(papers!==lastPap){lastPap=papers;el.papers.textContent=papers;}
  let tip='';for(const o of obs){const z=o.wz-dist;if(o.tip&&!o.done&&z<30&&z>0){tip=o.tip;break;}}setHint(tip);
}
const H=1/60;let acc=0,last=0,hold=false;
function setPaused(p){if(p&&(paused||mode!=='play'))return;if(!p&&!paused)return;paused=p;$('pause').hidden=!p;last=0;acc=0;swipe=null;if(Snd.ctx){try{p?Snd.ctx.suspend():Snd.ctx.resume();}catch(e){}}if(p)$('resume').focus({preventScroll:true});}
function frame(now){
  const dt=Math.min(.05,(now-(last||now))/1000);last=now;
  if(!paused&&!hold){acc+=dt;let n=0;while(acc>=H&&n++<6){tick(H);acc-=H;}if(n>=6)acc=0;hud();}
  render();requestAnimationFrame(frame);
}

/* ───────── 輸入：滑一下就是一個動作，不用按住 ───────── */
let swipe=null;
gameEl.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;e.preventDefault();Snd.init();if(mode!=='play'||paused)return;swipe={x:e.clientX,y:e.clientY,id:e.pointerId};});
gameEl.addEventListener('pointermove',e=>{if(!swipe||e.pointerId!==swipe.id)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;if(Math.hypot(dx,dy)<20)return;
  swipe=null;act(Math.abs(dx)>Math.abs(dy)?(dx<0?'L':'R'):(dy<0?'U':'D'));});
for(const t of['pointerup','pointercancel'])gameEl.addEventListener(t,e=>{if(swipe&&e.pointerId===swipe.id)swipe=null;});
gameEl.addEventListener('contextmenu',e=>e.preventDefault());
/* iOS Safari：快速點兩下會被當成「點兩下放大」，而且放大後縮不回來，所以把雙擊縮放、雙指縮放都擋掉 */
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now(),btn=e.target&&e.target.closest&&e.target.closest('button,a');if(now-lastTouchEnd<=350&&!btn&&e.cancelable)e.preventDefault();lastTouchEnd=now;},{passive:false});
for(const t of['gesturestart','gesturechange','gestureend'])document.addEventListener(t,e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden)setPaused(true);});
window.addEventListener('blur',()=>setPaused(true));
window.addEventListener('pagehide',()=>setPaused(true));
const KEYS={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'U',KeyW:'U',Space:'U',ArrowDown:'D',KeyS:'D'};
window.addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(!e.repeat)setPaused(!paused);return;}
  if(paused||e.repeat)return;if(e.target.closest&&e.target.closest('button,a'))return;
  if(mode==='play'){if(KEYS[e.code]){e.preventDefault();Snd.init();act(KEYS[e.code]);}}
  else if((mode==='title'||mode==='over')&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();start();}});
$('start').addEventListener('click',start);
$('again').addEventListener('click',start);
$('pauseBtn').addEventListener('click',()=>setPaused(true));
$('resume').addEventListener('click',()=>setPaused(false));
el.mute.addEventListener('click',()=>{Snd.init();Snd.setOn(!Snd.on);muteIcon();});
$('share').addEventListener('click',async()=>{
  const link=document.querySelector('link[rel=canonical]'),out=$('copied');
  const text=`我在《絕命電師》陪Chu克披著太空毯跑了 ${Math.floor(dist)} 公尺，封號「${$('ovRank').textContent}」。你能跑多遠？`+(link?' '+link.href:'');
  try{await navigator.clipboard.writeText(text);out.textContent='已複製，貼到脆上炫耀吧';}
  catch(e){out.textContent=text;const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);}
});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(gameEl);

muteIcon();showBest();drawBolts();resize();requestAnimationFrame(frame);
window.__ds={OB,obs,items,act,start,tick,obX,addOb,PEDS,set hold(v){hold=v;},set lane(v){lane=px=v;},get mode(){return mode},get dist(){return dist},set dist(v){dist=v;nextWz=Math.max(nextWz,v+30);},get speed(){return speed},vAt,get pain(){return pain},set pain(v){pain=v;drawBolts();},get paused(){return paused},
  get lane(){return lane},get px(){return px},get runs(){return runs},set runs(v){runs=v;},get lastHit(){return lastHit},get py(){return py},get slide(){return slide},get papers(){return papers},get shield(){return shield},set shield(v){shield=v;},get darkT(){return darkT},set darkT(v){darkT=v;},
  xy(wx,wy){const b=gameEl.getBoundingClientRect();return{x:b.left+ox+wx*scale,y:b.top+oy+wy*scale};}};
})();
</script>
