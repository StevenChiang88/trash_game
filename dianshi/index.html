<style>
  /* 與發佈環境相同的最小底座：上下避開瀏海與手勢列 */
  html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

  [hidden]{display:none!important}

<!--PAGE-->
<title>絕命電師</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;900&family=Fredoka:wght@600;700&display=swap">
<style>
/* 版面：門口的一格畫面。夸克裹著太空毯站在左下角的門邊，客人站中間，要檢查的東西是他身邊的一顆顆圓鈕，信箱在右下角 */
:root{
  --ink:#2b2a3a;        /* 描邊與文字 */
  --paper:#fff8ea;      /* 圓鈕、卡片的紙白 */
  --lamp:#ffb84a;       /* 煤油燈的暖黃：主色 */
  --lamp-deep:#c97a1c;
  --volt:#35c8f5;       /* 電的顏色：只用在「有電」上 */
  --alert:#ee5b3a;      /* 點錯、發作 */
  --ok:#2f9a7c;         /* 安全過關 */
  --dusk:#f3d9a4;       /* 傍晚的天色 */
  --backdrop:#1c1b29;   /* 電腦版：手機畫面外的底色 */
  --display:"Fredoka","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --sticker:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 -2.5px 0 var(--ink),0 2.5px 0 var(--ink),-2.5px 0 0 var(--ink),2.5px 0 0 var(--ink);
}
html,body{height:100%;touch-action:manipulation}
button{touch-action:manipulation}
body{background:var(--dusk);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none;display:grid;place-items:center}
#game{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:8px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.count{display:flex;align-items:baseline;gap:5px;font-family:var(--display);color:var(--paper);text-shadow:var(--sticker);line-height:1}
.count small{font-family:var(--body);font-weight:900;font-size:15px}
.count b{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.side{display:flex;align-items:center;gap:8px}
.bolts{display:flex;gap:2px;padding:5px 9px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper)}
.bolts svg{width:20px;height:24px;display:block;fill:var(--paper);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.bolts svg.hit{fill:var(--volt)}
.icon-btn{pointer-events:auto;width:40px;height:40px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);cursor:pointer;padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn:focus-visible,.btn:focus-visible{outline:3px solid var(--volt);outline-offset:3px}
.timer{height:16px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--lamp);transform-origin:left center}
.timer.low i{background:var(--alert)}
.gap{flex:1}
.hint{align-self:center;text-align:center;font-weight:900;font-size:17px;color:var(--paper);text-shadow:var(--sticker);min-height:1.5em;text-wrap:balance}
.btn{pointer-events:auto;font:inherit;font-weight:900;font-size:20px;color:var(--ink);background:var(--lamp);border:3px solid var(--ink);border-radius:16px;padding:12px 30px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);font-size:16px;padding:10px 20px}
#enter{align-self:center;min-width:132px}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:28px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
#title{background:linear-gradient(rgba(28,27,41,.5),rgba(28,27,41,.2) 45%,rgba(28,27,41,.55))}
.logo{margin:5vh 0 0;font-weight:900;font-size:clamp(50px,16vw,80px);line-height:1;letter-spacing:.02em;color:var(--paper);text-shadow:var(--sticker),0 7px 0 var(--ink);transform:rotate(-3deg)}
.logo span{display:inline-block;color:var(--volt)}
.tag{margin:6px 0 0;font-weight:900;font-size:17px;color:var(--paper);text-shadow:var(--sticker);text-wrap:balance}
.how{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0;padding:0;list-style:none;font-size:14px}
.how li{padding:6px 12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.how b{font-weight:900;color:var(--lamp-deep)}
.best{font-weight:900;font-size:14px;color:var(--paper);text-shadow:var(--sticker);min-height:1.4em}
.home{pointer-events:auto;font-weight:900;font-size:14px;color:var(--paper);text-shadow:var(--sticker);text-underline-offset:4px}

#over,#pause{justify-content:center;background:rgba(28,27,41,.5)}
.card{width:min(330px,100%);display:flex;flex-direction:column;gap:14px;padding:18px;border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--ink);text-align:left;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateY(30px) scale(.94);opacity:0}}
.verdict{margin:0;font-weight:900;font-size:30px;line-height:1.25}
.verdict .n{font-family:var(--display);font-weight:700;color:var(--alert)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:0}
.stats dt{font-size:12px;opacity:.65}
.stats dd{margin:0;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.stats .wide{grid-column:1/-1}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.copied{font-size:13px;font-weight:900;color:var(--ok);min-height:1.3em;user-select:text;-webkit-user-select:text}
.note{margin:0;font-size:14px;opacity:.75}
@media (min-aspect-ratio:10/16){body{background:var(--backdrop)}#game{height:min(100% - 32px,900px);border-radius:26px;box-shadow:0 0 0 3px var(--ink),0 18px 50px rgba(0,0,0,.45)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c" aria-label="門口的客人和他身上的東西"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="top">
      <div class="count"><small>第</small><b id="num">1</b><small>位客人</small></div>
      <div class="side">
        <div class="bolts" id="bolts" aria-label="夸克還撐得住幾次"></div>
        <button class="icon-btn" id="pauseBtn" type="button" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.6"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.6"/></svg></button>
        <button class="icon-btn" id="mute" type="button" aria-label="聲音開關"></button>
      </div>
    </div>
    <div class="timer" id="timer"><i id="timerFill"></i></div>
    <div class="gap"></div>
    <div class="hint" id="hint"></div>
    <button class="btn" id="enter" type="button">請進</button>
  </div>

  <div class="screen" id="title">
    <h1 class="logo">絕命<span>電</span>師</h1>
    <p class="tag">夸克對電過敏。客人進門前，把帶電的東西全部丟進信箱。</p>
    <div class="gap"></div>
    <ul class="how">
      <li><b>點帶電的</b> 丟進信箱</li>
      <li><b>沒電的</b> 別亂點</li>
      <li><b>檢查完</b> 按「請進」</li>
    </ul>
    <button class="btn" id="start" type="button">開門</button>
    <div class="best" id="best"></div>
    <a class="home" href="../">其他遊戲</a>
  </div>

  <div class="screen" id="over" hidden>
    <div class="card">
      <p class="verdict">夸克發作了。<br>撐過 <span class="n" id="ovN">0</span> 位客人。</p>
      <dl class="stats">
        <div><dt>這次</dt><dd id="ovRun">0 位</dd></div>
        <div><dt>最佳紀錄</dt><dd id="ovBest">0 位</dd></div>
        <div class="wide"><dt>封號</dt><dd id="ovRank"></dd></div>
        <div class="wide"><dt>最後漏掉的</dt><dd id="ovMiss"></dd></div>
      </dl>
      <div class="acts">
        <button class="btn" id="again" type="button">再玩一次</button>
        <button class="btn ghost" id="share" type="button">複製戰績</button>
      </div>
      <div class="copied" id="copied"></div>
    </div>
  </div>

  <div class="screen" id="pause" hidden>
    <div class="card">
      <p class="verdict">暫停中</p>
      <p class="note">離開畫面會自動暫停，按「繼續」再接著玩。</p>
      <div class="acts"><button class="btn" id="resume" type="button">繼續</button></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[(Math.random()*a.length)|0];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=id=>document.getElementById(id);
const INK='#2b2a3a',PAPER='#fff8ea',VOLT='#35c8f5';

/* ───────── 物品：e=1 是帶電的。每個 d(c) 都畫在以 (0,0) 為中心、大約 ±18 的範圍裡 ───────── */
const P=(c,f)=>{c.beginPath();f();};
const IT={
  phone:{n:'手機',e:1,d(c){c.fillStyle='#3a3d52';rrect(c,-9,-16,18,32,4);c.fill();c.stroke();c.fillStyle='#8fdcf7';rrect(c,-6.5,-12,13,21,1.5);c.fill();c.fillStyle=PAPER;c.beginPath();c.arc(0,12.5,1.6,0,TAU);c.fill();}},
  swatch:{n:'智慧手錶',e:1,d(c){c.fillStyle='#55596e';c.fillRect(-5,-18,10,36);c.strokeRect(-5,-18,10,36);c.fillStyle='#3a3d52';rrect(c,-10,-10,20,20,5);c.fill();c.stroke();c.fillStyle='#8fdcf7';rrect(c,-6.5,-6.5,13,13,2.5);c.fill();c.fillStyle=INK;c.font='700 8px Fredoka,sans-serif';c.textAlign='center';c.fillText('12:0',0,3);}},
  fob:{n:'遙控鑰匙',e:1,d(c){c.fillStyle='#c9ced6';c.beginPath();c.moveTo(-2.5,2);c.lineTo(-2.5,17);c.lineTo(0,19);c.lineTo(2.5,17);c.lineTo(2.5,13);c.lineTo(5,12);c.lineTo(2.5,10);c.lineTo(2.5,2);c.closePath();c.fill();c.stroke();c.fillStyle='#3a3d52';rrect(c,-9,-18,18,21,5);c.fill();c.stroke();c.fillStyle='#ee5b3a';c.beginPath();c.arc(0,-11,2.6,0,TAU);c.fill();c.fillStyle='#8fdcf7';c.beginPath();c.arc(0,-3.5,2.6,0,TAU);c.fill();}},
  buds:{n:'藍牙耳機',e:1,d(c){for(const s of[-1,1]){c.save();c.translate(s*7,0);c.rotate(s*.2);c.fillStyle=PAPER;rrect(c,-2.6,-2,5.2,16,2.6);c.fill();c.stroke();c.beginPath();c.arc(0,-6,6.5,0,TAU);c.fill();c.stroke();c.fillStyle='#8fdcf7';c.beginPath();c.arc(s*-1.5,-6,1.6,0,TAU);c.fill();c.restore();}}},
  laptop:{n:'筆電',e:1,d(c){c.fillStyle='#55596e';rrect(c,-14,-14,28,19,2.5);c.fill();c.stroke();c.fillStyle='#8fdcf7';c.fillRect(-11,-11,22,13);c.fillStyle='#c9ced6';c.beginPath();c.moveTo(-17,5);c.lineTo(17,5);c.lineTo(19,12);c.lineTo(-19,12);c.closePath();c.fill();c.stroke();c.fillStyle=INK;c.fillRect(-4,7.5,8,1.6);}},
  pbank:{n:'行動電源',e:1,d(c){c.fillStyle=PAPER;rrect(c,-10,-14,20,28,4);c.fill();c.stroke();c.fillStyle='#8fdcf7';for(let i=0;i<4;i++){c.beginPath();c.arc(-6+i*4,-8,1.5,0,TAU);c.fill();}c.strokeStyle=INK;c.lineWidth=2.2;c.beginPath();c.moveTo(0,14);c.quadraticCurveTo(0,20,7,18);c.quadraticCurveTo(14,16,13,9);c.stroke();c.fillStyle='#55596e';c.fillRect(-3,10,6,4);}},
  ereader:{n:'電子書',e:1,d(c){c.fillStyle='#55596e';rrect(c,-12,-16,24,32,3.5);c.fill();c.stroke();c.fillStyle='#e9eef0';c.fillRect(-9,-13,18,23);c.fillStyle='#7c8194';for(let i=0;i<5;i++)c.fillRect(-7,-10+i*4.2,i===4?9:14,1.5);c.fillStyle='#8fdcf7';c.beginPath();c.arc(0,13,1.4,0,TAU);c.fill();}},
  torch:{n:'手電筒',e:1,d(c){c.save();c.rotate(-.5);c.fillStyle='#fff2a8';c.beginPath();c.moveTo(8,-6);c.lineTo(22,-13);c.lineTo(22,13);c.lineTo(8,6);c.closePath();c.fill();c.fillStyle='#ee5b3a';rrect(c,-16,-4.5,18,9,2.5);c.fill();c.stroke();c.fillStyle='#c9ced6';c.beginPath();c.moveTo(2,-4.5);c.lineTo(9,-8);c.lineTo(9,8);c.lineTo(2,4.5);c.closePath();c.fill();c.stroke();c.fillStyle=INK;c.fillRect(-9,-6.5,5,2.5);c.restore();}},
  calc:{n:'計算機',e:1,d(c){c.fillStyle='#55596e';rrect(c,-11,-16,22,32,3.5);c.fill();c.stroke();c.fillStyle='#bfe6c9';c.fillRect(-8,-13,16,8);c.fillStyle=INK;c.font='700 7px Fredoka,sans-serif';c.textAlign='right';c.fillText('88.8',7,-6.5);for(let r=0;r<3;r++)for(let q=0;q<3;q++){c.fillStyle=r===2&&q===2?'#ee5b3a':PAPER;c.fillRect(-8+q*6,-2+r*5.5,4,3.6);}}},
  efan:{n:'手持電風扇',e:1,d(c){c.fillStyle=PAPER;rrect(c,-3.5,3,7,15,3);c.fill();c.stroke();c.fillStyle='#8fdcf7';c.beginPath();c.arc(0,10,1.5,0,TAU);c.fill();c.fillStyle='#dfe6ea';c.beginPath();c.arc(0,-6,12,0,TAU);c.fill();c.stroke();c.fillStyle='#7ab8d8';for(let i=0;i<3;i++){c.save();c.translate(0,-6);c.rotate(i*TAU/3+.3);c.beginPath();c.ellipse(0,-5.5,3,5.5,.4,0,TAU);c.fill();c.restore();}c.fillStyle=INK;c.beginPath();c.arc(0,-6,2,0,TAU);c.fill();}},
  battery:{n:'電池',e:1,d(c){c.save();c.rotate(.5);c.fillStyle='#c9ced6';c.fillRect(-3,-18,6,4);c.strokeRect(-3,-18,6,4);c.fillStyle='#ee9b3a';rrect(c,-7,-14,14,30,2.5);c.fill();c.stroke();c.fillStyle=INK;c.fillRect(-7,2,14,14);c.fillStyle=PAPER;c.font='700 11px Fredoka,sans-serif';c.textAlign='center';c.fillText('+',0,-4);c.restore();}},
  watch:{n:'機械錶',e:0,d(c){c.fillStyle='#8a5a3a';c.fillRect(-5,-18,10,36);c.strokeRect(-5,-18,10,36);c.fillStyle='#e9d8a6';c.beginPath();c.arc(0,0,11,0,TAU);c.fill();c.stroke();c.fillStyle=PAPER;c.beginPath();c.arc(0,0,7.5,0,TAU);c.fill();c.strokeStyle=INK;c.lineWidth=1.8;c.beginPath();c.moveTo(0,0);c.lineTo(0,-5.5);c.moveTo(0,0);c.lineTo(4,2);c.stroke();}},
  key:{n:'鑰匙',e:0,d(c){c.fillStyle='#e0b24a';c.beginPath();c.moveTo(-2.5,-2);c.lineTo(-2.5,16);c.lineTo(0,18.5);c.lineTo(2.5,16);c.lineTo(2.5,12);c.lineTo(6,11);c.lineTo(2.5,9);c.lineTo(2.5,6);c.lineTo(5,5);c.lineTo(2.5,3.5);c.lineTo(2.5,-2);c.closePath();c.fill();c.stroke();c.beginPath();c.arc(0,-10,8.5,0,TAU);c.fill();c.stroke();c.fillStyle=PAPER;c.beginPath();c.arc(0,-11.5,3,0,TAU);c.fill();c.stroke();}},
  book:{n:'書',e:0,d(c){c.fillStyle='#b5503f';rrect(c,-13,-15,26,30,2.5);c.fill();c.stroke();c.fillStyle=PAPER;c.fillRect(-9,-15,2,30);c.fillRect(11,-12,2,25);c.fillStyle='#f3d9a4';c.fillRect(-4,-9,12,3);c.fillRect(-4,-3,8,2);}},
  notebook:{n:'筆記本',e:0,d(c){c.fillStyle='#f6e9b8';rrect(c,-11,-15,23,30,2);c.fill();c.stroke();c.strokeStyle='#9aa7c9';c.lineWidth=1.2;for(let i=0;i<5;i++){c.beginPath();c.moveTo(-6,-8+i*5);c.lineTo(9,-8+i*5);c.stroke();}c.strokeStyle=INK;c.lineWidth=1.8;for(let i=0;i<6;i++){c.beginPath();c.arc(-11,-11+i*4.6,2.3,0,TAU);c.stroke();}}},
  candle:{n:'蠟燭',e:0,d(c){c.fillStyle='#ffb84a';c.beginPath();c.moveTo(0,-19);c.quadraticCurveTo(6,-11,0,-6);c.quadraticCurveTo(-6,-11,0,-19);c.fill();c.stroke();c.fillStyle=PAPER;rrect(c,-6,-4,12,20,2);c.fill();c.stroke();c.strokeStyle=INK;c.lineWidth=1.6;c.beginPath();c.moveTo(0,-4);c.lineTo(0,-8);c.stroke();c.fillStyle='#c9ced6';c.fillRect(-10,15,20,3.5);c.strokeRect(-10,15,20,3.5);}},

function makeVisitor(k){
  const kind=k===1?KINDS[0]:(k>=4&&Math.random()<.22?KINDS[5]:pick(KINDS.slice(0,5)));
  const n=k===1?2:Math.min(8,3+Math.floor((k-1)/3));                       // 幾樣東西：越後面越多
  let nE=k===1?1:k<=3?1+((Math.random()*2)|0):Math.max(0,Math.min(n,Math.round(rnd(.2,.75)*n)));
  if(k>=5&&Math.random()<.1)nE=0;                                          // 偶爾來個身上完全沒電的：別亂點
  if(kind.sly&&nE<2)nE=Math.min(n,2);
  const es=shuffle(E_IDS.slice()).slice(0,nE),hs=[];
  for(const e of es)if(hs.length<n-nE&&LOOKALIKE[e]&&Math.random()<.6&&k>2)hs.push(LOOKALIKE[e]);   // 故意放長得像的來混淆
  for(const h of shuffle(H_IDS.slice()))if(hs.length<n-nE&&!hs.includes(h))hs.push(h);
  const ids=shuffle(es.concat(hs)),slots=shuffle(SLOTS.slice(0,Math.max(4,Math.min(8,n+2))).map((s,i)=>i));
  const toks=ids.map((id,i)=>({id,e:IT[id].e,x:SLOTS[slots[i]][0],y:SLOTS[slots[i]][1],state:'in',t:-.12*i,hid:false,sh:0}));
  // 包包：Day… 第 6 位之後有人會把東西藏在包包裡，要先點包包打開
  let bag=null;
  if(k>=6&&toks.length>=4&&(kind.sly||Math.random()<.45)){const inside=shuffle(toks.slice()).slice(0,kind.sly?2:1+((Math.random()*2)|0));
    if(kind.sly){const el=toks.filter(t=>t.e);for(let i=0;i<inside.length&&i<el.length;i++)inside[i]=el[i];}      // 弟弟專門把有電的藏起來
    const bx=inside[0].x,by=inside[0].y;inside.forEach(t=>{t.hid=true;});
    bag={x:bx,y:by,state:'in',t:0,inside};
    inside.forEach((t,i)=>{if(i>0){const free=SLOTS.find(s=>!toks.some(o=>!o.hid&&o.x===s[0]&&o.y===s[1])&&!(s[0]===bx&&s[1]===by)&&!inside.some((o,j)=>j<i&&o.x===s[0]&&o.y===s[1]));if(free){t.x=free[0];t.y=free[1];}}});}
  const T=(k===1?10:Math.max(3.4,8-.17*k)+n*.15)+(bag?.7:0);
  return{k,kind,hi:pick(kind.hi),toks,bag,T,t:0,phase:'enter',pt:0,wrong:0,say:'',sayT:0,mood:0,left:[]};
}

function drawToken(c,x,y,sc,al,drawIcon,ring){

  c.strokeStyle=INK;c.lineWidth=2;c.textBaseline='alphabetic';drawIcon(c);c.restore();
}

function render(){
  const W=cv.width,H=cv.height,k=dpr*scale;let sx=0,sy=0;if(shake>0&&!reduced){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;}
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#3a2f2a';g.fillRect(0,0,W,H);
  g.drawImage(stat,Math.round((sx-PAD/scale)*k),Math.round((sy-PAD/scale)*k));
  g.setTransform(k,0,0,k,(ox+sx)*dpr,(oy+sy)*dpr);
  const v=vis;
  if(v){
    // 客人：走進來 → 站著被檢查 → 朝我們走過來（進門）
    let px=180,sc=1,al=1;
    if(v.phase==='enter'){const e=clamp(v.pt/.45,0,1),q=1-(1-e)*(1-e);px=lerp(-90,180,q);}
    else if(v.phase==='go'){const e=clamp(v.pt/.5,0,1);sc=1+e*.35;al=1-e*e;}
    else if(v.phase==='result')al=0;
    if(al>0)drawPerson(g,v,px,236+Math.sin(time*2.2)*1.5,sc,al);
    // 對白
    if(v.sayT>0&&v.say&&v.phase!=='result'){g.font='900 15px "Chiron GoRound TC","PingFang TC",sans-serif';const w=Math.min(250,g.measureText(v.say).width+22),bx=clamp(px-w/2,24,336-w),by=148;
      g.globalAlpha=clamp(v.sayT*3,0,1);g.fillStyle=PAPER;g.strokeStyle=INK;g.lineWidth=2.5;rrect(g,bx,by-24,w,32,12);g.fill();g.stroke();g.beginPath();g.moveTo(px-8,by+8);g.lineTo(px,by+19);g.lineTo(px+8,by+8);g.fill();g.stroke();g.fillStyle=PAPER;g.fillRect(px-7,by+5,14,5);
      g.fillStyle=INK;g.textAlign='center';g.textBaseline='middle';g.fillText(v.say,bx+w/2,by-7,w-14);g.textBaseline='alphabetic';g.globalAlpha=1;}
    // 包包
    const b=v.bag;if(b&&b.state!=='gone'&&v.phase!=='enter'){const e=clamp(b.t/.2,0,1);drawToken(g,b.x+(b.sh>0?Math.sin(time*60)*3:0),b.y,b.state==='open'?1+e*.3:1,b.state==='open'?1-e:(v.phase==='go'||v.phase==='result'?0:1),bagIcon,null);}
    // 物品
    for(const t of v.toks){if(t.hid||t.state==='gone'||v.phase==='enter')continue;
      if(t.state==='in'){const e=clamp(t.t/.18,0,1),pop=e<1?.5+.5*(1+2.2*Math.pow(e-1,3)+1.2*Math.pow(e-1,2)):1;if(t.t<0)continue;
        const zapped=v.phase==='result'&&t.e;if((v.phase==='go'||v.phase==='result')&&!zapped)continue;
        drawToken(g,t.x+(t.sh>0?Math.sin(time*70)*3.5:0),t.y+Math.sin(time*2.4+t.x)*2,pop*(zapped?1.12:1),1,IT[t.id].d,t.sh>0?'#ee5b3a':zapped?VOLT:null);
        if(zapped){g.font='900 13px "Chiron GoRound TC","PingFang TC",sans-serif';g.textAlign='center';g.lineWidth=4.5;g.strokeStyle=INK;g.fillStyle=VOLT;g.strokeText(IT[t.id].n,t.x,t.y+TOK_R+19);g.fillText(IT[t.id].n,t.x,t.y+TOK_R+19);}}
      else if(t.state==='fly'){const e=clamp(t.t/.34,0,1),q=e*e,x=lerp(t.x,BOX.x,q),y=lerp(t.y,BOX.y-4,q)-Math.sin(e*Math.PI)*46;drawToken(g,x,y,1-e*.62,1,IT[t.id].d,null);}}
    // 漏掉的電：一道一道打向我們
    g.lineJoin='round';g.lineCap='round';

  for(const s of sparks){g.globalAlpha=clamp(s.life*2,0,1);g.fillStyle=s.col;g.beginPath();g.arc(s.x,s.y,s.r,0,TAU);g.fill();}
  g.textAlign='center';g.textBaseline='middle';g.font='900 19px "Chiron GoRound TC","PingFang TC",sans-serif';g.lineJoin='round';
  for(const p of pops){const e=1-p.life/p.dur,pp=1+.5*Math.pow(clamp(1-e*6,0,1),2);g.globalAlpha=clamp(p.life*4,0,1);g.save();g.translate(p.x,p.y-e*18);g.scale(pp*(p.big?1.5:1),pp*(p.big?1.5:1));g.lineWidth=5.5;g.strokeStyle=INK;g.strokeText(p.text,0,0);g.fillStyle=p.col;g.fillText(p.text,0,0);g.restore();}
  g.globalAlpha=1;g.textBaseline='alphabetic';g.textAlign='left';
  g.setTransform(1,0,0,1,0,0);
  if(flash>0){g.fillStyle=VOLT;g.globalAlpha=flash*.55;g.fillRect(0,0,W,H);g.globalAlpha=1;}
}

/* ───────── HUD 與流程 ───────── */
const el={hud:$('hud'),num:$('num'),bolts:$('bolts'),timer:$('timer'),fill:$('timerFill'),hint:$('hint'),enter:$('enter'),title:$('title'),over:$('over'),best:$('best'),mute:$('mute')};
const RANKS=[[40,'絕命電師'],[25,'電磁結界'],[15,'人體金屬探測器'],[8,'稱職的守門人'],[3,'勉強擋得住'],[0,'第一天上班的門房']];
let lastHint='',lastFill=-1,paused=false;
function setHint(t){if(t!==lastHint){lastHint=t;el.hint.textContent=t;}}
function drawBolts(){el.bolts.innerHTML='';for(let i=0;i<PAIN_MAX;i++)el.bolts.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 20 24" class="${i<pain?'hit':''}" aria-hidden="true"><path d="M12 1.5 3 13.5h6l-2 9 10-13h-6.5z"/></svg>`);}
function muteIcon(){el.mute.innerHTML=Snd.on
  ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>'
  :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  el.mute.setAttribute('aria-pressed',String(!Snd.on));}
function showBest(){el.best.textContent=best>0?`最佳紀錄　${best} 位客人`:'';}
function pop(x,y,text,col,big){pops.push({x,y,text,col,life:big?1:.75,dur:big?1:.75,big});}

function start(){
  Snd.init();Snd.blip(420,640,.14,'triangle',.1);paused=false;$('pause').hidden=true;
  nth=0;pain=0;streak=0;lastMiss=[];sparks.length=bolts.length=pops.length=0;shake=flash=0;mode='play';
  el.title.hidden=true;el.over.hidden=true;el.hud.hidden=false;drawBolts();next();
}
function next(){nth++;vis=makeVisitor(nth);el.num.textContent=nth;el.enter.disabled=false;lastFill=-1;Snd.blip(180,150,.06,'square',.07);Snd.blip(180,150,.06,'square',.07,.12);}   // 叩叩
function tapAt(x,y){
  const v=vis;if(!v||v.phase!=='check')return;
  const b=v.bag;if(b&&b.state==='in'&&Math.hypot(x-b.x,y-b.y)<TOK_R+10){b.state='open';b.t=0;b.inside.forEach((t,i)=>{t.hid=false;t.t=-.08*i;});Snd.blip(300,520,.1,'triangle',.08);pop(b.x,b.y-40,'打開包包','#fff8ea');return;}
  let hit=null,bd=TOK_R+10;for(const t of v.toks){if(t.hid||t.state!=='in'||t.t<0)continue;const d=Math.hypot(x-t.x,y-t.y);if(d<bd){bd=d;hit=t;}}
  if(!hit)return;
  if(hit.e){hit.state='fly';hit.t=0;Snd.blip(520,880,.08,'triangle',.09);}
  else{hit.sh=.4;v.wrong++;v.t+=1.3;v.mood=1;v.say=`欸，那是我的${IT[hit.id].n}！`;v.sayT=1.4;shake=Math.max(shake,4);pop(hit.x,hit.y-40,'沒有電！','#ee5b3a');Snd.blip(220,140,.16,'square',.07);}   // 點錯：客人不爽，時間少 1.3 秒
}
function admit(){const v=vis;if(!v||v.phase!=='check')return;v.phase='go';v.pt=0;el.enter.disabled=true;
  v.left=v.toks.filter(t=>t.e&&t.state==='in');v.toks.forEach(t=>{if(t.hid){t.hid=false;t.t=1;}});if(v.bag&&v.bag.state==='in')v.bag.state='gone';
  Snd.blip(300,200,.18,'sine',.06);}
function resolve(){
  const v=vis;v.phase='result';v.pt=0;
  if(v.left.length){   // 有電的東西進門了
    const hurt=v.left.length>=3?2:1;pain=Math.min(PAIN_MAX,pain+hurt);streak=0;lastMiss=v.left.map(t=>IT[t.id].n);drawBolts();
    shake=16;flash=1;Snd.zap();pop(196,300,'啊啊啊——有電！',VOLT,true);
    for(const t of v.left){const pts=[[t.x,t.y]];let x=t.x,y=t.y;const tx=MAN.x,ty=wy1-120;for(let i=1;i<=7;i++){x=lerp(t.x,tx,i/7)+(i<7?rnd(-20,20):0);y=lerp(t.y,ty,i/7)+(i<7?rnd(-14,14):0);pts.push([x,y]);}bolts.push({pts,life:.7});}
  }else{
    streak++;const clean=v.wrong===0;pop(180,300,clean?'安全！':'安全（但客人不太高興）',clean?'#ffd35c':'#fff8ea',clean);Snd.blip(660,990,.12,'triangle',.09);Snd.blip(990,1320,.14,'triangle',.07,.1);
    for(let i=0;i<10;i++)sparks.push({x:180+rnd(-70,70),y:300+rnd(-40,40),vx:rnd(-60,60),vy:rnd(-120,-30),r:rnd(2,4),col:'#ffd35c',life:rnd(.4,.8)});
    if(streak>0&&streak%HEAL_EVERY===0&&pain>0){pain--;drawBolts();pop(180,340,'深呼吸，緩過來了',VOLT);}   // 連續安全幾位就恢復一格
  }
}
function gameOver(){
  mode='over';paused=false;$('pause').hidden=true;const n=nth-1;if(n>best){best=n;store.set('ds.best',String(n));}
  $('ovN').textContent=n;$('ovRun').textContent=n+' 位';$('ovBest').textContent=best+' 位';$('ovRank').textContent=RANKS.find(r=>n>=r[0])[1];$('ovMiss').textContent=lastMiss.join('、')||'—';
  $('copied').textContent='';el.hud.hidden=true;el.over.hidden=false;showBest();
}
function tick(dt){
  time+=dt;shake=Math.max(0,shake-dt*26);flash=Math.max(0,flash-dt*3.5);
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=260*dt;if((s.life-=dt)<=0)sparks.splice(i,1);}
  for(let i=bolts.length-1;i>=0;i--)if((bolts[i].life-=dt)<=0)bolts.splice(i,1);
  for(let i=pops.length-1;i>=0;i--)if((pops[i].life-=dt)<=0)pops.splice(i,1);
  const v=vis;if(mode!=='play'||!v)return;
  v.pt+=dt;if(v.sayT>0)v.sayT-=dt;if(v.bag){v.bag.t+=dt;if(v.bag.state==='open'&&v.bag.t>.2)v.bag.state='gone';}
  for(const t of v.toks){t.t+=dt;if(t.sh>0)t.sh-=dt;if(t.state==='fly'&&t.t>=.34){t.state='gone';Snd.blip(160,110,.07,'square',.08);for(let i=0;i<4;i++)sparks.push({x:BOX.x+rnd(-12,12),y:BOX.y-8,vx:rnd(-50,50),vy:rnd(-90,-30),r:2.5,col:VOLT,life:.4});}}
  if(v.phase==='enter'&&v.pt>=.45){v.phase='check';v.pt=0;v.say=v.hi;v.sayT=1.6;v.toks.forEach((t,i)=>{if(t.t>0)t.t=-.1*i;});}
  else if(v.phase==='check'){v.t+=dt;if(v.t>=v.T)admit();}
  else if(v.phase==='go'&&v.pt>=.5)resolve();
  else if(v.phase==='result'&&v.pt>=(v.left.length?1.5:.8)){if(pain>=PAIN_MAX)gameOver();else next();}
}
function hud(){
  const v=vis;if(mode!=='play'||!v)return;
  const left=v.phase==='check'?clamp(1-v.t/v.T,0,1):v.phase==='enter'?1:0,f=Math.round(left*200);
  if(f!==lastFill){lastFill=f;el.fill.style.transform=`scaleX(${left.toFixed(3)})`;el.timer.classList.toggle('low',left<.3);}
  if(v.phase==='result')setHint(v.left.length?'漏掉的東西標出來了，下次記得':'');
  else if(v.k===1)setHint('帶電的點掉丟進信箱，檢查完按「請進」');
  else if(v.bag&&v.bag.state==='in'&&v.k<=9)setHint('包包裡可能藏東西，點開看看');
  else if(v.k<=3)setHint('長得很像的要看清楚');
  else setHint('');
}
const H=1/60;let acc=0,last=0;
function setPaused(p){if(p&&(paused||mode!=='play'))return;if(!p&&!paused)return;paused=p;$('pause').hidden=!p;last=0;acc=0;if(Snd.ctx){try{p?Snd.ctx.suspend():Snd.ctx.resume();}catch(e){}}if(p)$('resume').focus({preventScroll:true});}
function frame(now){
  const dt=Math.min(.05,(now-(last||now))/1000);last=now;
  if(!paused){acc+=dt;let n=0;while(acc>=H&&n++<6){tick(H);acc-=H;}if(n>=6)acc=0;hud();}
  render();requestAnimationFrame(frame);
}

/* ───────── 輸入 ───────── */
gameEl.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;e.preventDefault();Snd.init();if(mode!=='play'||paused)return;
  const b=gameEl.getBoundingClientRect();tapAt((e.clientX-b.left-ox)/scale,(e.clientY-b.top-oy)/scale);});

/* iOS Safari：快速點兩下會被當成「點兩下放大」，而且放大後縮不回來，所以把雙擊縮放、雙指縮放都擋掉 */
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now(),btn=e.target&&e.target.closest&&e.target.closest('button,a');if(now-lastTouchEnd<=350&&!btn&&e.cancelable)e.preventDefault();lastTouchEnd=now;},{passive:false});
for(const t of['gesturestart','gesturechange','gestureend'])document.addEventListener(t,e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden)setPaused(true);});
window.addEventListener('blur',()=>setPaused(true));
window.addEventListener('pagehide',()=>setPaused(true));
window.addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(!e.repeat)setPaused(!paused);return;}
  if(paused||e.repeat||(e.code!=='Space'&&e.code!=='Enter'))return;if(e.target.closest&&e.target.closest('button,a'))return;e.preventDefault();
  if(mode==='title'||mode==='over')start();else admit();});
$('start').addEventListener('click',start);
$('again').addEventListener('click',start);
el.enter.addEventListener('click',()=>{Snd.init();admit();});
$('pauseBtn').addEventListener('click',()=>setPaused(true));
$('resume').addEventListener('click',()=>setPaused(false));
el.mute.addEventListener('click',()=>{Snd.init();Snd.setOn(!Snd.on);muteIcon();});
$('share').addEventListener('click',async()=>{
  const link=document.querySelector('link[rel=canonical]'),out=$('copied');
  const text=`我在《絕命電師》幫夸克擋了 ${nth-1} 位客人身上的電，封號「${$('ovRank').textContent}」。你擋得住幾位？`+(link?' '+link.href:'');
  try{await navigator.clipboard.writeText(text);out.textContent='已複製，貼到脆上炫耀吧';}
  catch(e){out.textContent=text;const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);}
});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(gameEl);

vis=makeVisitor(7);vis.phase='check';vis.toks.forEach(t=>{t.t=1;});vis.sayT=0;
muteIcon();showBest();drawBolts();resize();requestAnimationFrame(frame);
window.__ds={IT,get vis(){return vis},get mode(){return mode},get nth(){return nth},get pain(){return pain},get paused(){return paused},start,admit,makeVisitor,
  xy(wx,wy){const b=gameEl.getBoundingClientRect();return{x:b.left+ox+wx*scale,y:b.top+oy+wy*scale};}};
