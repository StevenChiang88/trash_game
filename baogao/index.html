<title>用生命做英文報告</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* 版面：整個畫面是跟在後面拍的影片（像賽車遊戲那樣往前騎）。他載著同學邊騎邊唸英文報告，
   上面是錄影的資訊（REC、第幾次拍、帥度），右邊是壓車的量表，下面是英文字幕。整個畫面按住就是壓車 */
:root{
  --ink:#26253a;        /* 描邊與文字 */
  --paper:#fff6e6;      /* 卡片 */
  --rec:#e5432f;        /* 錄影紅：主色，也是「壓過頭」 */
  --sun:#ffc93c;        /* 按鈕、火花、帥 */
  --band:#35b08a;       /* 壓得剛好 */
  --ok:#2f9a7c;
  --asphalt:#5f6170;
  --backdrop:#16151f;
  --display:"Fredoka","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --sticker:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 -2.5px 0 var(--ink),0 2.5px 0 var(--ink),-2.5px 0 0 var(--ink),2.5px 0 0 var(--ink);
}
html,body{height:100%;touch-action:none;overscroll-behavior:none}
button{touch-action:manipulation}
body{background:var(--backdrop);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;display:grid;place-items:center}
#game{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:var(--asphalt)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:8px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.left{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
/* 錄影資訊：紅點會閃 */
.rec{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);letter-spacing:.04em}
.rec i{width:11px;height:11px;border-radius:50%;background:var(--rec);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.score{display:flex;align-items:baseline;gap:6px;font-family:var(--display);color:var(--paper);text-shadow:var(--sticker);line-height:1}
.score small{font-family:var(--body);font-weight:900;font-size:15px}
.score b{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
.score em{font-style:normal;font-family:var(--body);font-weight:900;font-size:14px;color:var(--sun)}
.side{display:flex;flex-direction:column;gap:8px}
.icon-btn{pointer-events:auto;width:40px;height:40px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);cursor:pointer;padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn:focus-visible,.btn:focus-visible,.lv:focus-visible{outline:3px solid var(--band);outline-offset:3px}
.gap{flex:1}
/* 英文字幕：像影片下方的字幕條 */
.cap{align-self:center;margin-top:auto;width:min(328px,100%);min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 14px;border-radius:12px;background:rgba(22,21,31,.72);color:#fff;text-align:center}
.cap b{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.25;min-height:1.25em;text-wrap:balance}
.cap span{font-weight:900;font-size:13px;color:var(--sun);min-height:1.3em}

.btn{pointer-events:auto;font:inherit;font-weight:900;font-size:20px;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:16px;padding:12px 26px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);font-size:15px;padding:10px 16px}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:24px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
#title{background:linear-gradient(rgba(22,21,31,.72),rgba(22,21,31,.25) 30%,rgba(22,21,31,.55) 55%,rgba(22,21,31,.86))}
.logo{margin:2vh 0 0;font-weight:900;font-size:clamp(34px,10.5vw,50px);line-height:1.08;letter-spacing:.02em;color:var(--paper);text-shadow:var(--sticker),0 6px 0 var(--ink);transform:rotate(-3deg)}
.logo span{display:block;color:var(--sun);font-size:1.22em}
.tag{margin:4px 0 0;font-weight:900;font-size:16px;color:var(--paper);text-shadow:var(--sticker);text-wrap:balance}
.how{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:0;padding:0;list-style:none;font-size:13.5px}
.how li{padding:5px 11px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.how b{font-weight:900;color:var(--rec)}
/* 作業清單：一份作業一關，做完才開下一份 */
.levels{pointer-events:auto;width:min(330px,100%);display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:auto;max-height:46%;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;padding:2px}
.lv{font:inherit;color:var(--ink);text-align:left;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 6px;padding:7px 10px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.lv b{font-weight:900;font-size:14px;line-height:1.2}.lv small{grid-column:1;font-size:11px;opacity:.7;line-height:1.2}
.lv .g{grid-row:1/3;grid-column:2;font-family:var(--display);font-weight:700;font-size:22px;color:var(--rec);min-width:20px;text-align:center}
.lv.next{background:var(--sun)}
.lv:disabled{cursor:default;box-shadow:none;background:rgba(255,246,230,.45);border-color:rgba(38,37,58,.45);color:rgba(38,37,58,.6)}
.lv:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.best{font-weight:900;font-size:13px;color:var(--paper);text-shadow:var(--sticker);min-height:1.4em}
.home{pointer-events:auto;font-weight:900;font-size:14px;color:var(--paper);text-shadow:var(--sticker);text-underline-offset:4px}

#over,#pause{justify-content:center;background:rgba(22,21,31,.6)}
.card{width:min(330px,100%);max-height:100%;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding:18px;border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--ink);text-align:left;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.verdict{margin:0;font-weight:900;font-size:28px;line-height:1.25}
.verdict .n{font-family:var(--display);font-weight:700;color:var(--rec)}
/* 大大的成績或觀看次數 */
.big{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;background:#fff}
.big b{font-family:var(--display);font-weight:700;font-size:46px;line-height:1;color:var(--rec);font-variant-numeric:tabular-nums}
.big span{font-weight:900;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin:0}
.stats dt{font-size:12px;opacity:.65}
.stats dd{margin:0;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.stats .wide{grid-column:1/-1}
.acts{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.copied{font-size:13px;font-weight:900;color:var(--ok);min-height:1.3em;user-select:text;-webkit-user-select:text}
.note{margin:0;font-size:14px;opacity:.75}
@media (prefers-reduced-motion:reduce){.card{animation:none}.rec i{animation:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c" aria-label="從後面看，一個大學生載著同學騎機車，邊騎邊唸英文報告，進彎的時候壓車"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="top">
      <div class="left">
        <div class="rec"><i></i><span>REC</span><span id="take">Take 1</span><span id="clock">00:00</span></div>
        <div class="score"><small>帥度</small><b id="num">0</b><em id="streak"></em></div>
      </div>
      <div class="side">
        <button class="icon-btn" id="pauseBtn" type="button" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.6"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.6"/></svg></button>
        <button class="icon-btn" id="mute" type="button" aria-label="聲音開關"></button>
      </div>
    </div>
    <div class="cap"><b id="cap"></b><span id="hint"></span></div>
  </div>

  <div class="screen" id="title">
    <h1 class="logo">用生命做<span>英文報告</span></h1>
    <p class="tag">騎車拍英文報告。壓得越低越帥，壓過頭就摔。</p>
    <ul class="how">
      <li><b>進彎按住</b> 壓車</li>
      <li><b>放開</b> 回正</li>
      <li><b>貼近紅線</b> 磨出火花</li>
      <li><b>壓不夠</b> 衝出彎道</li>
    </ul>
    <div class="levels" id="levels"></div>
    <div class="best" id="best"></div>
    <a class="home" href="../">其他遊戲</a>
  </div>

  <div class="screen" id="over" hidden>
    <div class="card">
      <p class="verdict" id="ovTitle"></p>
      <div class="big"><b id="ovBig"></b><span id="ovBigL"></span></div>
      <dl class="stats">
        <div><dt>作業</dt><dd id="ovLv"></dd></div>
        <div><dt>報告進度</dt><dd id="ovProg"></dd></div>
        <div><dt>帥度</dt><dd id="ovScore"></dd></div>
        <div><dt id="ovXL"></dt><dd id="ovX"></dd></div>
        <div class="wide"><dt id="ovNoteL"></dt><dd id="ovNote"></dd></div>
      </dl>
      <div class="acts">
        <button class="btn" id="again" type="button">重拍</button>
        <button class="btn ghost" id="toList" type="button">作業清單</button>
        <button class="btn ghost" id="share" type="button">複製戰績</button>
      </div>
      <div class="copied" id="copied"></div>

  </div>

  <div class="screen" id="pause" hidden>
    <div class="card">
      <p class="verdict">暫停中</p>
      <p class="note">離開畫面會自動暫停，按「繼續」再接著騎。</p>
      <div class="acts"><button class="btn" id="resume" type="button">繼續</button><button class="btn ghost" id="quit" type="button">作業清單</button></div>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, TAU=Math.PI*2, RAD=Math.PI/180;
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[(Math.random()*a.length)|0];
const hash=(i,k)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=id=>document.getElementById(id);
const INK='#26253a',PAPER='#fff6e6',REC='#e5432f',SUN='#ffc93c',BAND='#35b08a';
const FONT='"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif',NUM='"Fredoka","Chiron GoRound TC",sans-serif';
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ───────── 規則 ─────────
   畫面是跟在後面拍的（像賽車遊戲那樣往前騎），看得到前面的路。一開始他停在路邊，喊「Go back, go back.」叫同學坐上後座，
   同學坐好就起步、開始唸報告，起步之後馬上就是第一個彎；
   之後是「彎 → 直線 → 彎 → 直線…」，每個彎唸一句。
   唯一的操作：按住＝往彎裡壓車（角度一直增加），放開＝回正。
   每個彎有兩條線：至少要壓到 req（壓不夠會往外飄，飄滿就衝出彎道），不能超過 lim（輪胎抓不住，超過就滑倒）。
   在這兩條線之間，壓得越靠近 lim 分數（帥度）漲得越快；最上面那一小段會磨出火花，分數再乘 2.5。
   彎裡偶爾有砂石、水窪、貓：先預告，然後 lim 掉下來一下，要趕快放一點。
   唸完整份報告＝過關，看帥度給成績；摔車＝這次 NG，改算「這支影片有多少人看」 */
const VW=360,VH=640,HOR=226,BX=180,BY=508;
// UP 按住時每秒壓幾度（越低越壓不下去，UP_FALL 是到 60 度時慢掉的比例），DOWN 放開時每秒回幾度，ST_CAP 直線上最多歪幾度
const UP=74,UP_FALL=.55,DOWN=90,TH_MAX=70,ST_CAP=13;
// RATE 壓到 lim 時每秒幾分；SPARK_U 以上磨火花，分數乘 SPARK_X；WIDE_T 完全沒壓的話幾秒衝出去；OVER_T 超過 lim 多久才算摔；IN_T/OUT_T 進彎、出彎時 req 漸變的時間
const RATE=40,SPARK_U=.84,SPARK_X=2.5,WIDE_T=.95,OVER_T=.1,IN_T=.55,OUT_T=.4;
// 開場：先停 GO_AT 秒，再花 GO_UP 秒加速，加速完就進第一個彎
const GO_AT=1.9,GO_UP=.75,MATE_AT=1.5,OPENING='Go back, go back.';
const EV={gravel:{n:'砂石',col:'#b9a98a'},puddle:{n:'水窪',col:'#7fc4e8'},cat:{n:'貓',col:'#3a3d52'},manhole:{n:'水溝蓋',col:'#8d909c'}};
// 一份作業一關。corners 幾個彎；grip 輪胎抓得住的最大角度；sharp 彎有多急（0~1）；dur 一個彎幾秒；speed 車速；
// ev 彎裡出狀況的機率和 lim 掉幾度；rain 抓地力忽高忽低；night 看不到紅線；pass 後座多揹一大包，反應變慢；wind 陣風一次吹歪幾度
const LEVELS=[
 {n:'自我介紹',c:'晴天，車少',sky:'day',corners:5,grip:55,sharp:[.12,.4],dur:[2.6,3.2],speed:1,
  lines:['Hello everyone. I am a student.','Today I will introduce myself.','I am twenty years old.','My hobby is riding scooter.','I ride very safe. Trust me.','That is all. Thank you.']},
 {n:'My Hometown',c:'路上有砂石',sky:'sunset',corners:6,grip:55,sharp:[.25,.55],dur:[2.8,3.6],speed:1.08,ev:{types:['gravel'],p:.6,drop:[9,13]},
  lines:['Today I want to introduce my hometown.','My hometown is very hot.','There are many scooters here.','The harbor is very beautiful.','We like to drink bubble tea.','You should come to visit.','Thank you for your listening.']},
 {n:'My Hobby',c:'下雨，路很滑',sky:'rain',corners:6,grip:49,sharp:[.2,.5],dur:[2.8,3.6],speed:1.05,rain:2,ev:{types:['puddle','manhole'],p:.5,drop:[7,11]},
  lines:['It is raining, but the report is due today.','My hobby is watching the rain.','Rain makes the road very slippery.','But I am not afraid.','Because I have a raincoat.','The raincoat cannot save me.','Thank you, teacher.']},
 {n:'My Family',c:'晚上，看不到極限在哪',sky:'night',corners:7,grip:54,sharp:[.25,.55],dur:[2.8,3.6],speed:1.1,night:true,ev:{types:['cat'],p:.5,drop:[9,13]},
  lines:['Good evening, everyone.','This is my family.','My mother says: do not ride at night.','My father says: listen to your mother.','My sister says nothing. She is sleeping.','My cat is on the road. Why.','I love my family.','Good night. Thank you.']},
 {n:'My Dream',c:'山路，都是髮夾彎',sky:'hill',corners:6,grip:56,sharp:[.6,.9],dur:[4.4,5.8],speed:1.12,ev:{types:['gravel'],p:.45,drop:[8,12]},
  lines:['Today I will talk about my dream.','My dream is to be a racer.',"My teacher's dream is that I graduate.",'This mountain road has many curves.','Curves make a man grow up.','I can see my future. It is a guardrail.','Thank you.']},
 {n:'期中報告',c:'同學揹著全組的道具，車變很鈍',sky:'day',corners:7,grip:54,sharp:[.3,.6],dur:[3,3.8],speed:1.12,pass:true,ev:{types:['gravel','manhole'],p:.5,drop:[8,12]},
  lines:['This is our midterm report.','This is my classmate. Say hi.','He did not do anything in this report.','But he is heavy.','Teamwork is very important.','He is leaning the wrong way.','We are good partners.','Thank you for your attention.']},
 {n:'小組報告',c:'颱風天，有陣風',sky:'rain',corners:7,grip:53,sharp:[.3,.6],dur:[3,3.8],speed:1.15,wind:7,
  lines:['Today is a typhoon day.','School is closed, but the deadline is not.','My group members are all missing.','So I do this report alone.','The wind is my only teammate.','The wind is not a good teammate.','I will remember this.','Thank you.']},
 {n:'期末報告',c:'晚上、下雨、砂石、陣風',sky:'night',corners:10,grip:53,sharp:[.3,.7],dur:[3,4.4],speed:1.2,rain:1.8,night:true,wind:4,ev:{types:['gravel','puddle','cat','manhole'],p:.45,drop:[7,11]},

const roadY=p=>HOR+(VH+30-HOR)*p*p,roadC=p=>BX+lerp(curve,curveFar,1-p)*150*(1-p)*(1-p),roadW=p=>16+290*p*p;

  const S=SKY[lv.sky],W=wx1-wx0;
  let gr=g.createLinearGradient(0,wy0,0,HOR);gr.addColorStop(0,S[0]);gr.addColorStop(1,S[1]);g.fillStyle=gr;g.fillRect(wx0,wy0,W,HOR-wy0+2);
  if(lv.sky==='night'){g.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<40;i++){const x=wx0+((hash(i,1)*900-bgX*.05)%W+W)%W,y=wy0+hash(i,2)*(HOR-wy0-30);g.fillRect(x,y,1.6,1.6);}}
  else if(lv.sky!=='rain'){g.fillStyle=lv.sky==='sunset'?'#fff1b8':'#fffbe6';g.beginPath();g.arc(BX+96-curve*30,lv.sky==='sunset'?HOR-34:86,lv.sky==='sunset'?34:24,0,TAU);g.fill();}
  // 遠山、近一點的房子和椰子樹：彎的時候往旁邊捲
  const band=(k,amp,base,col,step)=>{g.fillStyle=col;g.beginPath();g.moveTo(wx0,HOR+2);for(let x=wx0-step;x<=wx1+step;x+=step){const wxx=x+bgX*k,i=Math.floor(wxx/step),f=wxx/step-i,h=lerp(hash(i,7),hash(i+1,7),f*f*(3-2*f));g.lineTo(x,HOR-base-h*amp);}g.lineTo(wx1,HOR+2);g.closePath();g.fill();};
  band(.12,lv.sky==='hill'?90:46,10,lv.sky==='night'?'#1d2140':lv.sky==='rain'?'#8a949c':'#9bbfae',70);
  if(lv.sky!=='hill'){const col=lv.sky==='night'?'#262a4a':lv.sky==='rain'?'#77808a':'#b7c2c9';for(let i=-2;i<12;i++){const k=Math.floor(bgX*.3/46)+i,x=k*46-bgX*.3+wx0,h=18+hash(k,3)*46;g.fillStyle=col;g.fillRect(x,HOR-h,38,h+2);
      if(lv.sky==='day'||lv.sky==='sunset'){g.fillStyle='rgba(38,37,58,.16)';for(let q=0;q<3;q++)for(let w=0;w<Math.floor(h/13);w++)g.fillRect(x+5+q*11,HOR-h+6+w*13,7,7);if(hash(k,5)<.4){g.fillStyle='#3a3d6a';g.fillRect(x+30,HOR-h+4,8,Math.min(34,h-6));g.fillStyle='rgba(255,246,230,.8)';for(let w=0;w<3;w++)g.fillRect(x+32,HOR-h+8+w*9,4,5);}}
      if(lv.sky==='night'){g.fillStyle='rgba(255,220,130,.75)';for(let q=0;q<3;q++)if(hash(k,q+9)<.55)g.fillRect(x+6+q*10,HOR-h+8+hash(k,q)*14,5,6);}}}
  else band(.3,60,4,'#6fa56a',52);
  // 地面和路
  g.fillStyle=S[2];g.fillRect(wx0,HOR,W,wy1-HOR);
  const N=22;g.fillStyle=S[3];g.beginPath();for(let i=0;i<=N;i++){const p=i/N;g.lineTo(roadC(p)-roadW(p),roadY(p));}for(let i=N;i>=0;i--){const p=i/N;g.lineTo(roadC(p)+roadW(p),roadY(p));}g.closePath();g.fill();
  // 路邊的白線、中間的黃虛線（往遠處退，看起來在往前騎）
  g.strokeStyle='rgba(255,246,230,.9)';for(const sd of[-1,1]){g.beginPath();for(let i=0;i<=N;i++){const p=i/N;g.lineWidth=1+5*p;g.lineTo(roadC(p)+sd*roadW(p)*.9,roadY(p));}g.lineWidth=3;g.stroke();}
  g.fillStyle=SUN;for(let k=0;k<9;k++){const z=((k/9-roadT*.5)%1+1)%1,p0=Math.pow(1-z,2.2),p1=Math.pow(Math.max(0,1-z-.05),2.2);if(p0<.01)continue;const w0=1+7*p0,w1=1+7*p1;
    g.beginPath();g.moveTo(roadC(p0)-w0,roadY(p0));g.lineTo(roadC(p0)+w0,roadY(p0));g.lineTo(roadC(p1)+w1,roadY(p1));g.lineTo(roadC(p1)-w1,roadY(p1));g.closePath();g.fill();}
  // 路邊的椰子樹、路燈：一棵一棵往後退
  const objs=[];for(let k=0;k<8;k++){const z=((k/8-roadT*.5)%1+1)%1;objs.push([Math.pow(1-z,2.2),k]);}objs.sort((a,b)=>a[0]-b[0]);
  for(const[p,k]of objs){if(p<.012||p>.8)continue;const sd=k%2?1:-1,x=roadC(p)+sd*(roadW(p)+14+46*p),y=roadY(p),s=.18+p*1.5;g.save();g.translate(x,y);g.scale(s,s);g.lineJoin='round';g.lineCap='round';
    if(lv.sky==='night'||lv.sky==='rain'){g.strokeStyle='#3b3d4d';g.lineWidth=5;g.beginPath();g.moveTo(0,0);g.lineTo(0,-120);g.lineTo(-sd*26,-128);g.stroke();g.fillStyle=lv.sky==='night'?'#ffe9a6':'#e8e2c8';g.beginPath();g.ellipse(-sd*30,-126,10,5,0,0,TAU);g.fill();

    else if(lv.sky!=='hill'&&k%3===2){for(let q=0;q<2;q++){const x0=sd*(6+q*30);g.strokeStyle=INK;g.lineWidth=2.5;g.fillStyle=INK;g.beginPath();g.arc(x0-9,-5,5.5,0,TAU);g.arc(x0+9,-5,5.5,0,TAU);g.fill();g.fillStyle=['#c9ced6','#3a3d52','#e4572e','#5c7fb8'][(k+q)%4];rrect(g,x0-12,-22,24,13,5);g.fill();g.stroke();g.beginPath();g.moveTo(x0-sd*9,-22);g.lineTo(x0-sd*11,-33);g.stroke();}}
    else{g.strokeStyle='#8a6a48';g.lineWidth=7;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(sd*8,-60,sd*2,-112);g.stroke();g.strokeStyle=lv.sky==='hill'?'#3f7d4a':'#4f9a6e';g.lineWidth=6;for(let q=0;q<6;q++){const a=q/6*TAU+k;g.beginPath();g.moveTo(sd*2,-112);g.quadraticCurveTo(sd*2+Math.cos(a)*26,-128+Math.sin(a)*10,sd*2+Math.cos(a)*44,-104+Math.sin(a)*18);g.stroke();}}
    g.restore();}
  // 彎裡的狀況：從前面遠遠地過來，到車子底下的那一刻生效
  if(seg&&seg.type==='corner')for(const e of seg.ev){const dt=e.t-seg.t;if(dt>.8||dt<-.3)continue;const pp=clamp(.9-dt*.95,0,1.3);if(pp<.04)continue;const x=roadC(pp)+(bikeX()-BX)*pp*pp,y=roadY(pp),s=.2+pp*1.15;
    g.save();g.translate(x,y);g.scale(s,s*.45);g.fillStyle=EV[e.type].col;g.strokeStyle=INK;g.lineWidth=3;
    if(e.type==='gravel'){for(let q=0;q<22;q++){g.beginPath();g.arc((hash(q,1)-.5)*110,(hash(q,2)-.5)*60,3+hash(q,3)*5,0,TAU);g.fill();}}
    else if(e.type==='puddle'){g.globalAlpha=.8;g.beginPath();g.ellipse(0,0,62,30,0,0,TAU);g.fill();g.globalAlpha=1;}
    else if(e.type==='manhole'){g.beginPath();g.ellipse(0,0,44,40,0,0,TAU);g.fill();g.stroke();g.beginPath();for(let q=-2;q<=2;q++){g.moveTo(-36,q*14);g.lineTo(36,q*14);}g.stroke();}
    else{g.scale(1,1/.45);g.beginPath();g.ellipse(0,-12,22,12,0,0,TAU);g.fill();g.beginPath();g.arc(-20,-22,10,0,TAU);g.fill();g.beginPath();g.moveTo(-28,-28);g.lineTo(-26,-38);g.lineTo(-20,-30);g.moveTo(-16,-30);g.lineTo(-12,-38);g.lineTo(-12,-27);g.fill();g.lineWidth=5;g.strokeStyle=EV.cat.col;g.beginPath();g.moveTo(20,-14);g.quadraticCurveTo(36,-24,30,-38);g.stroke();g.fillStyle=SUN;g.fillRect(-25,-25,3,3);g.fillRect(-18,-25,3,3);}
    g.restore();}
}

  else for(const sd of[-1,1]){const k=o.knee===sd?1:0;g.strokeStyle=INK;g.lineWidth=17;g.beginPath();g.moveTo(sd*16,-128);g.lineTo(sd*(34+k*18),-98+k*8);g.lineTo(sd*(30+k*8),-70);g.stroke();g.strokeStyle=jeans;g.lineWidth=12;g.beginPath();g.moveTo(sd*16,-128);g.lineTo(sd*(34+k*18),-98+k*8);g.lineTo(sd*(30+k*8),-72);g.stroke();g.fillStyle='#fff6e6';g.strokeStyle=INK;g.lineWidth=3;rrect(g,sd*(30+k*8)-9,-76,18,11,5);g.fill();g.stroke();}

let meterX=320;

  const W=cv.width,H=cv.height,k=dpr*scale;let sx=0,sy=0;if(shake>0&&!reduced){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;}

  drawScene();
  const ct=mode==='crash'?crash.t:0,dir=seg&&seg.type==='corner'?seg.dir:lastDir,night=!!lv.night;let bx=bikeX(),by=BY,lean=th*RAD*dir,sc=1;
  // 開場：同學從鏡頭旁邊走過去、坐上後座（MATE_AT 之後算坐好），坐好才起步
  const onStart=mode==='ride'&&seg.type==='start',me=onStart?clamp((seg.t-.55)/(MATE_AT-.55),0,1):1,seated=mode!=='title'&&me>=1;
  // 摔車：壓過頭是整台倒下去、往彎的方向滑出去；壓不夠是直直衝出路外
  if(mode==='crash'){if(crash.type==='low'){lean=dir*lerp(crash.lean*RAD,1.5,clamp(ct/.2,0,1));bx+=dir*Math.min(170,ct*260)-dir*ct*20;by-=Math.min(90,ct*120);sc=Math.max(.55,1-ct*.3);}
    else{bx-=dir*ct*240;by-=Math.min(150,ct*200);lean=-dir*Math.min(.5,ct*1.2);sc=Math.max(.35,1-ct*.5);}}
  if(night&&mode!=='over'){g.fillStyle='rgba(255,243,176,.16)';g.beginPath();g.moveTo(bx-16,by-120);g.lineTo(roadC(.2)-70,roadY(.2));g.lineTo(roadC(.2)+70,roadY(.2));g.lineTo(bx+16,by-120);g.closePath();g.fill();}
  g.save();g.translate(bx,by);g.scale(sc,sc);g.translate(-bx,-by);
  if(!(mode==='over'&&!lastWon))drawBike(bx,by,lean,{stand:onStart&&seg.t<GO_AT+.15,mate:seated,pack:lv.pass,knee:mode==='ride'&&th>26?dir:0,night});g.restore();
  for(const p of parts){g.globalAlpha=clamp(p.life*3,0,1);g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.fill();}g.globalAlpha=1;
  if(mode==='title')drawMate(0);else if(onStart&&me<1)drawMate(me*me*(3-2*me));
  // 天氣
  if(lv.rain){g.fillStyle='rgba(70,90,130,.18)';g.fillRect(wx0,wy0,wx1-wx0,wy1-wy0);g.strokeStyle='rgba(220,235,255,.5)';g.lineWidth=1.4;g.beginPath();
    for(let i=0;i<50;i++){const x=wx0+hash(i,1)*(wx1-wx0+80)-40,y=wy0+((hash(i,2)*700+time*(560+hash(i,3)*260))%(wy1-wy0+60))-30;g.moveTo(x,y);g.lineTo(x-6,y+18);}g.stroke();}
  if(lv.wind&&(gustWarn||gustRem)){g.strokeStyle='rgba(255,246,230,.75)';g.lineWidth=2;g.beginPath();for(let i=0;i<14;i++){const y=wy0+hash(i,5)*(wy1-wy0),x=wx0+((hash(i,6)*500+time*900)%(wx1-wx0+140))-70;g.moveTo(x,y);g.lineTo(x+44,y+2);}g.stroke();}
  if(lv.night){const gr=g.createRadialGradient(bx,by-90,40,bx,by-90,330);gr.addColorStop(0,'rgba(10,10,30,0)');gr.addColorStop(1,'rgba(10,10,30,.62)');g.fillStyle=gr;g.fillRect(wx0,wy0,wx1-wx0,wy1-wy0);
    g.fillStyle='rgba(255,90,70,.3)';g.beginPath();g.ellipse(bx+Math.sin(lean)*76,by-76*Math.cos(lean),22,16,0,0,TAU);g.fill();}
  if(mode!=='title'){meterX+=((meterSide<0?wx0+16:wx1-42)-meterX)*.18;drawMeter();}
  // 下一個彎的預告牌
  if(mode==='ride'&&seg.type!=='corner'&&seg.next){const n=seg.next,left=seg.dur-seg.t,a=clamp(seg.t*4,0,1)*clamp(left*5,0,1);g.globalAlpha=a;g.fillStyle=SUN;g.strokeStyle=INK;g.lineWidth=3;rrect(g,BX-74,150,148,46,10);g.fill();g.stroke();
    g.fillStyle=INK;g.font='900 19px '+FONT;g.textAlign='center';g.textBaseline='middle';const arrows=n.sharp>.6?3:n.sharp>.35?2:1,ar=(n.dir>0?'▶':'◀').repeat(arrows);g.fillText(n.dir>0?(n.sharp>.6?'髮夾彎 ':n.sharp>.35?'急彎 ':'彎 ')+ar:ar+(n.sharp>.6?' 髮夾彎':n.sharp>.35?' 急彎':' 彎'),BX,168);
    g.fillStyle=REC;g.fillRect(BX-64,184,128*clamp(left/seg.dur,0,1),5);g.globalAlpha=1;}
  if(mode==='ride'&&wide>.3){g.globalAlpha=clamp((wide-.3)*2.2,0,1)*(.6+.4*Math.sin(time*18));g.fillStyle=REC;g.font='900 24px '+FONT;g.textAlign='center';g.lineWidth=6;g.strokeStyle=INK;g.strokeText('走大了！快壓！',BX,236);g.fillText('走大了！快壓！',BX,236);g.globalAlpha=1;}
  g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  for(const p of pops){const e=1-p.life/p.dur,pp=1+.45*Math.pow(clamp(1-e*6,0,1),2);g.font='900 '+p.size+'px '+FONT;g.globalAlpha=clamp(p.life*4,0,1);g.save();g.translate(clamp(p.x,wx0+70,wx1-70),p.y-e*20);g.scale(pp,pp);g.lineWidth=6;g.strokeStyle=INK;g.strokeText(p.text,0,0);g.fillStyle=p.col;g.fillText(p.text,0,0);g.restore();}
  g.globalAlpha=1;g.textBaseline='alphabetic';g.textAlign='left';
  // 取景框的四個角
  g.setTransform(k,0,0,k,ox*dpr,oy*dpr);g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=2.5;for(const[cx,cy,dx,dy]of[[wx0+10,wy0+10,1,1],[wx1-10,wy0+10,-1,1],[wx0+10,wy1-10,1,-1],[wx1-10,wy1-10,-1,-1]]){g.beginPath();g.moveTo(cx+dx*22,cy);g.lineTo(cx,cy);g.lineTo(cx,cy+dy*22);g.stroke();}
  g.setTransform(1,0,0,1,0,0);
  if(flash>0){g.fillStyle='#fff';g.globalAlpha=flash*.7;g.fillRect(0,0,W,H);g.globalAlpha=1;}
  if(mode==='crash'&&ct>1.25){g.fillStyle='#000';g.globalAlpha=clamp((ct-1.25)*2.2,0,1);g.fillRect(0,0,W,H);g.globalAlpha=1;}
}

/* ───────── HUD 與流程 ───────── */
const el={hud:$('hud'),num:$('num'),cap:$('cap'),hint:$('hint'),title:$('title'),over:$('over'),best:$('best'),mute:$('mute')};
let lastHint=null,lastNum=-1,lastClock=-1,lastStreak='',paused=false;
function muteIcon(){el.mute.innerHTML=Snd.on
  ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>'
  :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  el.mute.setAttribute('aria-pressed',String(!Snd.on));}
function hud(){
  if(mode!=='ride'&&mode!=='crash'&&mode!=='done')return;
  const n=Math.round(score);if(n!==lastNum){lastNum=n;el.num.textContent=n.toLocaleString('en-US');}
  const c=Math.floor(clock);if(c!==lastClock){lastClock=c;$('clock').textContent=String(Math.floor(c/60)).padStart(2,'0')+':'+String(c%60).padStart(2,'0');}
  const st=streak>0?`連帥 ×${mult.toFixed(1)}`:'';if(st!==lastStreak){lastStreak=st;$('streak').textContent=st;}
  const shown=Math.min(capFull.length,Math.floor((time-lineAt)*24));if(shown!==capShown){capShown=shown;el.cap.textContent=capFull.slice(0,shown);}
  const inC=seg&&seg.type==='corner';
  const h=mode!=='ride'?'':evWarn?`${EV[evWarn.type].n}！先放一點`:evNow?'撐住…':inC&&wide>.3?'':sparkOn?'磨到火花了，分數 ×2.5':inC&&th<reqNow-1&&seg.t>IN_T?'壓不夠，按住！':inC&&li===0&&cornersDone<2?'越靠近紅線分數越高，碰到紅線就摔':!inC&&cornersDone===0&&seg.type==='start'?(li===0?(seg.t<MATE_AT?'「Go back」：叫同學坐上後座':'起步之後馬上就是彎。按住畫面壓車，放開回正'):'同學上車，起步就過彎'):'';
  if(h!==lastHint){lastHint=h;el.hint.textContent=h;}
  Snd.tune(lv.speed*(.35+.65*spd),th,uNow,sparkOn);
}
const H=1/120;let acc=0,last=0,holdLoop=false;
function setPaused(p){if(p&&(paused||mode!=='ride'))return;if(!p&&!paused)return;paused=p;$('pause').hidden=!p;last=0;acc=0;hold=false;ids.clear();if(p)Voice.stop();if(Snd.ctx){try{p?Snd.ctx.suspend():Snd.ctx.resume();}catch(e){}}if(p)$('resume').focus({preventScroll:true});}
function frame(now){
  const dt=Math.min(.05,(now-(last||now))/1000);last=now;
  if(!paused&&!holdLoop){acc+=dt;let n=0;while(acc>=H&&n++<10){tick(H);acc-=H;}if(n>=10)acc=0;hud();}
  render();requestAnimationFrame(frame);
}

/* ───────── 輸入：按住＝壓車，放開＝回正 ───────── */
const ids=new Set();
gameEl.addEventListener('pointerdown',e=>{if(e.target.closest('button,a,.card,.levels'))return;e.preventDefault();Snd.init();ids.add(e.pointerId);if(mode==='ride'&&!paused)hold=true;});
const upEnd=e=>{ids.delete(e.pointerId);if(!ids.size)hold=false;};
window.addEventListener('pointerup',upEnd);window.addEventListener('pointercancel',upEnd);
gameEl.addEventListener('contextmenu',e=>e.preventDefault());
// App 內建瀏覽器會把滑動當成「關掉這一頁」，所以遊戲畫面上的觸控不交給瀏覽器（清單和卡片可以捲的地方除外）
for(const t of['touchstart','touchmove'])gameEl.addEventListener(t,e=>{if(e.cancelable&&!(e.target.closest&&e.target.closest('button,a,.card,.levels')))e.preventDefault();},{passive:false});
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now(),btn=e.target&&e.target.closest&&e.target.closest('button,a');if(now-lastTouchEnd<=350&&!btn&&e.cancelable)e.preventDefault();lastTouchEnd=now;},{passive:false});
for(const t of['gesturestart','gesturechange','gestureend'])document.addEventListener(t,e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden)setPaused(true);});
window.addEventListener('blur',()=>setPaused(true));
window.addEventListener('pagehide',()=>setPaused(true));
window.addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(!e.repeat)setPaused(!paused);return;}
  if(e.code!=='Space'&&e.code!=='Enter'&&e.code!=='ArrowDown')return;if(e.target.closest&&e.target.closest('button,a'))return;e.preventDefault();if(paused||e.repeat)return;Snd.init();
  if(mode==='ride')hold=true;else if(mode==='over')startRide(+$('again').dataset.go);else if(mode==='title')startRide(grades[unlocked]?unlocked:unlocked);});
window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowDown'){if(!ids.size)hold=false;}});
$('levels').addEventListener('click',e=>{const b=e.target.closest('.lv');if(!b||b.disabled)return;startRide(+b.dataset.i);});
$('again').addEventListener('click',()=>startRide(+$('again').dataset.go));
$('toList').addEventListener('click',openTitle);$('quit').addEventListener('click',openTitle);
$('pauseBtn').addEventListener('click',()=>setPaused(true));
$('resume').addEventListener('click',()=>setPaused(false));
el.mute.addEventListener('click',()=>{Snd.init();Snd.setOn(!Snd.on);muteIcon();});
$('share').addEventListener('click',async()=>{
  const link=document.querySelector('link[rel=canonical]'),out=$('copied');
  const text=(lastWon?`我用生命做完了英文報告「${lv.n}」，成績 ${grade}，帥度 ${Math.round(score)}。`:`我用生命做英文報告「${lv.n}」，壓到 ${Math.round(crash.lean)}° 摔車，影片 ${views.toLocaleString('en-US')} 人觀看。`)+'十次車禍九次快，一次英文報告。'+(link?' '+link.href:'');
  try{await navigator.clipboard.writeText(text);out.textContent='已複製，貼到脆上炫耀吧';}
  catch(e){out.textContent=text;const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);}
});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(gameEl);

muteIcon();resize();openTitle();requestAnimationFrame(frame);
window.__bg={LEVELS,SPARK_U,get mode(){return mode},get th(){return th},get req(){return reqNow},get lim(){return limNow},get u(){return uNow},get score(){return score},get par(){return par},get seg(){return seg},get wide(){return wide},
  get cornersDone(){return cornersDone},get grade(){return grade},get views(){return views},get crash(){return crash},get evWarn(){return evWarn},get evNow(){return evNow},get unlocked(){return unlocked},set unlocked(v){unlocked=v;},get grades(){return grades},get spark(){return sparkOn},get gust(){return gustWarn?gustDir:0},
  get hold(){return hold},set hold(v){hold=v;},set loopHold(v){holdLoop=v;},start:startRide,tick,openTitle};
})();
